<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo film</title>
<link rel="stylesheet" href="film.css">
<link rel="stylesheet" href="mascot.css">
</head>
<body>
<!-- The promo film. Opens from file:// with no fetches: data.js (tools/build-data.mjs) carries the timeline, plates
     and the scene file list. Dev player keys: Space · ←/→ · Shift+←/→ · [ ] · h · m · r. ?scene=<id> · ?t=12.5 ·
     &pause · ?export=1 (render mode, window.__film). -->
<div id="viewport"><div id="stage"></div></div>
<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<script src="kit.js"></script>
<script src="mascot.js"></script>
<script>
  // Inject every scene listed in FILM_DATA (no hard-coded list): CSS first, then the scene scripts in order.
  // Injected scripts run asynchronously, so main.js awaits window.__filmScenes before F.build().
  (function () {
    var D = window.FILM_DATA || {};
    if (D.title) document.title = D.title;
    (D.sceneCss || []).forEach(function (href) {
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l);
    });
    window.__filmScenes = Promise.all((D.sceneFiles || []).map(function (src) {
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = src; s.async = false;                       // execute in list order
        s.onload = function () { resolve(); };
        s.onerror = function () { if (window.F) F.violation('scene file failed to load: ' + src); resolve(); };
        document.body.appendChild(s);
      });
    }));
  })();
</script>
<script src="main.js"></script>
</body>
</html>
