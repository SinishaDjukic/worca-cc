{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "worca.fullname" . }}-workers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worca.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "worca.fullname" . }}-workers
subjects:
  - kind: ServiceAccount
    name: {{ include "worca.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
