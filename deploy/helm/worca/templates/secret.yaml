{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# The controller's secrets as envFrom (secrets.values). Prefer secrets.existingSecret with a
# Secret you manage outside Helm (sealed-secrets, external-secrets, kubectl): values files
# with tokens in them end up in shell histories and release records.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "worca.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worca.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
