{{- if .Values.networkPolicy.enabled }}
# Workers: nothing may connect to them, and they may connect only to the controller's workers
# port, the broker (when on), cluster DNS and the internet (workerEgressCidrs minus
# workerEgressExceptCidrs: by default everything except RFC 1918 and the cloud metadata
# address). The agents' own network is the Worca-level egress policy's job; this is the floor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worca.fullname" . }}-workers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worca.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "worca.workerLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "worca.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.controller.workerPort }}
          protocol: TCP
    {{- if .Values.broker.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "worca.brokerSelectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.workerEgressCidrs }}
    - to:
        {{- range .Values.networkPolicy.workerEgressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- /* Kubernetes refuses an except outside its cidr: the (IPv4) private-range exceptions apply to the IPv4 whole-internet block only. */}}
            {{- if and $.Values.networkPolicy.workerEgressExceptCidrs (eq . "0.0.0.0/0") }}
            except:
              {{- toYaml $.Values.networkPolicy.workerEgressExceptCidrs | nindent 14 }}
            {{- end }}
        {{- end }}
    {{- end }}
---
# The controller: the UI port from anywhere (the Ingress controller, port-forward); the workers
# port from worker pods of this instance only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worca.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "worca.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "worca.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: {{ .Values.controller.port }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "worca.workerLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.controller.workerPort }}
          protocol: TCP
{{- end }}
