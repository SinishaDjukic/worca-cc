<title>Shaper Refresh Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Classic Worca (dev): tokens from ui/public/shell/self-hosted.css, split from light-dark() into a light :root and dark redefinitions. */
:root{
  --bg:#F1F1EF;--canvas-2:#FBFBF9;--panel:#FFFFFF;--surface:#FFFFFF;--field:#F6F6F4;--hover:#EBEBE8;
  --side-bg:#FAFAFA;--side-ink:#737373;--side-sel-ink:#171717;--side-sel-bg:#EFEFEF;
  --ink:#19191B;--ink-2:#5C5C63;--ink-3:#9A9AA1;--on-ink:#FFFFFF;--on-signal:#19191B;
  --line:#ECECEA;--line-2:#E3E3E0;--seq:#B7B7BC;
  --green-bg:#E2F3DF;--green:#5BAE5B;--green-ink:#2F7A38;--green-ink-strong:#2C7535;
  --peach-bg:#FCEEDA;--peach:#EFA63C;--peach-ink:#B5751A;
  --red-bg:#FBE3E0;--red:#E76A5A;--red-ink:#C5483A;--red-ink-strong:#B23F33;
  --blue-bg:#DEEFF7;--blue:#5BA6CC;--blue-ink:#3782A8;--blue-ink-strong:#2B6A8C;
  --violet-bg:#EAE6F8;--violet:#8C7FD6;--violet-ink:#6353B8;--violet-ink-strong:#5B4BB0;
  --amber-bg:#FCE8C8;--amber:#E6962A;--amber-ink:#A66510;--amber-ink-strong:#8E550B;
  --amber-wash:#FEF7EC;--amber-line:#F5D9A8;
  --slate-bg:#E8ECF0;--slate:#8A96A3;--slate-ink:#58646F;
  --knob:#FFFFFF;--switch-off:#8A8A85;
  --scrim:rgba(25,25,27,.42);
  --shadow-menu:0 12px 34px rgba(25,25,27,.12);
  --shadow-sheet:0 18px 60px rgba(25,25,27,.14),0 2px 6px rgba(25,25,27,.06);
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-pill:999px;
  --fs-caption:11px;--fs-meta:12px;--fs-body:13px;--fs-section:15px;--fs-subpage:18px;--fs-page:22px;
  --sans:'Poppins',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --btn-hover:color-mix(in srgb,var(--ink) 7%,var(--panel));
  --quiet-hover:color-mix(in srgb,var(--ink) 7%,transparent);
  --row-selected:color-mix(in srgb,var(--ink) 8%,transparent);
  --amber-ring:color-mix(in srgb,var(--amber) 55%,var(--line-2));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161614;--canvas-2:#1B1B19;--panel:#222220;--surface:#34342F;--field:#2C2C29;--hover:#353531;
  --side-bg:#222220;--side-ink:#B4B4AE;--side-sel-ink:#ECECE8;--side-sel-bg:#353531;
  --ink:#ECECE8;--ink-2:#B4B4AE;--ink-3:#9E9E98;--on-ink:#161614;
  --line:#30302D;--line-2:#494944;--seq:#8E8E92;
  --green-bg:#1C2F1D;--green-ink:#8FD48F;--green-ink-strong:#8FD48F;
  --peach-bg:#33261A;--peach-ink:#F2B96A;
  --red-bg:#34201D;--red-ink:#F08C7E;--red-ink-strong:#F08C7E;
  --blue-bg:#1A2A33;--blue-ink:#86C4E3;--blue-ink-strong:#86C4E3;
  --violet-bg:#262336;--violet-ink:#B3A8EE;--violet-ink-strong:#B3A8EE;
  --amber-bg:#332715;--amber-ink:#F0B45A;--amber-ink-strong:#F0B45A;
  --amber-wash:#322816;--amber-line:#6A5228;
  --slate-bg:#262A2E;--slate-ink:#B3BEC8;
  --knob:#ECECE8;--switch-off:#6B6B66;
  --scrim:rgba(0,0,0,.62);
  --shadow-menu:0 12px 34px rgba(0,0,0,.6);
  --shadow-sheet:0 18px 60px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161614;--canvas-2:#1B1B19;--panel:#222220;--surface:#34342F;--field:#2C2C29;--hover:#353531;
  --side-bg:#222220;--side-ink:#B4B4AE;--side-sel-ink:#ECECE8;--side-sel-bg:#353531;
  --ink:#ECECE8;--ink-2:#B4B4AE;--ink-3:#9E9E98;--on-ink:#161614;
  --line:#30302D;--line-2:#494944;--seq:#8E8E92;
  --green-bg:#1C2F1D;--green-ink:#8FD48F;--green-ink-strong:#8FD48F;
  --peach-bg:#33261A;--peach-ink:#F2B96A;
  --red-bg:#34201D;--red-ink:#F08C7E;--red-ink-strong:#F08C7E;
  --blue-bg:#1A2A33;--blue-ink:#86C4E3;--blue-ink-strong:#86C4E3;
  --violet-bg:#262336;--violet-ink:#B3A8EE;--violet-ink-strong:#B3A8EE;
  --amber-bg:#332715;--amber-ink:#F0B45A;--amber-ink-strong:#F0B45A;
  --amber-wash:#322816;--amber-line:#6A5228;
  --slate-bg:#262A2E;--slate-ink:#B3BEC8;
  --knob:#ECECE8;--switch-off:#6B6B66;
  --scrim:rgba(0,0,0,.62);
  --shadow-menu:0 12px 34px rgba(0,0,0,.6);
  --shadow-sheet:0 18px 60px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--panel);color:var(--ink);font:400 var(--fs-body)/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12px}
a{color:inherit}
svg.i{width:14px;height:14px;flex:0 0 14px;vertical-align:-2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
/* top bar (dev .tbar: 48px, panel, one line under) */
.top{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding:6px 0}
.top b{font-size:var(--fs-section);font-weight:600}
.top .sp{flex:1}
.top .navsel{display:none;width:100%;margin:8px 0 0}
/* frame */
.frame{display:grid;grid-template-columns:200px minmax(0,760px) minmax(240px,280px);justify-content:center;gap:24px;padding:20px 0 48px}
/* the journey list wears the sidebar's nav items (dev sidebar.css) */
.jn{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;background:var(--side-bg);border:1px solid var(--line);border-radius:var(--r-md);padding:8px}
.jn h3{font-size:var(--fs-meta);font-weight:600;color:var(--ink-2);margin:12px 0 4px 8px}
.jn h3:first-child{margin-top:4px}
.jn button{display:flex;gap:8px;width:100%;text-align:left;padding:4px 8px;border:0;border-radius:var(--r-sm);background:none;color:var(--side-ink);cursor:pointer;min-height:30px;align-items:center;font-weight:500}
.jn button .n{font:500 11px var(--sans);color:var(--ink-3);flex:0 0 18px;font-variant-numeric:tabular-nums}
.jn button:hover{background:var(--hover);color:var(--ink)}
.jn button[aria-current="page"]{background:var(--side-sel-bg);color:var(--side-sel-ink);font-weight:600}
.col{min-width:0;max-width:760px;width:100%;margin:0 auto}
.crumb{font-size:var(--fs-meta);color:var(--ink-2);margin:0 0 4px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.col>h2{font-size:var(--fs-subpage);line-height:1.25;font-weight:600;margin:0 0 16px}
.concept-note{border:1px dashed var(--peach);background:var(--peach-bg);color:var(--peach-ink);border-radius:var(--r-sm);padding:8px 12px;margin:0 0 16px;font-size:var(--fs-meta)}.concept-note b{font-weight:600}
.cx{display:block;width:100%;height:auto;color:var(--ink)}.cx text{font-family:inherit;font-size:12px;fill:currentColor}.cx .t{font-weight:600;font-size:13px}.cx .m{fill:var(--ink-2)}
/* the prototype's own way between screens: above the screen, plain links, never under a card where it reads as a product button */
.pager{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:0 0 8px;border-bottom:1px dashed var(--line-2);font-size:var(--fs-caption);color:var(--ink-2)}
.pager .sp{flex:1}
.pager{flex-wrap:wrap;justify-content:flex-end}.pager .btn{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;line-height:28px}
aside.notes{font-size:var(--fs-meta);min-width:0}
aside.notes h4{font-size:var(--fs-body);font-weight:600;margin:0 0 6px}
aside.notes .blk{margin-bottom:18px}
aside.notes ul{margin:0;padding-left:16px;color:var(--ink-2)}
aside.notes li{margin:4px 0}
aside.notes .chg li{color:var(--ink)}
@media (max-width:1320px){.frame{grid-template-columns:200px minmax(0,760px)}aside.notes{grid-column:2;border-top:1px solid var(--line);padding-top:16px}}
@media (max-width:760px){.frame{display:block;padding-top:12px}.jn{display:none}.top .navsel{display:block}aside.notes{margin-top:24px}}
/* buttons (dev design-system/buttons-component.css) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;margin:0;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer;box-shadow:none;transition:background-color .12s,border-color .12s}
.btn:hover:not(:disabled){background-color:var(--btn-hover)}
.btn svg{flex:none}
.btn-sm{height:28px;padding:0 10px;gap:5px;font-size:var(--fs-meta)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.btn-primary:hover:not(:disabled){background-color:color-mix(in srgb,var(--on-ink) 8%,var(--ink))}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-quiet:hover:not(:disabled){background-color:var(--quiet-hover);color:var(--ink)}
.btn-icon{width:32px;padding:0}
.btn-sm.btn-icon{width:28px}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit}
.link:hover{color:var(--ink-2)}
:is(button,a,textarea,select,input,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (pointer:coarse){.btn-sm,.btn{min-height:40px}.btn-icon{min-width:40px}}
/* segmented control (dev .seg: one --field container, the picked segment --surface) */
.seg{display:inline-flex;background:var(--field);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:var(--r-xs);background:transparent;color:var(--ink-2);font:500 13px/1 var(--sans);cursor:pointer;transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(25,25,27,.06)}
/* the role and model pickers: a small select-like control (dev .btn-sm skin) opening the one menu */
.spick{display:inline-flex;align-items:center;gap:4px;height:28px;max-width:100%;padding:0 8px 0 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);color:var(--ink);font:500 var(--fs-meta)/1 var(--sans);cursor:pointer;white-space:nowrap;vertical-align:middle;transition:background-color .12s}
.spick:hover{background:var(--btn-hover)}
.spick .v{min-width:0;overflow:hidden;text-overflow:ellipsis}
.spick svg.i{width:12px;height:12px;flex:0 0 12px;color:var(--ink-2)}
/* menu (dev .menu / .menu-item / .menu-sep) */
.menu{position:absolute;z-index:20;min-width:200px;max-width:min(320px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;box-shadow:var(--shadow-menu);font-size:var(--fs-body)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;min-height:30px;padding:4px 9px;border:0;border-radius:var(--r-sm);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus{background:var(--hover);outline:none}
.menu button .h{margin-left:auto;font-size:var(--fs-caption);color:var(--ink-2);font-variant-numeric:tabular-nums}
.menu button.danger{color:var(--red-ink)}
.menu button.danger:hover,.menu button.danger:focus{background:var(--red-bg)}
.menu .msep{height:1px;margin:4px 6px;background:var(--line);border:0}
.menu .ck{width:12px;flex:0 0 12px;font-size:12px;text-align:center}
.menu button .ri{color:var(--ink-2)}
.rl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rl .ri{color:var(--ink-2)}
/* chat: the person's bubble (dev .ask-user-bubble) */
.u-msg{margin:0 0 16px auto;max-width:78%;width:fit-content;padding:10px 14px;background:var(--field);border-radius:var(--r-md) var(--r-md) var(--r-sm) var(--r-md);line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
/* chat card (dev .ask-card.ask-mcard + metrics-card.css head) */
.ask-mcard{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin:0 0 16px;background:var(--panel)}
.ask-mcard-head{display:flex;gap:8px;align-items:center;min-width:0;min-height:24px}
.ask-mcard-title{order:1;flex:0 1 auto;font-weight:600;font-size:var(--fs-section);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ask-mcard-kind{order:2;display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:var(--r-xs);background:var(--field);color:var(--ink-2);font:500 11px/1 var(--sans);white-space:nowrap;flex:0 0 auto}
/* the status block (dev .run-status-head: the dot centred on the state word; detail 12px under it) */
.rc-state{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.rc-rail{flex:0 0 auto;display:flex;justify-content:center;align-items:center;height:20px}
.rc-word{font-weight:600}
.rc-detail{font-size:var(--fs-meta);color:var(--ink-2);margin-top:2px}
/* status dots (dev .status-dot: 8px, currentColor; the ? and ! are 12px filled symbols) */
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--slate);flex:0 0 auto}
.sd.peach{background:var(--peach);animation:wr-pulse 1.6s ease-in-out infinite}
.sd.green{background:var(--green)}.sd.violet{background:var(--violet)}
.sd.hollow{background:none;box-shadow:inset 0 0 0 2px var(--slate)}
.sd.q,.sd.x{width:12px;height:12px;display:inline-grid;place-items:center;color:var(--on-signal);font:700 9px/1 var(--sans)}
.sd.q{background:var(--amber)}
.sd.q::after{content:"?"}
.sd.x{background:var(--red)}
.sd.x::after{content:"!"}
@keyframes wr-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
/* facts (dev .rd-kv: 12px labels in one column, divided rows) */
.rd-kv{margin:12px 0 0;display:grid;grid-template-columns:minmax(96px,max-content) minmax(0,1fr);column-gap:12px}
.rd-kv-row{display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:baseline;padding:8px 0}
.rd-kv-row+.rd-kv-row{border-top:1px solid var(--line)}
.rd-kv-k{font-size:var(--fs-meta);color:var(--ink-2);max-width:160px;overflow-wrap:anywhere}
.rd-kv-v{min-width:0;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere}
@media (max-width:420px){.rd-kv{grid-template-columns:minmax(0,1fr)}.rd-kv-row{row-gap:2px}.rd-kv-k{max-width:none}}
.body{margin-top:12px}
.ask-mcard-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ask-mcard-actions .sp{flex:1}
.answered{margin-top:12px;font-size:var(--fs-meta);color:var(--ink-2);display:flex;gap:8px;align-items:center}
/* the one chip (dev: 18px, 11/500, 4px corner, filled) */
.chip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-xs);background:var(--field);color:var(--ink-2);font:500 11px/1 var(--sans);white-space:nowrap}
.chip.ai{background:var(--violet-bg);color:var(--violet-ink-strong)}
.cap{font-size:var(--fs-meta);color:var(--ink-2)}
.fig{font-variant-numeric:tabular-nums}
.e-only,.p-only{display:contents}
:root[data-reg="eng"] .p-only,:root:not([data-reg="eng"]) .e-only{display:none}
.variant{font-size:var(--fs-meta);color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
/* folds and check rows (dev shape-it.css .plan-fold, .plan-check-row) */
.fold-line{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.fold{display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;font:500 12px/1.4 var(--sans);color:var(--ink-2)}
.fold:hover{color:var(--ink)}
.fold b{color:var(--ink);font-weight:600}
.fold svg.i{width:12px;height:12px;flex:0 0 12px;transition:transform .15s}
.fold[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.fold-line .sp{flex:1}
/* a role's row: its state mark in the left mark column (as on every row of the card), the chevron at the far end */
.fold.rf{display:flex;flex:1 1 auto;width:100%;gap:8px;min-height:30px;font-size:var(--fs-body)}.fold.rf svg.i{transform:none}
.fold.rf .rf-m{flex:0 0 14px;display:flex;justify-content:center}.fold.rf .rf-d{flex:0 1 auto;min-width:0;font-size:var(--fs-meta)}
.fold.rf .rf-c{margin-left:auto;display:flex;color:var(--ink-3)}.fold.rf[aria-expanded="true"] .rf-c svg.i{transform:rotate(90deg)}
.fold-body{margin:4px 0 0;padding-left:0}
.fold-body[hidden]{display:none}
.plan-check-row{display:flex;gap:4px 8px;align-items:flex-start;min-height:30px;padding:3px 0;font-size:var(--fs-body);flex-wrap:wrap;color:var(--ink)}
.plan-check-row .m{flex:0 0 14px;display:flex;justify-content:center;align-items:center;align-self:flex-start;height:calc(var(--fs-body) * 1.5)}
.plan-check-row .m svg{width:12px;height:12px}
.plan-check-row.ok .m{color:var(--ink-3)}
.plan-check-row.bad .m{color:var(--ink)}
.plan-check-row .l{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.plan-check-row .d{flex:0 1 auto;min-width:0;color:var(--ink-2);font-size:var(--fs-meta)}
.plan-check-row .btn{flex:0 0 auto;align-self:flex-start}
.grp-h{font-size:var(--fs-meta);font-weight:600;color:var(--ink-2);margin:10px 0 2px}
/* single choice (dev chat/question.mjs + runs/questions-panel.css: numbered text, divided .qopt rows, a 16px square mark, the pick on --field) */
.qblock{margin:0 0 8px}
.qtext{font-weight:500;margin:12px 0 6px;display:flex;align-items:flex-start;gap:9px;line-height:1.45}
.qtext .qn{flex:0 0 auto;min-width:12px;font-weight:600;color:var(--ink-2)}
.qopts{display:flex;flex-direction:column;padding-left:21px}
.qopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 12px 8px 8px;border-radius:0;cursor:pointer;min-height:40px;font:500 var(--fs-body)/1.5 var(--sans);color:var(--ink)}
.qopt:first-child{border-top-color:transparent}
.qopt::before{content:'';flex:0 0 16px;box-sizing:border-box;width:16px;height:16px;border-radius:var(--r-xs);border:1px solid var(--line-2)}
.qopt:hover{background:var(--hover)}
.qopt.sel{background:var(--field);border-radius:var(--r-sm);border-top-color:transparent}
.qopt.sel+.qopt{border-top-color:transparent}

<script>
/* ---------- icons ---------- */
const I = {

  ok:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',

  pr:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="3.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="4" cy="12.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="12.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 5.1v5.8M12 10.9V6.5a2 2 0 0 0-2-2H7.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  dot:'<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>'

/* ---------- tiny builders ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const dot = k => `<span class="sd ${k}" aria-hidden="true"></span>`;
const kv = rows => `<div class="rd-kv">${rows.filter(Boolean).map(([k, v, cls]) => `<div class="rd-kv-row${cls ? ' ' + cls : ''}"><span class="rd-kv-k">${k}</span><span class="rd-kv-v">${v}</span></div>`).join('')}</div>`;
const foot = (quiet, primary, menu) => `<div class="ask-mcard-actions"><span class="sp"></span>${quiet || ''}${primary || ''}${menu ? more(menu) : ''}</div>`;
const card = c => `<section class="ask-mcard" aria-label="${esc(c.kind.replace(/<[^>]+>/g, ''))} card">
  <div class="ask-mcard-head"><span class="ask-mcard-kind">${c.kind}</span><span class="ask-mcard-title" title="${esc(c.title)}">${c.title}</span></div>
  <div class="rc-state"><span class="rc-rail">${dot(c.dot)}</span><div style="min-width:0"><div class="rc-word" aria-live="polite">${c.state}</div>${c.detail ? `<div class="rc-detail">${c.detail}</div>` : ''}</div></div>
  ${c.facts ? kv(c.facts) : ''}${c.body ? `<div class="body">${c.body}</div>` : ''}${c.foot || ''}</section>`;
const fold = (label, inner, o = {}) => `<div class="fold-line"><button type="button" class="fold" aria-expanded="${o.open ? 'true' : 'false'}" data-fold>${I.right}<span>${label}</span></button><span class="sp"></span>${o.action || ''}</div><div class="fold-body"${o.open ? '' : ' hidden'}>${inner}</div>`;
const chk = (ok, label, detail, action) => `<div class="plan-check-row ${ok ? 'ok' : 'bad'}"><span class="m">${ok ? I.ok : I.no}</span><span class="l">${label}${detail ? `<span class="d">${detail}</span>` : ''}</span>${action || ''}</div>`;
const log = rows => `<div class="chat-rc-log">${rows.map(([t, tm, m]) => `<div class="chat-rc-log-row"><span class="m">${m === 'dot' ? I.dot : I.ok}</span><span class="t" title="${esc(t.replace(/<[^>]+>/g, ''))}">${t}</span><span class="tm">${tm || ''}</span></div>`).join('')}</div>`;
const sw = (label, on, o = {}) => `<label class="switch-row"${o.tip ? ` title="${esc(o.tip)}"` : ''}><input type="checkbox" class="sw-input" role="switch"${on ? ' checked' : ''}${o.attr || ''}><span class="switch" aria-hidden="true"></span><span class="switch-label">${label}</span></label>`;
const E = s => `<span class="e-only">${s}</span>`, P = s => `<span class="p-only">${s}</span>`, P_ = P;

/* ---------- prompts and Guide ---------- */
const PROMPT_THIN = 'i want website X to send emails';
/* Write it out keeps the person's own answers word for word; Guide fills only the gaps, each marked (suggested) */
const GUESS = { 0: 'customers who reset a password or sign up; a weekly digest for those who opt in. Everyone picks which emails they get', 2: 'a reset request, a new sign-up', 3: 'our own sending domain; GDPR and CAN-SPAM (consent, unsubscribe, retention)', 4: 'a reset email arrives within a minute; every send is recorded; bounces raise an alert' };
const WLAB = { 0: 'Who gets them', 2: 'What starts one', 3: 'Limits', 4: 'How we know it worked' };
const writtenText = () => 'Website X: send email to our customers.\n' + [0, 2, 3, 4].map(i => `${WLAB[i]}: ${ui.ans[i] ? ui.ans[i] : GUESS[i] + ' (suggested)'}`).join('\n') + (ui.ans[0] && !/digest/i.test(ui.ans[0]) ? '\nAlso: a weekly digest for those who opt in (suggested)' : '');
const CHECKS = {
  prod:[['Who is it for','Who receives the emails?'],['What they get',''],['What starts it','What should trigger one?'],['Limits',''],['How you know it worked','How will you know it worked?']],
  eng:[['Who calls it','Which flows send email: reset, sign-up, digest?'],['The behaviour',''],['Trigger and scope','What triggers a send, and what is out of scope?'],['Constraints',''],['Acceptance checks','Which checks prove it works?']]
};
const reg = () => document.documentElement.dataset.reg === 'prod' ? 'prod' : 'eng';
const curAsker = () => ui.asker || (reg() === 'prod' ? 'Product' : 'Engineering');
const ROLES = ['Product', 'Engineering', 'Design', 'QA', 'Security', 'Compliance', 'DevOps'];
const RIC = d => `<svg class="i ri" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ROLE_ICON = {
  Product: RIC('<circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2"/>'),
  Engineering: RIC('<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/>'),
  Design: RIC('<path d="M3 13l1-3.5 7-7 2.5 2.5-7 7z"/>'),
  QA: RIC('<rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 8.2l2 2L11 6"/>'),
  Security: RIC('<path d="M8 1.8l5 2v4c0 3-2.2 5.2-5 6.4-2.8-1.2-5-3.4-5-6.4v-4z"/>'),
  Compliance: RIC('<path d="M8 2.5v11M5 13.5h6M3 4.5h10M3 4.5L1.5 8.5h3zM13 4.5l-1.5 4h3z"/>'),
  DevOps: RIC('<rect x="2.5" y="2.5" width="11" height="4.5" rx="1"/><rect x="2.5" y="9" width="11" height="4.5" rx="1"/><path d="M5 4.75h.01M5 11.25h.01"/>'),
  Release: RIC('<path d="M2.5 2.5h5l6 6-5 5-6-6z"/><circle cx="5.5" cy="5.5" r=".8"/>'),
  'Project fit': RIC('<path d="M3 3h3.5v1.5a1.5 1.5 0 0 0 3 0V3H13v10H3z"/>'),
  Challenger: RIC('<circle cx="8" cy="8" r="5.5"/><path d="M6.4 6.4a1.7 1.7 0 1 1 2.4 1.5c-.5.3-.8.6-.8 1.2M8 11.2v.1"/>')
};
const ri = r => ROLE_ICON[r] || '';
const roleLab = r => `<span class="rl">${ri(r)}${r}</span>`;
/* who is asking: ONE control (the composer row, right after the Shaper pin); the Shaper card repeats it only when no role is saved, as its first fact row */
const NO_ROLE_ICON = RIC('<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/>');
const askerPick = (o = {}) => pick(o.none && !ui.asker ? `<span class="rl">${NO_ROLE_ICON}Your role</span>` : roleLab(curAsker()), ROLES.join('|'), { reg: true, go: o.go, tip: 'Who is asking: Worca words its questions for you. Remembered; change it in Settings › Chat.' });
/* Guide: ONE switch, beside the role picker; on by default once offered; its model lives in the tooltip and Settings › Models */
const guideOn = () => ui.guide !== false;
const guideSw = () => sw('Guide', guideOn(), { attr: ' data-guide="1"', tip: 'Guide checks your prompt for gaps before you send and can write it out · runs on Sonnet 5.5 (change it in Settings › Models)' });
function promptText() { const cs = CHECKS[reg()]; return PROMPT_THIN + cs.map((c, i) => ui.ans[i] ? `\n${c[1].replace(/\?$/, '')}: ${ui.ans[i]}` : '').join(''); }
function composer(o) {
  const cs = CHECKS[reg()], open = cs.filter((c, i) => c[1] && !ui.ans[i]).length;
  const row = ([l, q], i) => { if (!q || ui.ans[i]) return chk(true, l, ui.ans[i] ? esc(ui.ans[i]) : '');
    if (ui.adding === i) return `<div class="plan-check-row bad"><span class="m">${I.no}</span><span class="l">${l}<span class="d">${q}</span><span class="ask-ans"><input type="text" aria-label="${esc(q)}" data-ansfor="${i}" placeholder="Your answer"> ${btn('Add', { attr: ` data-act="ansadd" data-i="${i}"` })}</span></span></div>`;
    return chk(false, l, q, btn('Add', { quiet: true, attr: ` data-act="ansopen" data-i="${i}"` })); };
  return `<div class="ask-composer-box">
    <div class="ask-field"><textarea aria-label="Message" rows="${o.rows || 3}">${esc(o.text)}</textarea>
      ${o.spark && guideOn() ? `<button type="button" class="sn-btn" data-act="write" title="Write it out · Guide · Sonnet 5.5" aria-label="Write it out">${I.spark}</button>` : ''}</div>
    ${o.guide === 'offer' && guideOn() ? `<div class="ask-guide"><span class="t">New: Guide checks your idea for gaps before you send. It is on; switch it off below any time.</span></div>` : ''}
    ${o.guide === 'role' && !ui.asker ? `<div class="ask-guide"><span class="t">Who is asking? Pick your role beside the Shaper pin; Worca words its questions for you.</span></div>` : ''}
    ${o.guide === 'score' && guideOn() ? `<div class="ask-guide-checks" aria-live="polite">${fold(`<b>Prompt ${5 - open}/5</b>${open ? ' · ' + open + ' gap' + (open > 1 ? 's' : '') : ''}`, cs.map(row).join(''), { open: true, action: btn(I.spark + 'Write it out', { quiet: true, attr: ' data-act="write"' }) })}</div>` : ''}
    ${o.guide === 'ready' && guideOn() ? `<div class="ask-guide"><span class="chip">Suggested</span><span class="t" aria-live="polite"><b style="color:var(--ink)">Prompt 5/5</b> · Large: several runs</span>${btn('Undo', { quiet: true, go: 'prompt-check', tip: 'Restores your words exactly' })}</div>` : ''}
    ${o.guide === 'small' && guideOn() ? `<div class="ask-guide"><span class="t" aria-live="polite"><b style="color:var(--ink)">Clear enough</b> · Small: one run</span></div>` : ''}
    <div class="ask-composer-row"><span class="pin" title="Shaper pin">Shaper</span>${askerPick({ none: o.noRole, go: o.roleGo })}${guideSw()}<span class="sp"></span>${btn('Send', { pri: true, go: o.send, attr: o.sendAttr || '' })}</div>
  </div>`;

const aside = (keep, chg, open) => ({ keep, chg, open });

/* ---------- the feature: one data set, read by every screen ---------- */
const FEAT = 'Email for website X', SPEC = 'FEAT-12', BRANCH = 'feat/website-x-email';
const SITE = '<p class="cap" style="margin:0 0 12px">Website X: a customer web app with sign-up and accounts.</p>';
const ui = { q: { dig: 0, rq: 0, ob: 0 }, qa: {}, proto: 0, care: 'Thorough', comp: false, hist: 'thin', moment: 'b3', vf: 'vf', runN: 3, open: { f1: true }, tab: 'Runs', pz: {}, marks: {}, reasons: {}, ans: {}, adding: -1, panel: ['Product', 'Engineering', 'Design', 'DevOps', 'Security', 'Compliance', 'QA'], small: 0, prs: false, rm: 'before' };
const money = x => '$' + x.toFixed(2);
const plural = (a, w) => `${w}${a.length > 1 ? 's' : ''} ${a.join(', ')}`;
const strip = s => String(s).replace(/<[^>]+>/g, '');
const W = (e, p) => reg() === 'prod' ? p : e;
const rcpt = (txt, tm) => `<div class="chat-rc-log-row"><span class="m">${I.ok}</span><span class="t" title="${esc(strip(txt))}">${txt}</span><span class="tm">${tm}</span></div>`;
const step = (head, inner, ft) => `<div class="openstep"><div class="openstep-h">${head}</div>${inner}${ft ? `<div class="ask-mcard-actions step-foot"><span class="sp"></span>${ft}</div>` : ''}</div>`;
/* dev's single-choice question (chat/question.mjs buildChatQuestion): divided .qopt rows, one pick, `recommended`, who wants it and why under each */
const qopts = (q, opts, sel, attr) => `<div class="qblock"><div class="qtext"><span class="qtext-t">${q}</span></div><div class="qopts" role="group" aria-label="${esc(strip(q))}">${opts.map(([l, rec, sub], i) => `<button type="button" class="qopt${sel === i ? ' sel' : ''}" aria-pressed="${sel === i}" ${attr(i)}><span class="qopt-txt"><span class="chat-q-opt-label">${l}</span>${sub ? `<span class="chat-q-opt-sub">${sub}</span>` : ''}</span>${rec ? `<span class="qrec" title="${esc(rec)}">recommended</span>` : ''}</button>`).join('')}</div></div>`;

/* 17 requirements, kept on FEAT-12 (the Requirements page). Two kinds: 16 are owned by exactly one run; 1 is confirmed by a person
   (R-comp-4: no run owns it, Compliance marks it, Ship waits for it). Each has one example; the Test writer writes the tests from the run-owned ones. */
const REQS = [
  ['Product', [['R-po-1', 'A reset email arrives within a minute', 'a reset asked at 10:00 is in the inbox by 10:01'], ['R-po-2', 'Sign-up sends one confirmation email', 'a new account gets exactly one email, also after a double click'], ['R-po-3', 'Customers pick which emails they get on a preferences page', 'weekly digest switched off and saved: no digest next Monday'], ['R-po-4', 'A weekly digest for customers who opt in', 'opted in on Friday: the first digest arrives on Monday 09:00']]],
  ['Engineering', [['R-arch-1', 'One service sends every email through a queue', 'sendEmail() from sign-up puts one job on the queue'], ['R-arch-2', 'A failed send retries 3 times, then is recorded', 'the provider fails four times: 3 retries, then one failed record']]],
  ['Design', [['R-ux-1', 'The team edits each email in a template editor with a live preview', 'changing the subject changes the preview without saving'], ['R-ux-2', 'Emails read well on phones', 'at 375px the reset email has no sideways scroll']]],
  ['DevOps', [['R-ops-1', 'The sending domain passes SPF, DKIM and DMARC', 'a test email to a mail checker passes all three'], ['R-ops-2', 'Bounces and failures raise an alert', 'bounces over 2% in an hour raise one alert']]],
  ['Security', [['R-sec-1', 'Unsubscribe links are signed and single-use; sends are rate-limited', 'a used link says “already unsubscribed”; a 6th resend in an hour is refused'], ['R-sec-2', 'No personal data in logs; provider keys only in the secret store', 'a send logs the message id, never the address']]],
  ['Compliance', [['R-comp-1', 'Consent is recorded with its lawful basis and time', 'opting in to the digest stores: consent, 12 May 10:02'], ['R-comp-2', 'Send records are deleted after 24 months', 'a record from 25 months ago is gone after the nightly job'], ['R-comp-3', 'Every email has a one-click unsubscribe', 'one click stops that email type; no sign-in asked'], ['R-comp-4', 'Signed data processing agreement with the email provider', 'the signed agreement is on file before the first real email is sent', 'Compliance']]],
  ['QA', [['R-qa-1', 'CI sends to a test inbox on every PR', 'a PR that breaks sending fails the check within 2 minutes']]]];
const REQ = {}; REQS.forEach(([g, rs]) => rs.forEach(([id, t, ex, by]) => { REQ[id] = { id, t, ex, g, by }; }));
const ALL_IDS = Object.keys(REQ), RUN_IDS = ALL_IDS.filter(id => !REQ[id].by);
/* the prototype remark changes R-ux-2; the digest decision words R-po-4 */

const rowMenu = (n, m) => `Open run ${n}>crp:${n}` + (/live|ask|paused/.test(m.st) ? `|-|!Stop run ${n}…>stoprun:${n}` : '');
