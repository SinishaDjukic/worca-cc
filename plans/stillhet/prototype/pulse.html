<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillhet · Pulse cases</title>
<!-- A case explorer: it draws nothing of its own. It opens the prototype (index.html) at each case, so what shows here is
     the same page code the prototype runs. -->
<link rel="stylesheet" href="../../../ui/public/stillhet/app.css">
<link rel="stylesheet" href="../../../ui/public/stillhet/css/stillhet-look.css">
<link rel="stylesheet" href="../../../ui/public/stillhet/css/stillhet.css">
<link rel="stylesheet" href="../../../ui/public/stillhet/css/access.css">
<style>
  html,body{height:100%;margin:0;}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .mk-bar{flex:none;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:var(--fs-meta);color:var(--ink-2);}
  .mk-bar h1{margin:0;font:600 var(--fs-body)/1.3 var(--sans);color:var(--ink);}
  .mk-bar label{display:flex;align-items:center;gap:8px;}
  .mk-bar .select{min-width:200px;}
  .mk-sp{flex:1 1 auto;}
  .mk-frame{flex:1 1 auto;width:100%;min-height:0;border:0;}
</style>
</head>
<body>
<div class="mk-bar">
  <h1>Pulse cases</h1>
  <label>Case <select class="select select-sm" id="case" aria-label="Case"></select></label>
  <label>Mode <select class="select select-sm" id="mode" aria-label="Interface mode" style="min-width:110px"><option value="simple">Simple</option><option value="advanced">Advanced</option><option value="expert" selected>Expert</option></select></label>
  <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-pick="light">Light</button><button type="button" data-theme-pick="dark">Dark</button></div>
  <span class="mk-sp"></span>
  <span>Every state of Pulse, drawn by the prototype itself.</span>
  <a class="dc-link" id="open" href="index.html">Open the prototype</a>
</div>
<iframe class="mk-frame" id="proto" title="The prototype, at this case" src="index.html"></iframe>
<script>
(function () {
  var KIND = 'pulse', frame = document.getElementById('proto'), pick = document.getElementById('case'), mode = document.getElementById('mode');
  var win = function () { return frame.contentWindow; }, doc = function () { return frame.contentDocument; };
  try { mode.value = localStorage.getItem('worca-stillhet.mode') || 'expert'; } catch (e) { /* no storage: Expert */ }
  var wanted = (location.hash || '').slice(1);
  function fill() {
    if (pick.options.length) return;
    if (KIND === 'task') {
      var groups = {};
      win().RunCardModel.cases.forEach(function (c) { (groups[c.group || 'Other'] = groups[c.group || 'Other'] || []).push(c); });
      Object.keys(groups).forEach(function (g) { var og = document.createElement('optgroup'); og.label = g; groups[g].forEach(function (c) { var o = document.createElement('option'); o.value = c.id; o.textContent = c.label; og.append(o); }); pick.append(og); });
    } else {
      Array.prototype.forEach.call(doc().querySelectorAll('#pulse-case option'), function (o) { pick.append(o.cloneNode(true)); });
    }
    if (wanted && pick.querySelector('option[value="' + wanted.replace(/"/g, '') + '"]')) pick.value = wanted; else if (KIND === 'task') pick.value = 'working';
  }
  function show() {
    var id = pick.value; if (!id) return;
    history.replaceState(null, '', '#' + id);
    if (KIND === 'task') { win().location.hash = '#run/' + id; document.getElementById('open').href = 'index.html#run/' + id; return; }
    var sel = doc().getElementById('pulse-case'); if (!sel) return;
    sel.value = id; sel.dispatchEvent(new (win().Event)('change', { bubbles: true }));
    var b = doc().querySelector('.pz-pulse-b'); if (b && b.getAttribute('aria-expanded') !== 'true') b.click();
  }
  // the prototype builds itself after its scripts load: wait for the part this explorer drives
  function ready() { try { return KIND === 'task' ? !!(win().RunCardModel && win().StillhetShell) : !!(doc().querySelector('#pulse-case option') && doc().querySelector('.pz-pulse-b')); } catch (e) { return false; } }
  frame.addEventListener('load', function () { var n = 0, t = setInterval(function () { if (ready()) { clearInterval(t); fill(); show(); } else if (++n > 100) clearInterval(t); }, 100); });
  pick.addEventListener('change', show);
  mode.addEventListener('change', function () { try { localStorage.setItem('worca-stillhet.mode', mode.value); } catch (e) { /* no storage */ } win().location.reload(); });
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-theme-pick]'); if (!b) return; var t = doc().querySelector('[data-theme-pick="' + b.dataset.themePick + '"]'); if (t) t.click(); document.documentElement.dataset.theme = b.dataset.themePick; });
})();
</script>
</body>
</html>
