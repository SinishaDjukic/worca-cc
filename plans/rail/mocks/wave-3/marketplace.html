<!doctype html>
<!-- Mock: the Marketplace on Rail, as cards. Dev's functions (browse, what a plugin adds and asks for, install, update,
     marketplaces); Rail's design: a PlaceHead, "For you" with Worca's reason, shelves by what you want (not by kind), and a
     plugin card on the cards' rail: no box, its kind as the mark, one line of facts, one action. The only new piece is the
     PluginCard (the mock's .pg-* below). Render: node plans/rail/mocks/wave-3/marketplace-render.mjs -->
<html lang="en"><head><meta charset="utf-8"><title>Marketplace</title>
<link rel="stylesheet" href="../../prototype/app.css">
<link rel="stylesheet" href="../../prototype/design-system/rail-look.css">
<link rel="stylesheet" href="../../prototype/design-system/rail.css">
<link rel="stylesheet" href="../../prototype/shell/shell.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #m{width:760px;padding:28px 40px 36px;box-sizing:border-box;}
  .pg-shelf{margin:26px 0 0;}
  .pg-shelf-h{display:flex;align-items:baseline;gap:8px;margin:0 0 2px;font:600 var(--fs-section)/1.3 var(--sans);letter-spacing:-.01em;}
  .pg-shelf-h .n{font:400 var(--fs-meta)/1 var(--sans);color:var(--ink-2);}
  .pg-shelf-m{margin:0 0 6px;font-size:var(--fs-meta);color:var(--ink-2);}
  .pg-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;}
  .pg-card{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:12px;row-gap:3px;align-content:start;padding:14px 0;border-top:1px solid var(--line);}
  .pg-card > .kind-mark{grid-row:1 / span 2;margin-top:1px;}
  .pg-k{font-size:var(--fs-meta);color:var(--ink-2);}
  .pg-k .up{color:var(--amber);}
  .pg-t{font:600 var(--fs-body)/1.35 var(--sans);}
  .pg-w{grid-column:2;font-size:var(--fs-body);color:var(--ink);line-height:1.45;}
  .pg-f{grid-column:2;font-size:var(--fs-meta);color:var(--ink-2);}
  .pg-why{grid-column:2;font-size:var(--fs-meta);color:var(--ink-2);display:flex;gap:6px;align-items:center;}
  .pg-why svg{color:var(--ink-3);}
  .pg-a{grid-column:2;display:flex;gap:6px;align-items:center;margin-top:8px;}
  .pg-for .pg-card{border-top:0;padding-top:10px;}
  .pg-for .pg-grid{border-top:1px solid var(--line);}
  .note{margin:28px 0 0;font-size:12px;color:var(--ink-3);}
</style></head>
<body><div id="m"></div>
<script src="../../prototype/components.js"></script>
<script>
  const R = window.RailUI;
  const ICON = { 'Task source': 'list', 'Chat channel': 'kind-chat', 'MCP server': 'plug', Agents: 'you', Workflows: 'kind-workflow', Models: 'set-models' };
  const mark = (kind, tone = 'idle') => `<span class="kind-mark is-${tone}" style="--km:20px" aria-hidden="true">${R.icon(ICON[kind], 15)}</span>`;
  const card = (p) => `<article class="pg-card">${mark(p.kind, p.update ? 'act' : p.installed ? 'ok' : 'idle')}
    <span class="pg-k">${p.kind} · ${p.update ? `<span class="up">update ${p.update}</span>` : p.installed ? 'installed' : p.ver}</span>
    <span class="pg-t">${p.name}</span>
    <span class="pg-w">${p.what}</span>
    ${p.why ? `<span class="pg-why">${R.icon('worca-w', 12)}${p.why}</span>` : ''}
    <span class="pg-f">${p.facts}</span>
    <span class="pg-a">${p.update ? R.button({ label: `Update to ${p.update}`, kind: 'primary' }) : p.installed ? R.button({ label: 'Set up', kind: 'quiet' }) : R.button({ label: 'Install' })}${R.button({ label: 'What it asks for', kind: 'quiet' })}</span></article>`;
  const shelf = (title, meta, list, cls = '') => `<section class="pg-shelf ${cls}"><h2 class="pg-shelf-h">${title} <span class="n">${list.length}</span></h2>${meta ? `<p class="pg-shelf-m">${meta}</p>` : ''}<div class="pg-grid">${list.map(card).join('')}</div></section>`;
  const P = {
    jira: { name: 'Jira', kind: 'Task source', ver: '0.1.0', installed: true, update: '0.2.0', what: 'Pull tasks from Jira issues; write the result back to the ticket.', facts: 'Adds a task source · asks for a token and your site' },
    gh: { name: 'GitHub Issues', kind: 'Task source', ver: '0.2.0', what: 'Pull tasks from GitHub Issues; close them when the PR merges.', facts: 'Adds a task source · asks for a token', why: 'Your projects live on GitHub' },
    slack: { name: 'Slack', kind: 'Chat channel', ver: '0.2.0', what: 'Talk to Worca from Slack: notices, and /status, /pause, /approve.', facts: 'Adds a chat channel · asks for 2 tokens · keeps a small worker running', why: 'You step away most evenings: answer from your phone' },
    tg: { name: 'Telegram', kind: 'Chat channel', ver: '0.1.0', installed: true, what: 'Notices and answers from Telegram.', facts: 'Adds a chat channel · on in Chat' },
    cf: { name: 'Cloudflare', kind: 'MCP server', ver: '0.1.0', what: 'The whole Cloudflare API and its docs, for your tasks.', facts: 'Adds 2 MCP servers · asks for an API token' },
    notion: { name: 'Notion', kind: 'MCP server', ver: '0.1.0', installed: true, what: 'Search, read and edit Notion pages and databases.', facts: 'Adds an MCP server · asks for a token' },
    review: { name: 'Review pack', kind: 'Agents', ver: '1.0.0', what: 'A security and a performance reviewer, ready for your workflows.', facts: 'Adds 2 agents · asks for nothing' },
    promo: { name: 'Promo video', kind: 'Workflows', ver: '0.3.0', what: 'From a feature to a 30-second video: script, shots, cut.', facts: 'Adds a workflow and 3 agents · asks for nothing' },
  };
  document.getElementById('m').innerHTML = `<div class="convo-col" style="margin:0">
    ${R.placeHead({ title: 'Marketplace', facts: `12 plugins · 3 installed · from ${R.sentencePicker({ id: 'from', text: 'Worca CC Official', items: [], chevron: R.icon('chevron', 10) })}`, mark: `<span class="kind-mark is-act" style="--km:20px" aria-hidden="true">${R.icon('plug', 15)}</span>`, word: '1 update', why: 'Jira 0.2.0 asks for nothing new', action: R.button({ label: 'Update Jira' }), menu: R.button({ label: 'More', kind: 'quiet', iconOnly: true, icon: R.icon('more', 16) }) })}
    ${shelf('For you', 'Worca suggests these from how you work; each says why.', [P.gh, P.slack], 'pg-for')}
    ${shelf('Bring tasks in', 'Tickets become tasks; the result goes back to the ticket.', [P.jira, P.gh])}
    ${shelf('Talk to Worca from', 'Answer what needs you without opening Worca.', [P.slack, P.tg])}
    ${shelf('Give tasks tools', 'MCP servers a task can call.', [P.cf, P.notion])}
    ${shelf('New agents and workflows', 'Steps and whole flows for your workflows.', [P.review, P.promo])}
  </div><p class="note">Mock. New in the library: PluginCard (mark by kind, kicker, name, one line, Worca's reason when suggested, facts, one action and "What it asks for"). Everything else is the library as it is.</p>`;
</script></body></html>
