<!doctype html>
<!-- Mock (Wave 3, 1.2's rest): the chat cards that are left, dev's functions on Rail. A question asked as a small form (a
     number on a slider, an order to rank, rows to pick, words to write), a workflow proposed at dev's depth (its steps with
     their model, its loop, its name, Save and Open in Workflows), a setting proposed (Proxy), and a task card's facts.
     Library pieces throughout; new ones are named in the notes (.mk-* here). Render: node plans/rail/mocks/wave-3/render.mjs chat-cards -->
<html lang="en"><head><meta charset="utf-8"><title>Chat cards</title>
<link rel="stylesheet" href="../../prototype/app.css">
<link rel="stylesheet" href="../../prototype/design-system/rail-look.css">
<link rel="stylesheet" href="../../prototype/design-system/rail.css">
<link rel="stylesheet" href="../../prototype/shell/shell.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #m{width:760px;padding:28px 40px 36px;box-sizing:border-box;}
  .case{margin:0 0 34px;} .case > h2{margin:0 0 10px;font:600 12px/1.4 var(--sans);color:var(--ink-2);}
  .note{margin:6px 0 0 32px;font-size:12px;color:var(--ink-3);}
  /* new: SliderPick (a number in its range, Worca's pick marked) */
  .mk-slide{margin:6px 0 0 32px;display:grid;gap:6px;max-width:420px;}
  .mk-slide-t{display:flex;justify-content:space-between;font-size:var(--fs-meta);color:var(--ink-2);}
  .mk-track{position:relative;height:2px;background:var(--line-2);border-radius:2px;margin:8px 0;}
  .mk-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);}
  .mk-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px var(--ink-2);}
  .mk-pick{position:absolute;top:10px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap;}
  .mk-val{font:600 var(--fs-body)/1.2 var(--sans);}
  /* new: RankList (an order to set: drag or arrow keys, each with its number) */
  .mk-rank{margin:6px 0 0 32px;display:grid;gap:0;max-width:520px;}
  .mk-rank-r{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:var(--fs-body);}
  .mk-rank-r:last-child{border-bottom:1px solid var(--line);}
  .mk-rank-n{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:var(--fs-meta);}
  .mk-grip{color:var(--ink-3);display:flex;gap:2px;}
  /* new: PickRows (rows to tick, from a table) */
  .mk-rows{margin:6px 0 0 32px;max-width:560px;}
  .mk-rows .mk-h{display:grid;grid-template-columns:22px 1fr 90px 70px;gap:8px;font-size:var(--fs-meta);color:var(--ink-2);padding:0 0 4px;}
  .mk-rows .mk-r{display:grid;grid-template-columns:22px 1fr 90px 70px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:var(--fs-body);}
  .mk-rows .mk-r span:nth-child(n+3){color:var(--ink-2);font-size:var(--fs-meta);font-variant-numeric:tabular-nums;}
  .mk-go{margin:10px 0 0 32px;display:flex;gap:6px;}
  .mk-facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--fs-meta);color:var(--ink-2);margin:2px 0 0;}
  .mk-facts b{font-weight:500;color:var(--ink);}
</style></head>
<body><div id="m"></div>
<script src="../../prototype/components.js"></script>
<script>
  const R = window.RailUI;
  const ask = (q) => R.turnRow({ mark: R.kindMark({ kind: 'chat', tone: 'ask', size: 16 }), text: `<b>${q}</b>` });
  const pick = (id, text) => R.sentencePicker({ id, text, items: [], chevron: R.icon('chevron', 10) });
  const STAGES = ['Plan', 'Build', 'Review', 'PR', 'Merged'];
  const slider = `${ask('How many review rounds before it asks you?')}<div class="mk-slide"><div class="mk-slide-t"><span>1</span><span class="mk-val">3 rounds</span><span>6</span></div><div class="mk-track"><span class="mk-fill" style="width:40%"></span><span class="mk-knob" style="left:40%"></span><span class="mk-pick" style="left:60%">Worca's pick: 4</span></div></div>
    <div class="mk-go">${R.button({ label: 'Answer' })}${R.button({ label: 'Use Worca’s pick', kind: 'quiet' })}</div>`;
  const rank = `${ask('What matters most in the export? Put them in order.')}<div class="mk-rank">${['Totals match the ledger', 'One row per invoice line', 'Fast for 50k rows'].map((t, i) => `<div class="mk-rank-r"><span class="mk-rank-n">${i + 1}</span><span>${t}</span><span class="mk-grip" title="Drag, or arrow keys">${R.icon('dots', 14)}</span></div>`).join('')}</div><p class="note">Drag a row, or focus it and use the arrow keys.</p>
    <div class="mk-go">${R.button({ label: 'Answer' })}${R.button({ label: 'Use Worca’s order', kind: 'quiet' })}</div>`;
  const rows = `${ask('Which tickets should become tasks?')}<div class="mk-rows"><div class="mk-h"><span></span><span>Ticket</span><span>Estimate</span><span>Priority</span></div>${[['BILL-412 · CSV export', '1 day', 'High', true], ['BILL-415 · Invoice rounding', '2 h', 'High', true], ['BILL-420 · Old coupon codes', '3 days', 'Low', false]].map(([t, e, p, c]) => `<div class="mk-r">${R.checkbox({ label: '', checked: c })}<span>${t}</span><span>${e}</span><span>${p}</span></div>`).join('')}</div>
    <div class="mk-go">${R.button({ label: 'Make 2 tasks' })}${R.button({ label: 'Not now', kind: 'quiet' })}</div>`;
  const wf = R.changeProposal({ kind: 'Workflow', title: 'Security-first review', why: 'Proposed from this chat · round 2: you asked for a security pass before the PR', rows: [],
    body: `<div class="set-rows" style="margin:6px 0 0">${[['Name', '<b>Security-first review</b> · rename it in place'], ['1. Plan', `Plan on ${pick('m1', 'Opus 5.5')} ${pick('e1', 'high')}`], ['2. Build', `Implementation on ${pick('m2', 'Sonnet 5.5')} ${pick('e2', 'high')}`], ['3. Security', `Security review on ${pick('m3', 'Opus 5.5')} ${pick('e3', 'high')} · new`], ['4. Review', `Review on ${pick('m4', 'Opus 5.5')} ${pick('e4', 'medium')}`], ['Loop', `Security sends it back to Build up to ${pick('l1', '2')} times`]].map(([n, s]) => R.settingsRow({ name: n, sentence: s })).join('')}</div>`,
    state: 'proposed', apply: 'Save', menu: R.button({ label: 'More', kind: 'quiet', iconOnly: true, icon: R.icon('more', 16) }) }) + `<p class="note">Its steps are rows with their model; change one in place, or say what to change. More holds Open in Workflows and Propose again.</p>`;
  const proxy = R.changeProposal({ kind: 'Settings', title: 'Route tasks through the company proxy', why: 'You said downloads fail on the VPN', rows: [{ name: 'Proxy', before: 'None', after: 'proxy.corp.example:3128' }, { name: 'Skips', before: '', after: 'localhost, *.internal' }], state: 'proposed', apply: 'Apply' });
  const card = R.taskCard({ title: 'Add CSV export to billing', place: '<span class="rc-mid"><span class="rc-mid-a">feat/billing-csv-export</span></span><span>into dev</span>', mark: R.kindMark({ kind: 'task', tone: 'run', stage: 2 }), word: 'Working', detail: 'Review · checking it in a browser', action: R.button({ label: 'Pause' }), menu: R.button({ label: 'More', kind: 'quiet', iconOnly: true, icon: R.icon('more', 16) }), stages: R.stageBar({ labels: STAGES, stage: 2, tone: 'run' }),
    rows: `<div class="mk-facts"><span><b>$1.84</b> so far</span><span><b>23 min</b></span><span><b>3</b> agents</span><span><b>5</b> files · export.mjs, columns.mjs +3</span><span><b>2</b> artifacts</span></div>` });
  document.getElementById('m').innerHTML = `<div class="convo-col" style="margin:0">
    <section class="case"><h2>A number to choose: SliderPick</h2>${slider}</section>
    <section class="case"><h2>An order to set: RankList</h2>${rank}</section>
    <section class="case"><h2>Rows to pick: PickRows</h2>${rows}</section>
    <section class="case"><h2>A workflow proposed, at dev's depth</h2>${wf}</section>
    <section class="case"><h2>A setting proposed (Proxy; Clone, Actions, Metrics, Policy and Sets alike)</h2>${proxy}</section>
    <section class="case"><h2>A task card's facts: one line under its words</h2>${card}</section>
  </div>`;
</script></body></html>
