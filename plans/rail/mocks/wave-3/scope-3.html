<!doctype html>
<!-- Mock (Wave 3): the Projects sidebar reorganized (Emil, 8 Nov: messy, not clear how to create a workspace, which is first,
     what belongs where). Three ways to compare, then the recommended one on a page. Library: List, ListRow with a tree
     (Chat's bar), KindMark, CompactMenu, PlaceHead. Render: node plans/rail/mocks/wave-3/render.mjs scope-3 1280 -->
<html lang="en"><head><meta charset="utf-8"><title>Projects sidebar</title>
<link rel="stylesheet" href="../../prototype/app.css">
<link rel="stylesheet" href="../../prototype/design-system/rail-look.css">
<link rel="stylesheet" href="../../prototype/design-system/rail.css">
<link rel="stylesheet" href="../../prototype/shell/shell.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #m{width:1280px;padding:24px 28px 30px;box-sizing:border-box;}
  h2{margin:0 0 4px;font:600 13px/1.4 var(--sans);} .why{margin:0 0 12px;font-size:12px;color:var(--ink-2);line-height:1.5;min-height:54px;}
  .three{display:grid;grid-template-columns:repeat(3,360px);gap:30px;}
  .bar{position:relative;width:280px;background:var(--side,var(--panel));border:1px solid var(--line);border-radius:var(--r-md);padding:12px;box-sizing:border-box;min-height:560px;}
  .bh{display:flex;align-items:center;gap:8px;margin:2px 6px 10px;font:600 15px/1.2 var(--sans);} .bh .sp{flex:1;}
  .sent{display:flex;gap:5px;align-items:center;font-size:var(--fs-meta);color:var(--ink-2);margin:0 6px 10px;}
  .menu-cap{margin:12px 6px 6px;font-size:12px;color:var(--ink-3);} .bar > .menu{position:static;width:auto;box-shadow:none;border:1px solid var(--line);}
  .page{display:grid;grid-template-columns:280px 1fr;gap:0;margin-top:30px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
  .page .bar{border:0;border-right:1px solid var(--line);border-radius:0;width:auto;}
  .main{padding:24px 0 26px;display:flex;justify-content:center;} .col{width:620px;}
  .cap{margin:26px 0 6px;font:600 13px/1.4 var(--sans);}
  .note{margin:16px 0 0;font-size:12px;color:var(--ink-3);}
  .explain{margin:10px 0 0;font-size:var(--fs-body);color:var(--ink-2);}
  .crumb{font-size:var(--fs-meta);color:var(--ink-2);margin:0 0 2px;}
</style></head>
<body><div id="m"></div>
<script src="../../prototype/components.js"></script>
<script>
  const R = window.RailUI;
  const pj = (t) => R.kindMark({ kind: 'project', tone: t || 'idle' }), ws = (t) => R.kindMark({ kind: 'workspace', tone: t || 'idle' });
  const child = (title, tone, end, cur, also) => R.listRow({ title, mark: pj(tone), endText: end, open: { 'data-x': title }, current: !!cur, attrs: also ? { title: also } : {} });
  const tree = (title, mark, end, kids, open = true, cur = false) => R.listRow({ title, mark, endText: end, open: { 'data-x': title }, current: cur, markFold: { open, attrs: {} }, after: `<div class="lr-members lr-tree" role="list"><div class="list-rows">${kids.join('')}</div></div>` });
  const flat = (title, mark, end, cur) => R.listRow({ title, mark, endText: end, open: { 'data-x': title }, current: !!cur });
  const head = (extra = '') => `<div class="bh">${R.icon('nav-projects', 18)} Projects<span class="sp"></span>${R.button({ label: 'New', kind: 'quiet', iconOnly: true, icon: R.icon('plus', 15) })}</div>${extra}`;
  const pick = (t) => R.sentencePicker({ id: t, text: t, items: [], chevron: R.icon('chevron', 10) });
  const menu = R.compactMenu({ label: 'New', items: [{ header: 'Ask in chat' }, { id: 'a', text: 'Add a project' }, { id: 'b', text: 'Make a workspace' }, { sep: true }, { header: 'By hand' }, { id: 'c', text: 'Add a project…' }, { id: 'd', text: 'Make a workspace…' }] });
  const inBar = (h) => `<div class="bar-list rail-page" style="padding:0;overflow:visible">${h}</div>`;
  // healthy workspaces fold and say nothing; a folded one that needs you shows its worst state; a project in two is under both
  const treeA = (cur) => inBar(R.list({ groups: [{ rows: [
    tree('Web shop', ws('ask'), '5', [child('web-app', 'ask', 'Out of sync'), child('payments-api'), child('design-kit'), child('email-service'), child('billing-api', '', '', cur === 'billing-web', 'Also in Legacy billing')]),
    tree('Legacy billing', ws('fail'), '2', [child('legacy-billing', 'fail', 'Folder missing'), child('billing-api', '', '', cur === 'billing-api', 'Also in Web shop')]),
    tree('IoT SP Platform', ws(), '3', [], false), tree('Data platform', ws('ask'), 'Out of sync', [], false)] }, { title: 'Not in a workspace', rows: [child('worca-cc'), child('docs-site')] }] }));
  const A = `<h2>A · A tree, workspace over its projects (recommended)</h2><p class="why">The same tree as Chat's bar: what holds what is visible. Healthy workspaces fold; one that needs you stays open or shows its worst state. A project in two workspaces is under both.</p><div class="bar">${head()}${treeA('')}<p class="menu-cap">The + opens:</p>${menu}</div>`;
  const B = `<h2>B · Two ways in</h2><p class="why">As Workflows and the Marketplace: the bar only has ways in with counts; the page lists them. Tidy, but what belongs where is only on the page, and every project is a click further.</p><div class="bar">${head()}${inBar(R.list({ groups: [{ title: 'Needs you', rows: [flat('web-app', pj('ask'), 'Out of sync'), flat('legacy-billing', pj('fail'), 'Folder missing')] }, { rows: [flat('Workspaces', ws(), '3'), flat('All projects', pj(), '11')] }] }))}</div>`;
  const C = `<h2>C · A tree you can regroup</h2><p class="why">A with Chat's sentence on top: the same bar by workspace or by what needs you. One more control; by workspace is the default, so it reads as A until you change it.</p><div class="bar">${head(`<div class="sent">Showing ${pick('by workspace')}</div>`)}${treeA('')}</div>`;
  const more = R.moreMenu({ id: 'm', label: 'More', icon: R.icon('more', 16), open: false, items: [] });
  const page = `<p class="cap">A on a page: a project says where it belongs; the home says what a workspace is, and how to make one</p><div class="page"><aside class="bar pz-app rail-page">${head()}${treeA('billing-api')}</aside><main class="main"><div class="col convo-col" style="margin:0"><p class="crumb">Legacy billing ›</p>${R.placeHead({ title: 'billing-api', facts: 'Also in Web shop · ~/src/billing-api · main', mark: pj(), word: 'Behind by 3', why: 'Only your copy is older; new tasks start from origin', action: R.button({ label: 'Sync', kind: 'quiet' }), menu: more })}${R.settingsSection({ title: 'Every new task here gets', meta: 'From its workspaces and its own; a task can change its own.', rows: R.settingsRow({ name: 'Cost tags', sentence: R.tagGroup({ items: [{ kind: 'tag', text: 'team: billing' }, { kind: 'tag', text: 'cost-center: 4410' }] }) + ' <span style="color:var(--ink-2)">team from Legacy billing</span>', end: R.button({ label: 'Change', kind: 'quiet' }) }) + R.settingsRow({ name: 'Labels', sentence: R.tagGroup({ items: [{ kind: 'label', text: 'legacy' }, { kind: 'label', text: 'shop' }, { kind: 'label', text: 'payments' }] }), end: R.button({ label: 'Change', kind: 'quiet' }) }) })}<p class="note">Mock. Default labels and cost tags, set on a workspace and on a project. Labels add up across its workspaces. A cost tag has one value: the project's own wins; if two workspaces differ, the task's composer asks, so cost is never counted twice. The task shows what it got. Its place in the tree is its address: the crumb leads to its workspace; "also in" leads to the other one. In Simple there are no workspaces, so the bar is the plain list of projects.</p></div></main></div>
  <div class="page"><aside class="bar pz-app rail-page">${head()}${treeA('')}</aside><main class="main"><div class="col convo-col" style="margin:0">${R.placeHead({ title: 'Your projects', facts: '11 projects in 4 workspaces, 2 on their own' })}<div style="display:flex;gap:6px;margin:12px 0 0">${R.button({ label: 'Make a workspace' })}${R.button({ label: 'Add a project', kind: 'quiet' })}</div><div style="height:16px"></div>${R.composer({ value: '', placeholder: 'Say which projects belong together, or add one…', sentence: '', tools: R.button({ label: 'Add', kind: 'quiet', iconOnly: true, icon: R.icon('plus', 15) }), send: R.button({ label: 'Send', kind: 'primary', iconOnly: true, icon: R.icon('up', 14) }) })}<p class="note">Mock. The bar's + and these two buttons both ask Worca in the chat first; By hand is in the + menu. With no workspace yet, one line here says what a workspace is: projects that work together, so Worca changes them in the right order.</p></div></main></div>`;
  document.getElementById('m').innerHTML = `<div class="three"><div>${A}</div><div>${B}</div><div>${C}</div></div>${page}`;
</script></body></html>
