<!doctype html>
<!-- Mock (Wave 3, second pass): Insights, one feature, its sub-features grouped in the bar: Cost, Value, Quality, Flow, Team
     (Expert); every metric dev records, nothing invented. Each: the answer in a sentence, one chart, one "by" with every
     dimension, breakdown rows that lead to their tasks. 1: Spend by project, with the whole "by" menu open. 2: why it cost:
     rework and waste. 3: one level deeper, and what is not counted. 4: Quality. Chat first: it ends with the composer.
     Library: List, ListRow, PlaceHead, BarChart, SentencePicker, CompactMenu, SettingsRow; new: none but a row of figures.
     Render: node plans/rail/mocks/wave-3/render.mjs insights-2 1280 -->
<html lang="en"><head><meta charset="utf-8"><title>Insights</title>
<link rel="stylesheet" href="../../prototype/app.css">
<link rel="stylesheet" href="../../prototype/design-system/rail-look.css">
<link rel="stylesheet" href="../../prototype/design-system/rail.css">
<link rel="stylesheet" href="../../prototype/shell/shell.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #m{width:1280px;}
  .fr{display:grid;grid-template-columns:280px 1fr;border-bottom:1px solid var(--line);}
  .bar{background:var(--side,var(--panel));border-right:1px solid var(--line);padding:14px 12px;box-sizing:border-box;}
  .bh{display:flex;align-items:center;gap:8px;margin:2px 6px 10px;font:600 15px/1.2 var(--sans);}
  .main{padding:26px 0 30px;display:flex;justify-content:center;} .col{width:720px;}
  .cap{margin:0 0 10px;font:600 12px/1.4 var(--sans);color:var(--ink-3);}
  .note{margin:16px 0 0;font-size:12px;color:var(--ink-3);}
  .sent{position:relative;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:var(--fs-meta);color:var(--ink-2);margin:14px 0 12px;}
  .by{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 18px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--panel);}
  .by h4{margin:6px 0 3px;font:600 12px/1.3 var(--sans);color:var(--ink-2);} .by span{display:block;font-size:var(--fs-body);line-height:1.65;} .by .on{font-weight:600;} .by .off{color:var(--ink-3);}
  .fig{display:grid;grid-template-columns:minmax(0,1.6fr) 64px 76px 76px 76px 56px 64px;gap:0 8px;align-items:center;font-size:var(--fs-body);font-variant-numeric:tabular-nums;padding:7px 0;border-top:1px solid var(--line);}
  .fig.h{border-top:0;font-size:var(--fs-meta);color:var(--ink-2);padding:0 0 5px;} .fig > :not(:first-child){text-align:right;} .fig.sub{color:var(--ink-2);padding-left:18px;} .fig.quiet{color:var(--ink-2);}
  .fig.three{grid-template-columns:minmax(0,1fr) 64px 76px 64px;} .fig b{font-weight:500;} .fig.h span{white-space:normal;line-height:1.2;}
  .mix{display:flex;align-items:flex-end;gap:26px;height:96px;margin:0 4px;border-bottom:1px solid var(--line);} .mix div{flex:1;display:grid;align-content:end;gap:1px;} .mix i{display:block;}
  .mixl{display:flex;gap:14px;margin:6px 4px 0;font-size:var(--fs-meta);color:var(--ink-2);} .mixl i{display:inline-block;width:9px;height:9px;margin-right:5px;} .acts{display:flex;gap:6px;margin:10px 0 0;}
  .stand{margin:14px 0 0;line-height:1.55;}
  .kinds{position:relative;width:260px;margin:0 0 10px;} .kinds .menu{position:static;box-shadow:none;border:1px solid var(--line-2);}
  .plot{position:relative;} .plot svg{display:block;width:100%;height:auto;} .plot .grid{stroke:var(--line);fill:none;} .plot .ax{font-size:11px;fill:var(--ink-2);font-family:var(--sans);} .plot .now{fill:none;stroke:var(--ink);stroke-width:2;} .plot .prev{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 3;} .plot .dot{fill:var(--ink);stroke:var(--bg);stroke-width:2;} .plot .brush{fill:var(--field);} .plot .cross{stroke:var(--ink-3);}
  .tip{position:absolute;top:8px;display:grid;gap:1px;padding:6px 9px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:var(--fs-meta);color:var(--ink-2);} .tip b{color:var(--ink);font-weight:600;}
</style></head>
<body><div id="m"></div>
<script src="../../prototype/components.js"></script>
<script>
  const R = window.RailUI;
  const IC = { Spend: 'set-spending', 'Per task': 'kind-task', 'Why it cost': 'question', Budget: 'set-limits', 'Time saved': 'clock', 'Value for spend': 'sparkle', 'How tasks end': 'check', Review: 'edit', 'Where it fails': 'alert', Autonomy: 'away', Cache: 'set-memory', Shipped: 'merge', 'Start to merge': 'after', Throughput: 'track', 'Waiting on you': 'pause', 'By person': 'nav-team-metrics', 'Missing cost tags': 'tag' };
  const it = (label, cur, count) => ({ label, icon: IC[label] || 'sliders', current: label === cur, count });
  const bar = (cur) => `<div class="bh">${R.icon('nav-insights', 18)} Insights</div>${R.sideMenu({ label: 'Insights', groups: [['Cost', ['Spend', 'Per task', 'Why it cost', 'Budget']], ['Value', ['Time saved', 'Value for spend']], ['Quality', ['How tasks end', 'Review', 'Where it fails', 'Autonomy', 'Cache']], ['Flow', ['Shipped', 'Start to merge', 'Throughput', 'Waiting on you']]].map(([title, l]) => ({ title, items: l.map((x) => it(x, cur)) })).concat([{ title: 'Team', items: [it('By person', cur), it('Missing cost tags', cur, 18)] }, { title: 'Your views', items: [it('By client, then workflow', cur), it('Monthly for finance', cur)] }]) })}`;
  const pick = (t) => R.sentencePicker({ id: t, text: t, items: [], chevron: R.icon('chevron', 10) });
  const days = [38, 61, 22, 74, 55, 9, 93, 60];
  const chart = (vals, fmt) => R.barChart({ label: 'By day', play: true, hint: 'Drag across to narrow', bars: vals.map((v, i) => ({ label: `Nov ${i + 1}`, value: v, text: fmt(v) })), current: vals.length - 1, height: 96 });
  const usd = (n) => `$${n}`;
  const byMenu = `<div class="by">${[['Where', ['project', 'workspace', 'branch', 'ticket', 'pull request']], ['What did the work', ['workflow', 'stage', 'step and agent', 'sub-agents']], ['What it ran on', ['model', 'engine', 'effort', 'cache read or write', 'tokens in or out']], ['Why it cost', ['rework', 'retries', 'fix rounds', 'failed or stopped']], ['Who and how', ['person', 'chat, task, schedule', 'Requirements', 'Away or at the desk', 'status', 'API or subscription']], ['How you organise', ['client (cost tag)', 'team (cost tag)', 'cost-center (cost tag)', 'label']], ['', ['Then by']]].map(([h, l]) => `<div><h4>${h}</h4>${l.map((x) => `<span class="${x === 'project' ? 'on' : ''}">${x}</span>`).join('')}</div>`).join('')}<div style="grid-column:1/-1"><h4>When</h4><span>hour · day · week · month · time of day</span></div></div>`;
  const fig = (name, share, spend, h, saved, per, n, cls = '') => `<div class="fig ${cls}"><b>${name}</b><span>${share}</span><span>${spend}</span><span>${h}</span><span>${saved}</span><span>${per}</span><span>${n}</span></div>`;
  const hd = fig('', 'Share', 'AI spend', 'Hours saved', 'Saved', 'Cost per hour saved', 'Tasks', 'h');
  const fig3 = (name, share, spend, n, cls = '') => `<div class="fig three ${cls}"><b>${name}</b><span>${share}</span><span>${spend}</span><span>${n}</span></div>`;
  const sentence = (metric, by, then, when, as = 'bars', vs = 'nothing', of = 'everything', x = '') => `<div class="list-sentence">Showing ${pick(metric)} by ${pick(by)}${then ? ` then ${pick(then)}` : ''} ${pick(when)}${x} of ${pick(of)} as ${pick(as)} against ${pick(vs)}</div>`;
  const more = R.moreMenu({ id: 'm', label: 'More', icon: R.icon('more', 16), open: false, items: [] });
  const dock = (ph) => `<div style="margin:16px 0 0">${R.composer({ value: '', placeholder: ph, sentence: '', tools: R.button({ label: 'Add', kind: 'quiet', iconOnly: true, icon: R.icon('plus', 15) }), send: R.button({ label: 'Send', kind: 'primary', iconOnly: true, icon: R.icon('up', 14) }) })}</div>`;
  const f1 = `<div class="col convo-col" style="margin:0"><p class="cap">1 · Spend: the answer, one chart, one "by", every dimension behind it</p>${R.placeHead({ title: 'Spend', facts: 'All your tasks and chats, November', mark: R.kindMark({ kind: 'plugin', icon: 'nav-insights' }), word: '$412 of $2,000', why: 'Saved about $1,233, 3× what it cost · on pace for $1,545', menu: more })}
    ${sentence('AI spend', 'project', '', 'this month')}${byMenu}${chart(days, usd)}
    <div style="height:12px"></div>${hd}${fig('billing-api', '45%', '$186', '21 h', '$549', '$8.86', '18')}${fig('web-app', '32%', '$131', '14 h', '$359', '$9.36', '14')}${fig('worca-cc', '17%', '$72', '9 h', '$243', '$8.00', '9')}${fig('docs-site', '6%', '$23', '3 h', '$82', '$7.67', '3')}
    <div class="acts">${R.button({ label: 'Download CSV', kind: 'quiet' })}${R.button({ label: 'Save this view', kind: 'quiet' })}</div>${dock('Ask about your spend…')}
    <p class="note">Mock. The open menu is the "by" picker; closed it is one word. On pace is the last 8 days' rate, and its number opens the sum. Saved is hours saved at your hourly rate (Settings). The time picker holds today, this week, this month, last month, all time and custom; a comparison is always the same number of days before. One "by" holds every dimension dev records, grouped; one with no data this period is left out. The whole row opens its tasks. Rows are the top 5, then Other; the CSV has every row, on every page. The money adds up to the headline; Chat and Requirements are rows of their own, by chat, task, schedule, unless a filter is on. Then by is the last item of this menu; only when chosen does then [x] join the sentence.</p></div>`;
  const f2 = `<div class="col convo-col" style="margin:0"><p class="cap">2 · Why it cost: the money that bought nothing new</p>${R.placeHead({ title: 'Why it cost', facts: 'November', mark: R.kindMark({ kind: 'plugin', icon: 'nav-insights' }), word: '$131 of $412 went on rework and waste', why: '32%, up from 23% in the same weekdays before', menu: more })}
    ${sentence('rework and waste', 'why', 'workflow', 'this month')}${chart([12, 21, 4, 28, 16, 2, 31, 17], usd)}
    <div style="height:12px"></div>${fig3('', 'Share', 'AI spend', 'Tasks', 'h')}${fig3('Review sent it back', '17%', '$69', '11')}${fig3('Default', '11%', '$45', '7', 'sub')}${fig3('Full', '4%', '$16', '3', 'sub')}${fig3('Quick Fix', '2%', '$8', '1', 'sub')}${fig3('Failed or stopped tasks', '8%', '$33', '6')}${fig3('Retries', '4%', '$18', '9')}${fig3('PR fix rounds', '3%', '$11', '4')}
    <p class="stand">What stands out: Review sends Build back most on <b>web-app</b>, on Sonnet 5.5. Running its Build on Opus 5.5 would cost about $0.40 more a task and, on its last 11 tasks, save about one round.</p><div class="acts">${R.button({ label: 'Try it in a chat' })}</div>${dock('Ask why it cost this much…')}
    <p class="note">Mock. A then-by row sits under its parent; its share is of the whole. A task can be in more than one row; its money is split, never counted twice, so the rows add up to $131. The "what stands out" line is one suggestion from what was recorded, and leads to a chat; the numbers behind it are its tasks.</p></div>`;
  const mix = R.mixChart({ label: 'AI spend by client', labels: days.map((_, i) => `Nov ${i + 1}`), hint: 'Drag across to narrow', height: 96, parts: [['acme', [16, 26, 9, 31, 23, 4, 39, 25]], ['globex', [9, 13, 5, 16, 12, 2, 20, 14]], ['No client', [13, 22, 8, 27, 20, 3, 34, 21]]].map(([label, values]) => ({ label, values, texts: values.map(usd) })) });

  const f3 = `<div class="col convo-col" style="margin:0"><p class="cap">3 · What is not counted: every dollar has a place</p>${R.placeHead({ title: 'Spend', facts: 'November', mark: R.kindMark({ kind: 'plugin', icon: 'nav-insights' }), word: '$412 of $2,000', why: '$148 has no client', menu: more })}
    ${sentence('AI spend', 'client (cost tag)', '', 'this month', 'mix')}${mix}<div style="height:12px"></div>
    ${hd}${fig('acme', '42%', '$173', '19 h', '$485', '$9.10', '16')}${fig('globex', '22%', '$91', '11 h', '$294', '$8.27', '10')}${fig('No client', '36%', '$148', '17 h', '$454', '$8.71', '18', 'quiet')}
    <div class="acts">${R.button({ label: 'Tag these 18 tasks' })}${R.button({ label: 'Set a default for a project', kind: 'quiet' })}</div>
    <p class="note">Mock. As draws the mix over time, ink shades and a legend; a filter is a word in the sentence, of [everything], its menu ticks several. Default cost tags per project and workspace mean this row shrinks by itself; Set a default leads to the project's Every new task here gets.</p></div>`;
  const rev = (name, n, raised, fixed, disputed, open) => `<div class="fig"><b>${name}</b><span>${n}</span><span>${raised}</span><span>${fixed}</span><span>${disputed}</span><span>${open}</span><span></span></div>`;
  const f4 = `<div class="col convo-col" style="margin:0"><p class="cap">4 · Quality reads the same: the answer, one chart, one "by"</p>${R.placeHead({ title: 'Review', facts: 'Finished tasks, November', mark: R.kindMark({ kind: 'plugin', icon: 'nav-insights' }), word: '1.4 rounds a task', why: 'About the same as before · 71% pass the first time', menu: more })}
    ${sentence('rounds a task', 'review role', '', 'this month')}${chart([1, 2, 1, 2, 1, 1, 2, 1], (n) => `${n} ${n === 1 ? 'round' : 'rounds'}`)}
    <div style="height:12px"></div><div class="fig h"><span>Role</span><span>Reviews</span><span>Raised</span><span>Fixed</span><span>Disputed</span><span>Open</span><span></span></div>${rev('Review of the change', '38', '57', '49', '6', '2')}${rev('Security check of the change', '11', '14', '12', '1', '1')}${rev('Review of the plan', '22', '19', '17', '2', '0')}</div>`;
  // play with the chart: how it is drawn, what it is set against, a stretch dragged out, a point read
  const nDays = ['Nov 4', 'Nov 5', 'Nov 6', 'Nov 7'], nNow = [74, 55, 9, 93], nWas = [51, 40, 14, 66];
  const plot = R.lineChart({ label: 'Spend by day, against the same weekdays before', labels: nDays, current: -1, hint: 'Drag across to narrow', series: [{ label: 'Spend', points: nNow.map((v, i) => ({ value: v, text: usd(v), diff: R.diffWords(v, nWas[i], usd) })) }, { label: 'The same weekdays before', dashed: true, points: nWas.map((v) => ({ value: v, text: usd(v) })) }] }).replace('<div class="ch-read" hidden></div>', '<div class="ch-read" style="right:0"><b>Nov 7</b><span>$93 · +$27, +41% · 10 tasks, opens them</span></div>').replace(/(data-dot="3")/, '$1 data-x').replace('class="ch-hit" data-i="3"', 'class="ch-hit is-read" data-i="3"');
  const kinds = R.compactMenu({ label: 'Draw it as', items: [{ id: 'b', text: 'Bars' }, { id: 'l', text: 'Lines', checked: true }, { id: 'a', text: 'Running total' }, { id: 'm', text: 'Mix' }, { id: 't', text: 'Table' }] });
  const clear = R.button({ label: 'Back to the whole period', iconOnly: true, kind: 'quiet', icon: R.icon('x', 11), cls: 'ch-clear' });
  const f5 = `<div class="col convo-col" style="margin:0"><p class="cap">5 · Play with the chart: how it is drawn, what it is set against, a stretch dragged out, a point read</p>${R.placeHead({ title: 'Spend', facts: 'Nov 4 to Nov 7, dragged out of this month', mark: R.kindMark({ kind: 'plugin', icon: 'set-spending' }), word: '$231 in these 4 days', why: 'Up 35% from $171 in the same weekdays before', menu: more })}
    ${sentence('AI spend', 'project', '', 'Nov 4-7', 'lines', 'the same weekdays before', 'everything', clear)}<div class="kinds">${kinds}</div>${plot}
    <div style="height:12px"></div>${hd}${fig('billing-api', '45%', '$104', '11 h', '$292', '$9.45', '10')}${fig('web-app', '32%', '$74', '7 h', '$191', '$10.57', '8')}${fig('worca-cc', '17%', '$40', '5 h', '$129', '$8.00', '5')}${fig('docs-site', '6%', '$13', '2 h', '$43', '$6.50', '2')}
    <div class="acts">${R.button({ label: 'Download CSV', kind: 'quiet' })}${R.button({ label: 'Save this view', kind: 'quiet' })}</div>${dock('Ask about your spend…')}
    <p class="note">Mock. As picks how it is drawn; only forms that fit the number are offered. Against sets a comparison: the same weekdays before, or the budget as a running total. Drag across the chart to narrow every number on the page to that stretch; × goes back. Hover or tab to a point to read it; click it for its tasks. One axis always: two numbers of different kinds are two charts. A table for a screen reader on each.</p></div>`;
  const fr = (cur, x) => `<div class="fr"><aside class="bar pz-app rail-page">${bar(cur)}</aside><main class="main">${x}</main></div>`;
  document.getElementById('m').innerHTML = fr('Spend', f1) + fr('Why it cost', f2) + fr('Spend', f3) + fr('Review', f4) + fr('Spend', f5);
</script></body></html>
