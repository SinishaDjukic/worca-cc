<!doctype html>
<!-- Mock (Wave 3, 1.3): Ask Worca beside any page. Dev's functions (the page as context, suggestions that fit the page, recent
     chats, a question becomes a chat that follows the page's project, Open in Chat) on Rail: the side column is Chat's own
     column, narrower: its head, a home that says what it knows of the page, the composer with the page as a chip.
     Library pieces only. Render: node plans/rail/mocks/wave-3/render.mjs ask-side 1280 -->
<html lang="en"><head><meta charset="utf-8"><title>Ask beside a page</title>
<link rel="stylesheet" href="../../prototype/app.css">
<link rel="stylesheet" href="../../prototype/design-system/rail-look.css">
<link rel="stylesheet" href="../../prototype/design-system/rail.css">
<link rel="stylesheet" href="../../prototype/shell/shell.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #m{width:1280px;display:grid;grid-template-columns:1fr 420px;min-height:860px;}
  .page{padding:28px 48px;opacity:.45;}
  .side{border-left:1px solid var(--line);display:flex;flex-direction:column;padding:14px 20px 18px;box-sizing:border-box;}
  .side-h{display:flex;align-items:center;gap:6px;font:600 var(--fs-body)/1.2 var(--sans);margin:0 0 22px;}
  .side-h .sp{flex:1;}
  .home{flex:1;}
  .home h2{margin:0 0 4px;font:600 var(--fs-section)/1.3 var(--sans);}
  .home p{margin:0 0 12px;font-size:var(--fs-meta);color:var(--ink-2);}
  .sug{display:grid;gap:2px;margin:0 0 22px;}
  .sug .btn{justify-content:flex-start;}
  .chips{display:flex;gap:6px;margin:0 0 8px;}
  .note{margin:10px 0 0;font-size:12px;color:var(--ink-3);}
</style></head>
<body><div id="m"></div>
<script src="../../prototype/components.js"></script>
<script>
  const R = window.RailUI;
  const page = `<div class="convo-col" style="margin:0">${R.placeHead({ title: 'billing-api', facts: 'Git · ~/src/billing-api · main', mark: R.kindMark({ kind: 'project', tone: 'act' }), word: '3 behind origin/main', why: 'Checked 1 min ago', action: R.button({ label: 'Sync' }) })}${R.settingsSection({ title: 'How its tasks run', rows: [R.settingsRow({ name: 'Pull requests', sentence: 'When a task finishes <b>create a PR ready for review</b>' }), R.settingsRow({ name: 'Engine', sentence: 'Its tasks run on <b>Claude Code</b>' })].join('') })}</div>`;
  const side = `<div class="side-h">${R.sentencePicker({ id: 'h', text: 'New chat', items: [], chevron: R.icon('chevron', 10), tip: 'Your chats' })}<span class="sp"></span>${R.button({ label: 'New chat', kind: 'quiet', iconOnly: true, icon: R.icon('plus', 15) })}${R.button({ label: 'Open in Chat', kind: 'quiet' })}${R.button({ label: 'Hide', kind: 'quiet', iconOnly: true, icon: R.icon('x', 15) })}</div>
    <div class="home"><h2>Ask about billing-api</h2><p>Worca sees its branch, its tasks and its settings.</p>
      <div class="sug">${['Why is it 3 behind, and is it safe to sync?', 'What ran here this week, and what did it cost?', 'What needs me here?'].map((q) => R.button({ label: q, kind: 'quiet' })).join('')}</div>
      ${R.list({ groups: [{ title: 'Recent chats', rows: [R.listRow({ title: 'Billing CSV export', meta: 'Today · 2 tasks · $1.20', mark: R.kindMark({ kind: 'chat', tone: 'ask' }), open: {} }), R.listRow({ title: 'Why did the build fail', meta: 'Today · $0.30', mark: R.kindMark({ kind: 'chat' }), open: {} }), R.listRow({ title: 'Tidy the migrations', meta: 'Today · 1 task · $0.85', mark: R.kindMark({ kind: 'chat' }), open: {} })] }] })}
    </div>
    <div class="chips">${R.chip({ text: 'Project · billing-api ×', title: 'Leave this page out' })}</div>
    ${R.composer({ placeholder: 'Ask Worca…', sentence: `${R.sentencePicker({ id: 'm', text: 'Ask', items: [], chevron: R.icon('chevron', 10) })} on ${R.sentencePicker({ id: 'p', text: 'billing-api', items: [], chevron: R.icon('chevron', 10) })}`, send: R.button({ label: 'Send', kind: 'primary', iconOnly: true, icon: R.icon('up', 14) }) })}
    <p class="note">Mock. A suggestion fills the box, never sends. The chat follows the page's project until you pick one; × leaves the page out. On a task: "Ask about this task" with Why did it stop? / What does it need from me?; on a diff the file is a second chip.</p>`;
  document.getElementById('m').innerHTML = `<main class="page">${page}</main><aside class="side">${side}</aside>`;
</script></body></html>
