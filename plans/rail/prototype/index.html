<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worca Rail · Prototype</title>
<!-- The one Worca: today's shell and pages (today/, captured from the app) with Wave 1 in them: the Rail run and group
     page, Pulse, the profile menu, New run and Settings. The app's own CSS, then the Rail layer, then each feature's. -->
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="design-system/rail-look.css">
<link rel="stylesheet" href="design-system/rail.css">
<link rel="stylesheet" href="pulse/pulse.css">
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<div class="app" id="worca"></div>
<div class="pz-app rail-layer" id="app"></div>
<div class="rc-toast" role="status" aria-live="polite"></div>

<!-- The prototype's own controls (not Worca): which case each Rail piece shows, what happens next, the theme. -->
<details class="mk-tools" data-run-tools>
  <summary title="Prototype">Prototype <span class="mk-stamp" id="mk-stamp"></span></summary>
  <div class="mk-bar">
    <p class="mk-rev" id="mk-rev"></p>
    <label>Run <select class="select select-sm" id="case"></select></label>
    <span class="mk-row"><button type="button" class="btn btn-sm" id="next-event" title="Something outside the run happens: checks finish, a reviewer approves">Next event</button><button type="button" class="btn btn-sm btn-quiet" id="restart" title="Start again from a new run">Restart</button></span>
    <label class="pd-check" title="The next confirmed step or suggestion fails, to show how a failure reads"><input type="checkbox" id="fail-next"> Next one fails</label>
    <label title="What an error nobody planned for looks like">Break <select class="select select-sm" id="break"><option value="">Nothing</option><option value="step">The next step, unexpectedly</option><option value="part">This tab</option><option value="background">Something in the background</option><option value="offline">The connection</option></select></label>
    <label title="What the Runs list and the Chats column have to show">Lists <select class="select select-sm" id="list-case"><option value="full">A full list</option><option value="shared">A shared sign-in</option><option value="empty">Nothing yet</option><option value="loading">Loading</option><option value="offline">Offline</option><option value="failed">Could not load</option><option value="refresh">A refresh fails</option></select></label>
    <label>Pulse <select class="select select-sm" id="pulse-case"></select></label>
    <label title="On a shared sign-in, read and cleared belong to each person; try the Every kind case">Person <select class="select select-sm" id="person"><option>Emil Angelov</option><option>Dana Ruiz</option></select></label>
    <label title="What the shell shows when the connection drops or the sign-in ends">Connection <select class="select select-sm" id="conn"><option value="ok">Connected</option><option value="offline">Offline</option><option value="session">Session expired</option></select></label>
    <label title="A new event arrives in Pulse and plays the chime, if Settings › Notifications › Sound says so">Event <select class="select select-sm" id="new-event-kind"><option value="needs">Needs you</option><option value="problem">Problem</option><option value="info">Info</option></select></label>
    <span class="mk-row"><button type="button" class="btn btn-sm" id="new-event" title="A new event arrives now: try it twice for a burst, or under Away for silence">New event</button></span>
    <span class="mk-row"><button type="button" class="btn btn-sm" id="play-away" title="Plays the away screensaver now, without the 5 idle minutes; any input hides it">Play screensaver</button></span>
    <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-pick="light">Light</button><button type="button" data-theme-pick="dark">Dark</button></div>
    <p class="mk-note">Other pages keep today's design in the Rail colours. Explorers: <a href="run-page.html">run page cases</a> · <a href="pulse.html">Pulse cases</a> · <a href="components.html">components</a>.</p>
  </div>
</details>

<script>(function () { const dark = matchMedia('(prefers-color-scheme: dark)').matches; document.querySelectorAll('[data-theme-pick]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.themePick === 'dark') === dark))); })();</script>
<script src="components.js"></script>
<script>(function () { const s = window.RailStamp; if (!s) return; const when = new Date(s.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); document.getElementById('mk-stamp').textContent = `· ${s.branch} · ${when}`; document.querySelector('.mk-tools > summary').title = `Prototype · ${s.branch} · ${when}`; const rev = document.getElementById('mk-rev'); rev.textContent = `Last update ${when} · ${s.branch} at ${s.sha}${s.dirty ? ', with uncommitted work' : ''}`; })();</script>
<script src="today.js"></script>
<script src="runs/run-page-model.js"></script>
<script src="shell/world.js"></script>
<script src="pulse/pulse-model.js"></script>
<script src="runs/runs-model.js"></script>
<script src="chat/chats-model.js"></script>
<script src="schedules/schedules-model.js"></script>
<script src="settings/settings-model.js"></script>
<script src="settings/settings.js"></script>
<script src="shell/shell.js"></script>
<script src="runs/runs-list.js"></script>
<script src="chat/chats-column.js"></script>
<script src="chat/conversation.js"></script>
<script src="schedules/schedules.js"></script>
<script src="projects/projects.js"></script>
<script src="workflows/workflows.js"></script>
<script src="requirements/requirements.js"></script>
<script src="marketplace/marketplace.js"></script>
<script src="insights/insights.js"></script>
<script src="workspaces/workspaces.js"></script>
<script src="runs/run-page.js"></script>
<script src="pulse/pulse.js"></script>
</body>
</html>
