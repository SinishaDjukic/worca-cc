<section class="view" data-view="projects">
          <!-- Two-screen slide track, twin of History's #hist-shell: the list and the project
               page (#projects/<key>[/memory[/<name>]]) are sibling screens; .detail-open slides. -->
          <div class="proj-shell" id="proj-shell">
            <div class="proj-screen proj-screen-list">
              <div class="topbar">
                <div>
                  <div class="sub">Registered projects: open one for its details and memory, or add and remove folders without touching files on disk or run history.</div>
                </div>
                <div class="topbar-actions"><button type="button" id="project-add-btn" class="btn btn-primary btn-sm">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                  Add project
                </button>
                </div>
              </div>
              <p id="projects-msg" class="form-msg" aria-live="polite"></p>
              <div class="run-list" id="projects-list"><section class="card saved-card proj-zero"><span class="proj-zero-txt">No projects yet</span><button type="button" class="btn btn-primary btn-sm proj-zero-add">Add project</button></section></div>
            </div>
            <div class="proj-screen proj-screen-detail" id="proj-detail" aria-hidden="true"></div>
          </div>

          <!-- clone target for the project page (#projects/<key>). It is a SCREEN inside this
               section, never a routed view of its own: the page's view count is pinned. -->
          <template id="proj-detail-tpl">
            <div class="pd">
              <header class="pd-header">
                <div class="pd-row1">
                  <button type="button" class="pd-back btn" aria-label="Back to projects">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    Back
                  </button>
                  <h1 class="pd-title"></h1>
                  <span class="pd-kind"></span>
                  <!-- Opens the terminal pane in this page's folder (docs/terminal.md); app.js wires every .term-opener. -->
                  <button type="button" class="term-opener btn" aria-label="Open the terminal" aria-expanded="false" title="Terminal (Ctrl+`)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M7.5 9.5l3 2.5-3 2.5"></path><path d="M13 15h3.5"></path></svg>
                  </button>
                </div>
                <div class="pd-meta mono"><span class="pd-path"></span><button type="button" class="btn btn-sm btn-quiet btn-icon copy-btn pd-path-copy" aria-label="Copy path" title="Copy path"><span class="ic ico-copy" aria-hidden="true" style="width:14px;height:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg></span><span class="ic ico-check" aria-hidden="true" style="width:14px;height:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="ic ico-x" aria-hidden="true" style="width:14px;height:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"></path></svg></span></button></div>
                <p class="hint pd-nested-hint" hidden=""></p>
                <div class="pd-actions">
                  <button type="button" class="pd-new btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    New run
                  </button>
                  <button type="button" class="pd-history btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    Show in Runs
                  </button>
                  <!-- Use git (a Folder project) / Link remote (a Git project without origin): paintProjGitButton
                       shows it and sets the word; POST /api/projects/:key/git-init. -->
                  <button type="button" class="pd-git btn" data-needs-git="" hidden="">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><circle cx="18" cy="9" r="2.2"></circle><path d="M6 8.2v7.6M18 11.2c0 3-3 3.8-9.8 5.6"></path></svg>
                    <span class="pd-git-label">Use git</span>
                  </button>
                  <span class="pd-spacer"></span>
                  <!-- The label lives in its own span so a busy state can swap the word and keep the icon. -->
                  <button type="button" class="btn btn-danger pd-remove">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6"></path></svg>
                    <span class="pd-btn-label">Remove</span>
                  </button>
                </div>
                <!-- On the HEADER (like .hd-error): a remove failure must not sit below a long Memory tab. -->
                <div class="pd-error" hidden=""></div>
              </header>
              <div class="pd-body">
                <div class="pd-tabs" role="tablist"></div>
                <div class="pd-sections"></div>
              </div>
            </div>
          </template>
        </section>
