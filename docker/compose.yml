# Worca in a container — see plans/container-isolation-design.md §6.
# Settings come from a .env beside this file; the file itself is not edited.
#   WORCA_PROJECTS  host folder holding your repos (default ~/dev); mounted at the
#                   same path inside (path parity keeps git worktree metadata valid)
#   WORCA_PORT      host port, loopback only (default 4317)
name: worca

services:
  worca:
    image: ${WORCA_IMAGE:-worca:local}
    build:
      context: .
    init: false                               # tini is already the ENTRYPOINT
    user: "${WORCA_UID:-1000}:${WORCA_GID:-1000}"
    ports:
      - "127.0.0.1:${WORCA_PORT:-4317}:4317"  # loopback only — the server's Host guard expects it
    volumes:
      - worca-home:/worca                     # DB, store, runs, plugins, ui.json
      - claude-config:/home/worca/.claude     # Claude Code credentials, memory, settings
      - ${WORCA_PROJECTS:-${HOME}/dev}:${WORCA_PROJECTS:-${HOME}/dev}
    environment:
      TZ: ${TZ:-UTC}
      WORCA_PROJECTS_ROOT: ${WORCA_PROJECTS:-${HOME}/dev}
      # Bare names pass through only when set: an empty GIT_AUTHOR_NAME makes git
      # refuse to commit ("empty ident name"), overriding any user.name config.
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      GH_TOKEN:
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTHROPIC_API_KEY:
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 2048
    mem_limit: ${WORCA_MEM:-6g}
    cpus: ${WORCA_CPUS:-4}
    tmpfs: ["/tmp:size=2g,mode=1777"]
    restart: unless-stopped

volumes:
  worca-home:
  claude-config:
