# Source: worca/templates/pdb.yaml
# Off by default, on purpose. The controller is a StatefulSet of one: minAvailable 1 makes
# every `kubectl drain` wait forever (the eviction is refused until someone deletes the pod by
# hand), and it buys nothing: with one replica there is no second pod to keep. The protection
# that matters is the controller's own drain: an eviction is a SIGTERM, active runs pause with
# the reason 'drain', and the next pod resumes them on boot. Turn this on only when a cluster
# policy requires a PodDisruptionBudget on every workload and operators know to delete the pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worca
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worca
      app.kubernetes.io/instance: worca
      app.kubernetes.io/component: controller
