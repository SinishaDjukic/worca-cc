# Source: worca/templates/broker-deployment.yaml
# The credential broker (docs/credential-broker.md): the controller image with
# `args: [worca, broker]`. Model keys live here and nowhere else; the controller reaches it at
# WORCA_BROKER_URL (port 8080, private), people reach the key page (8081) in multi mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worca-broker
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worca
      app.kubernetes.io/instance: worca
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worca
        app.kubernetes.io/instance: worca
        app.kubernetes.io/component: broker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: ghcr.io/sinishadjukic/worca:9.9.9-full
          imagePullPolicy: IfNotPresent
          args: ["worca", "broker"]
          ports:
            - name: private
              containerPort: 8080
              protocol: TCP
            - name: keypage
              containerPort: 8081
              protocol: TCP
          env:
            - name: WORCA_BROKER_MODE
              value: "multi"
            - name: WORCA_BROKER_HOST
              value: "0.0.0.0"
            - name: WORCA_BROKER_PORT
              value: "8080"
            - name: WORCA_BROKER_UI_PORT
              value: "8081"
            - name: WORCA_BROKER_DATA_DIR
              value: /data
            - name: WORCA_BROKER_PUBLIC_URL
              value: "https://worca-keys.example.com"
            - name: WORCA_CF_ACCESS_AUD
              value: "keys-aud-tag"
            - name: WORCA_CF_ACCESS_TEAM_DOMAIN
              value: "acme.cloudflareaccess.com"
          envFrom:
            - secretRef:
                name: worca-broker
          readinessProbe:
            httpGet:
              path: /healthz
              port: private
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: private
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worca-broker
        - name: tmp
          emptyDir: {}
---
# Source: worca/templates/controller-statefulset.yaml
# The controller: `worca ui` (orchestrator, scheduler, SQLite, the UI) as a StatefulSet of one,
# so its database claim follows the pod. An upgrade or a node drain rolls it by delete + create:
# SIGTERM starts the drain (new runs refused, active runs paused with the reason 'drain'),
# the new pod resumes them on boot (docs/kubernetes.md, Install, upgrade, uninstall).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worca
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  serviceName: worca-workers
  selector:
    matchLabels:
      app.kubernetes.io/name: worca
      app.kubernetes.io/instance: worca
      app.kubernetes.io/component: controller
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worca
        app.kubernetes.io/instance: worca
        app.kubernetes.io/component: controller
      annotations:
        # A changed worker pod template restarts the controller, which re-reads it at boot.
        checksum/worker-pod: 05c631251d84a2f14779ad71673fdea035ca217de8f15214a8957f17a042713c
    spec:
      serviceAccountName: worca
      # The executor backend talks to the API server (RBAC: role.yaml).
      automountServiceAccountToken: true
      enableServiceLinks: false
      # The drain (WORCA_DRAIN_TIMEOUT_MS) plus ~40 s for the rest of the shutdown (chat channels,
      # actions, terminals, the workers' release) before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 100
      imagePullSecrets:
        - name: ghcr-pull
      priorityClassName: worca-controller
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: worca
          operator: Exists
      initContainers:
        # Where fsGroup does not reach (hostPath, NFS exports that squash ownership): create the
        # shared claim's directories and the DB directory, owned by uid 1000. Root only here.
        - name: prepare-volumes
          image: ghcr.io/sinishadjukic/worca:9.9.9-full
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /shared/worca /shared/projects
              chown 1000:1000 /shared/worca /shared/projects /worca-db
              chown 1000:1000 /projects
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: db
              mountPath: /worca-db
            - name: projects
              mountPath: /projects
      containers:
        - name: controller
          image: ghcr.io/sinishadjukic/worca:9.9.9-full
          imagePullPolicy: IfNotPresent
          args: ["worca", "ui"]
          ports:
            - name: http
              containerPort: 4317
              protocol: TCP
            - name: workers
              containerPort: 4319
              protocol: TCP
          env:
            - name: GIT_AUTHOR_EMAIL
              value: "worca@example.com"
            - name: GIT_AUTHOR_NAME
              value: "worca"
            - name: NO_PROXY
              value: "127.0.0.1,localhost,worca-workers,worca-workers.worca-test.svc,worca-broker,worca-broker.worca-test.svc,.internal.example.com"
            - name: PORT
              value: "4317"
            - name: TZ
              value: "Europe/Berlin"
            - name: WORCA_ALLOWED_HOSTS
              value: "worca.example.com"
            - name: WORCA_BROKER_URL
              value: "http://worca-broker.worca-test.svc:8080"
            - name: WORCA_CF_ACCESS_AUD
              value: "aud-tag"
            - name: WORCA_CF_ACCESS_TEAM_DOMAIN
              value: "acme.cloudflareaccess.com"
            - name: WORCA_CONTROLLER_URL
              value: "ws://worca-workers.worca-test.svc:4319"
            - name: WORCA_DB_DIR
              value: "/worca-db"
            - name: WORCA_DRAIN_TIMEOUT_MS
              value: "60000"
            - name: WORCA_EXECUTOR
              value: "kubernetes"
            - name: WORCA_HOME
              value: "/worca"
            - name: WORCA_HOST
              value: "0.0.0.0"
            - name: WORCA_INSTANCE_ID
              value: "worca-prod"
            - name: WORCA_K8S_ACTIVE_DEADLINE_S
              value: "7200"
            - name: WORCA_K8S_ENGINES
              value: "{\"claude\":{\"resources\":{\"limits\":{\"memory\":\"8Gi\"}},\"variant\":\"full\"},\"codex\":{\"image\":\"ghcr.io/example/worca-worker-codex:custom\"}}"
            - name: WORCA_K8S_PENDING_TIMEOUT_MS
              value: "120000"
            - name: WORCA_K8S_POD_TEMPLATE
              value: "/etc/worca/worker-pod.json"
            - name: WORCA_K8S_RESOURCES
              value: "{\"limits\":{\"memory\":\"8Gi\"},\"requests\":{\"cpu\":\"1\",\"memory\":\"2Gi\"}}"
            - name: WORCA_K8S_WORKER_IMAGE
              value: "ghcr.io/sinishadjukic/worca-worker:{version}-{engine}{variant}"
            - name: WORCA_K8S_WORKER_TAG
              value: "9.9.9"
            - name: WORCA_K8S_WORKER_VARIANT
              value: "slim"
            - name: WORCA_PROJECTS_ROOT
              value: "/projects"
            - name: WORCA_WORKER_CHAT_IDLE_MS
              value: "600000"
            - name: WORCA_WORKER_MAX
              value: "8"
            - name: WORCA_WORKER_PORT
              value: "4319"
            - name: WORCA_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORCA_BROKER_SYSTEM_BILL_TO
              valueFrom:
                configMapKeyRef:
                  key: system
                  name: worca-billing
          envFrom:
            - secretRef:
                name: worca-secrets
            - configMapRef:
                name: worca-extra
          # The server's Host guard answers 403 to any Host it does not know; the kubelet sends
          # the pod IP as Host unless told otherwise. Keep the Host: localhost header.
          startupProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "4", "-H", "Host: localhost", "http://127.0.0.1:4317/api/health"]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "4", "-H", "Host: localhost", "http://127.0.0.1:4317/api/health"]
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "4", "-H", "Host: localhost", "http://127.0.0.1:4317/api/health"]
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: db
              mountPath: /worca-db
            - name: shared
              mountPath: /worca
              subPath: worca
            - name: projects
              mountPath: /projects
            - name: tmp
              mountPath: /tmp
            - name: worker-pod
              mountPath: /etc/worca
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: worca-shared
        - name: projects
          persistentVolumeClaim:
            claimName: team-projects
        - name: tmp
          emptyDir: {}
        - name: worker-pod
          configMap:
            name: worca-worker-pod
  volumeClaimTemplates:
    - metadata:
        name: db
        labels:
          app.kubernetes.io/name: worca
          app.kubernetes.io/instance: worca
          app.kubernetes.io/component: controller
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "fast-ssd"
        resources:
          requests:
            storage: 20Gi
