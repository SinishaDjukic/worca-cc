# Source: worca/templates/ingress.yaml
# The UI only. The hosts here become WORCA_ALLOWED_HOSTS (unless controller.env sets it), and
# a non-loopback host needs an identity check: WORCA_CF_ACCESS_TEAM_DOMAIN + WORCA_CF_ACCESS_AUD
# (Cloudflare Access) or WORCA_IDENTITY_ISSUER in controller.env, or the server refuses to start.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worca
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - worca.example.com
      secretName: worca-tls
  rules:
    - host: "worca.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worca
                port:
                  name: http
