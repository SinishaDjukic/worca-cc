# Source: worca/templates/workers-service.yaml
# The controller's workers listener (WORCA_WORKER_PORT): the address every worker pod connects
# back to (WORCA_CONTROLLER_URL = ws://<this>.<namespace>.svc:4319), authenticated by a one-time
# token. ClusterIP only, and never on the Ingress. Also the StatefulSet's serviceName.
apiVersion: v1
kind: Service
metadata:
  name: worca-workers
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  # A worker pod started by a controller that is not Ready (it resumes runs as it boots; readiness can flap under
  # load) must still reach it: this port is the controller's own, token-authenticated, never routed to people.
  publishNotReadyAddresses: true
  ports:
    - name: workers
      port: 4319
      targetPort: workers
      protocol: TCP
  selector:
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/component: controller
