# Source: worca/templates/controller-statefulset.yaml
# The controller: `worca ui` (orchestrator, scheduler, SQLite, the UI) as a StatefulSet of one,
# so its database claim follows the pod. An upgrade or a node drain rolls it by delete + create:
# SIGTERM starts the drain (new runs refused, active runs paused with the reason 'drain'),
# the new pod resumes them on boot (docs/kubernetes.md, Install, upgrade, uninstall).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worca
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  serviceName: worca-workers
  selector:
    matchLabels:
      app.kubernetes.io/name: worca
      app.kubernetes.io/instance: worca
      app.kubernetes.io/component: controller
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worca
        app.kubernetes.io/instance: worca
        app.kubernetes.io/component: controller
      annotations:
        # A changed worker pod template restarts the controller, which re-reads it at boot.
        checksum/worker-pod: 28378b22e2df212d293e7212efd59692770ded81b7b2f24d8d7914786260be64
    spec:
      serviceAccountName: worca
      # The executor backend talks to the API server (RBAC: role.yaml).
      automountServiceAccountToken: true
      enableServiceLinks: false
      # The drain (WORCA_DRAIN_TIMEOUT_MS) plus ~40 s for the rest of the shutdown (chat channels,
      # actions, terminals, the workers' release) before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/sinishadjukic/worca:__APP_VERSION__
          imagePullPolicy: IfNotPresent
          args: ["worca", "ui"]
          ports:
            - name: http
              containerPort: 4317
              protocol: TCP
            - name: workers
              containerPort: 4319
              protocol: TCP
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/worca-auth-ca/ca.crt"
            - name: NO_PROXY
              value: "127.0.0.1,localhost,worca-workers,worca-workers.worca-test.svc"
            - name: PORT
              value: "4317"
            - name: WORCA_ALLOWED_HOSTS
              value: "worca.example.com"
            - name: WORCA_CONTROLLER_URL
              value: "ws://worca-workers.worca-test.svc:4319"
            - name: WORCA_DB_DIR
              value: "/worca-db"
            - name: WORCA_DRAIN_TIMEOUT_MS
              value: "20000"
            - name: WORCA_EXECUTOR
              value: "kubernetes"
            - name: WORCA_HOME
              value: "/worca"
            - name: WORCA_HOST
              value: "0.0.0.0"
            - name: WORCA_IDENTITY_AUDIENCE
              value: "11111111-2222-3333-4444-555555555555"
            - name: WORCA_IDENTITY_EMAIL_CLAIM
              value: "preferred_username"
            - name: WORCA_IDENTITY_ISSUER
              value: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/v2.0"
            - name: WORCA_IDENTITY_JWKS_URL
              value: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/discovery/v2.0/keys"
            - name: WORCA_IDENTITY_TEAMS_CLAIM
              value: "roles"
            - name: WORCA_INSTANCE_ID
              value: "worca"
            - name: WORCA_K8S_ACTIVE_DEADLINE_S
              value: "86400"
            - name: WORCA_K8S_PENDING_TIMEOUT_MS
              value: "300000"
            - name: WORCA_K8S_POD_TEMPLATE
              value: "/etc/worca/worker-pod.json"
            - name: WORCA_K8S_RESOURCES
              value: "{\"limits\":{\"memory\":\"4Gi\"},\"requests\":{\"cpu\":\"500m\",\"memory\":\"1Gi\"}}"
            - name: WORCA_K8S_WORKER_IMAGE
              value: "ghcr.io/sinishadjukic/worca-worker:{version}-{engine}{variant}"
            - name: WORCA_K8S_WORKER_TAG
              value: "__APP_VERSION__"
            - name: WORCA_K8S_WORKER_VARIANT
              value: "slim"
            - name: WORCA_PROJECTS_ROOT
              value: "/projects"
            - name: WORCA_WORKER_CHAT_IDLE_MS
              value: "900000"
            - name: WORCA_WORKER_MAX
              value: "20"
            - name: WORCA_WORKER_PORT
              value: "4319"
            - name: WORCA_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # The server's Host guard answers 403 to any Host it does not know; the kubelet sends
          # the pod IP as Host unless told otherwise. Keep the Host: localhost header.
          startupProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "4", "-H", "Host: localhost", "http://127.0.0.1:4317/api/health"]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "4", "-H", "Host: localhost", "http://127.0.0.1:4317/api/health"]
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "4", "-H", "Host: localhost", "http://127.0.0.1:4317/api/health"]
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: db
              mountPath: /worca-db
            - name: shared
              mountPath: /worca
              subPath: worca
            - name: shared
              mountPath: /projects
              subPath: projects
            - name: tmp
              mountPath: /tmp
            - name: worker-pod
              mountPath: /etc/worca
              readOnly: true
            - name: auth-ca
              mountPath: /etc/worca-auth-ca
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: worca-shared
        - name: tmp
          emptyDir: {}
        - name: worker-pod
          configMap:
            name: worca-worker-pod
        - name: auth-ca
          secret:
            secretName: corp-ca
            items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: db
        labels:
          app.kubernetes.io/name: worca
          app.kubernetes.io/instance: worca
          app.kubernetes.io/component: controller
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
# Source: worca/templates/ingress.yaml
# The UI only. The hosts here become WORCA_ALLOWED_HOSTS (unless controller.env sets it), and
# a non-loopback host needs an identity check: auth.enabled (oauth2-proxy, and the Ingress routes
# to it), or WORCA_CF_ACCESS_TEAM_DOMAIN + WORCA_CF_ACCESS_AUD (Cloudflare Access) or
# WORCA_IDENTITY_ISSUER in controller.env, or the server refuses to start.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worca
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - worca.example.com
      secretName: worca-tls
  rules:
    - host: "worca.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worca-auth
                port:
                  name: http
---
# Source: worca/templates/tests/test-guard.yaml
# `helm test <release>`: the UI Service answers, and the server refuses a caller it does not know.
# A test pod is a plain pod peer: in local mode (no Ingress) the server answers only loopback and
# the node's gateway (kubelet probes), so the right response here is 403 `forbidden`; with the
# Ingress on, the Service name is not an allowed host, so it is 403 too. A 200 would mean the
# guard is off. The health body itself is read inside the pod (tools/k8s-smoke.mjs, docs/kubernetes.md).
apiVersion: v1
kind: Pod
metadata:
  name: worca-test-guard
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      env:
        - name: URL
          value: "http://worca:4317/api/health"
      command: ["sh", "-ec"]
      args:
        - |
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$URL")
          if [ "$code" != 403 ]; then echo "expected 403 from a pod peer at $URL, got $code"; exit 1; fi
          body=$(curl -sS --max-time 10 "$URL")
          case "$body" in *forbidden*) ;; *) echo "403 without worca's forbidden body: $body"; exit 1;; esac
          echo "ok: $URL answers and refuses an unknown peer ($body)"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
