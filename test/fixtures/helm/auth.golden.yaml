# Source: worca/templates/pvc-shared.yaml
# The ReadWriteMany claim controller and workers share: /worca (subPath worca) and /projects
# (subPath projects). SQLite never lives here (storage.db is a ReadWriteOnce claim).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worca-shared
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
