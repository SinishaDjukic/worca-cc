# Source: worca/templates/auth.yaml
# oauth2-proxy in front of the controller (docs/auth.md): signs people in with the OIDC
# provider, admits only auth.allowedGroups, and forwards to the controller with the session's ID
# token in X-Worca-Identity (a value a client sends there is stripped). Worca verifies that
# token itself against auth.oidc.jwksUrl: the proxy is not trusted on its word.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worca-auth
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
    app.kubernetes.io/component: auth
data:
  oauth2-proxy.yaml: |
    server:
      bindAddress: "0.0.0.0:4180"
    upstreamConfig:
      upstreams:
        - id: worca
          path: /
          uri: http://worca.worca-test.svc:4317
          passHostHeader: true
          proxyWebSockets: true
    injectRequestHeaders:
      - name: X-Worca-Identity
        values:
          - claimSource:
              claim: id_token
    providers:
      - id: oidc
        provider: oidc
        name: Worca
        clientID: "11111111-2222-3333-4444-555555555555"
        clientSecretFile: /etc/oauth2-proxy/secret/client-secret
        scope: "openid email profile offline_access"
        code_challenge_method: S256
        allowedGroups: ["worca.team-a","worca.team-b"]
        caFiles: ["/etc/oauth2-proxy/ca/ca.crt"]
        useSystemTrustStore: true
        oidcConfig:
          issuerURL: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/v2.0"
          jwksURL: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/discovery/v2.0/keys"
          emailClaim: "preferred_username"
          groupsClaim: "roles"
          audienceClaims: ["aud"]
          insecureSkipNonce: false
