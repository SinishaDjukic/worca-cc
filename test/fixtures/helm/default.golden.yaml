# Source: worca/templates/configmap-worker-pod.yaml
# The worker pod template (WORCA_K8S_POD_TEMPLATE=/etc/worca/worker-pod.json): a JSON Pod
# manifest the kubernetes executor backend starts from for every run and chat worker. It
# overwrites metadata.name, merges its labels, sets the worca.dev/scope annotation, fills the
# `worker` container's image, env (appended) and resources, and enforces restartPolicy Never,
# automountServiceAccountToken false and enableServiceLinks false. Edit through values
# (worker.*); the StatefulSet restarts on a change (checksum/worker-pod).
apiVersion: v1
kind: ConfigMap
metadata:
  name: worca-worker-pod
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
data:
  worker-pod.json: |-
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "annotations": {
          "worca.dev/scope": ""
        },
        "labels": {
          "app.kubernetes.io/component": "worker",
          "app.kubernetes.io/instance": "worca",
          "app.kubernetes.io/name": "worca",
          "app.kubernetes.io/part-of": "worca",
          "worca.dev/instance": "worca"
        },
        "name": "worca-worker",
        "namespace": "worca-test"
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "env": [
              {
                "name": "NO_PROXY",
                "value": "127.0.0.1,localhost,worca-workers,worca-workers.worca-test.svc"
              },
              {
                "name": "WORCA_CONTAINER",
                "value": "1"
              },
              {
                "name": "WORCA_HOME",
                "value": "/worca"
              },
              {
                "name": "WORCA_PROJECTS_ROOT",
                "value": "/projects"
              }
            ],
            "image": "ghcr.io/sinishadjukic/worca-worker:placeholder",
            "imagePullPolicy": "IfNotPresent",
            "name": "worker",
            "resources": {
              "limits": {
                "memory": "4Gi"
              },
              "requests": {
                "cpu": "500m",
                "memory": "1Gi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": false
            },
            "volumeMounts": [
              {
                "mountPath": "/worca",
                "name": "shared",
                "subPath": "worca"
              },
              {
                "mountPath": "/projects",
                "name": "shared",
                "subPath": "projects"
              },
              {
                "mountPath": "/tmp",
                "name": "tmp"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ]
          }
        ],
        "enableServiceLinks": false,
        "restartPolicy": "Never",
        "securityContext": {
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch",
          "runAsGroup": 1000,
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 30,
        "volumes": [
          {
            "name": "shared",
            "persistentVolumeClaim": {
              "claimName": "worca-shared"
            }
          },
          {
            "emptyDir": {
              "sizeLimit": "2Gi"
            },
            "name": "tmp"
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "256Mi"
            },
            "name": "shm"
          }
        ]
      }
    }
---
# Source: worca/templates/pvc-shared.yaml
# The ReadWriteMany claim controller and workers share: /worca (subPath worca) and /projects
# (subPath projects). SQLite never lives here (storage.db is a ReadWriteOnce claim).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worca-shared
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
# Source: worca/templates/role.yaml
# What the kubernetes executor backend needs, in this namespace only: it creates one Pod per
# run or chat thread, watches it, deletes it afterwards, and sweeps the orphans of a previous
# controller at boot (list). pods/log: a failed worker's log in the run's error message.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worca-workers
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# Source: worca/templates/rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worca-workers
  namespace: worca-test
  labels:
    helm.sh/chart: worca-__CHART_VERSION__
    app.kubernetes.io/name: worca
    app.kubernetes.io/instance: worca
    app.kubernetes.io/version: "__APP_VERSION__"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: worca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worca-workers
subjects:
  - kind: ServiceAccount
    name: worca
    namespace: worca-test
