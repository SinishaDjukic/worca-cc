.s-audit .audit-head{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);

.s-audit .audit-title{margin-top:14px;}

.s-audit .audit-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}

  padding:clamp(14px,2.3vw,30px) clamp(13px,2.1vw,28px) clamp(18px,2.5vw,34px);
  background:radial-gradient(125% 135% at 6% -12%,#E6F0F7 0%,#EFEFEC 44%,#E9E9E5 100%);}

.s-audit .audit-cola{min-width:0;}
.s-audit .audit-colb{min-width:0;position:relative;z-index:3;
  margin-left:clamp(-34px,-2vw,-14px);margin-top:clamp(26px,3.6vw,56px);}
.s-audit .audit-cap{display:inline-flex;align-items:center;gap:7px;margin:0 0 9px 4px;
  font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);}
.s-audit .audit-cap::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);}
.s-audit .audit-capb{margin-left:46px;}
.s-audit .audit-capb::before{background:var(--violet);}

/* ---- window chrome ---- */
.s-audit .audit-win{margin:0;background:var(--sheet);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;
  box-shadow:0 18px 44px rgba(25,25,27,.10),0 2px 5px rgba(25,25,27,.05);}
.s-audit .audit-colb .audit-win{box-shadow:0 28px 62px rgba(25,25,27,.17),0 3px 8px rgba(25,25,27,.07);}
.s-audit .audit-chrome{display:flex;align-items:center;gap:6px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--field);}
.s-audit .audit-dot{width:8px;height:8px;border-radius:50%;background:#DCDCD8;flex:0 0 auto;}
.s-audit .audit-ct{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-audit .audit-body{padding:15px 17px 17px;background:var(--bg);}
.s-audit .audit-cola .audit-body{padding-right:42px;}

/* ---- statistics topbar ---- */
.s-audit .audit-tbh{font-size:16.5px;font-weight:700;letter-spacing:-.022em;color:var(--ink);}
.s-audit .audit-tbs{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;}
.s-audit .audit-seg{display:inline-flex;background:var(--field);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:3px;margin:12px 0 13px;max-width:100%;overflow:hidden;}
.s-audit .audit-seg span{font-size:10.5px;font-weight:600;color:var(--ink-2);padding:5px 10px;
  border-radius:8px;white-space:nowrap;}
.s-audit .audit-seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(25,25,27,.10);}

/* ---- KPI tiles ---- */
.s-audit .audit-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px;}
.s-audit .audit-tile{min-width:0;background:var(--sheet);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px 11px;}
.s-audit .audit-tl{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:10px;font-weight:600;}
.s-audit .audit-tl svg{width:13px;height:13px;color:var(--ink-3);flex:0 0 auto;}
.s-audit .audit-tl .audit-tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-audit .audit-td{margin-left:auto;background:var(--field);color:var(--ink-2);font-size:8.5px;

.s-audit .audit-tv{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink);
  margin-top:5px;line-height:1.2;letter-spacing:-.025em;}
.s-audit .audit-tvf{font-size:11px;color:var(--ink-3);}

  margin-top:8px;overflow:hidden;}
.s-audit .audit-tm i{display:block;height:100%;border-radius:999px;background:var(--blue-ink);
  transform-origin:left center;animation:audit-wide 1.05s cubic-bezier(.2,.8,.2,1) .15s both;}
.s-audit .audit-ts{display:block;color:var(--ink-3);font-size:9px;margin-top:5px;line-height:1.5;}
.s-audit .audit-ts b{font-weight:600;color:var(--ink-2);}

/* ---- chart cards ---- */
.s-audit .audit-charts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.s-audit .audit-chart{min-width:0;background:var(--sheet);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px 8px;}
.s-audit .audit-ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px;}
.s-audit .audit-cht{font-size:11.5px;font-weight:700;letter-spacing:-.012em;color:var(--ink);white-space:nowrap;}
.s-audit .audit-chr{font-size:9px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-audit .audit-lgd{display:flex;gap:11px;flex-wrap:wrap;margin:-3px 0 6px;font-size:9.5px;color:var(--ink-2);}
.s-audit .audit-lg{display:inline-flex;align-items:center;gap:5px;}
.s-audit .audit-lg b{font-family:var(--mono);font-weight:600;color:var(--ink);}
.s-audit .audit-sw{width:8px;height:8px;border-radius:2px;display:inline-block;}
.s-audit .audit-svg{display:block;width:100%;height:auto;}
.s-audit .audit-svg text{font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);}
.s-audit .audit-gl{stroke:var(--line);stroke-width:1;}
.s-audit .audit-g0{stroke:var(--line-2);stroke-width:1;}
.s-audit .audit-ab{transform-box:view-box;transform-origin:0px 170px;
  animation:audit-rise .85s cubic-bezier(.2,.8,.2,1) both;}

/* ---- pipeline detail: tabs ---- */
.s-audit .audit-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
.s-audit .audit-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
  border:1.5px solid var(--line);border-radius:999px;background:var(--sheet);
  font-size:10.5px;font-weight:600;color:var(--ink-2);}
.s-audit .audit-tab svg{width:12px;height:12px;flex:0 0 auto;}
.s-audit .audit-tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.s-audit .audit-tbg{padding:1px 6px;border-radius:999px;background:var(--field);color:var(--ink-3);
  font-family:var(--mono);font-size:8.5px;font-weight:600;}
.s-audit .audit-tab.on .audit-tbg{background:var(--blue-bg);color:var(--blue-ink);}

/* ---- pipeline detail: stat cards + blocks ---- */
.s-audit .audit-ovg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.s-audit .audit-ovc{min-width:0;background:var(--sheet);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px 12px;}
.s-audit .audit-ovl{font-size:8.5px;font-weight:600;letter-spacing:.14em;color:var(--ink-3);}
.s-audit .audit-ovv{margin-top:7px;font-family:var(--mono);font-size:15px;color:var(--ink);letter-spacing:-.025em;}
.s-audit .audit-ovs{margin-top:4px;font-family:var(--mono);font-size:8.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-audit .audit-blk{background:var(--sheet);border:1px solid var(--line);border-radius:14px;

.s-audit .audit-blkh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;

.s-audit .audit-blkh em{font-family:var(--mono);font-size:9px;font-weight:500;font-style:normal;color:var(--ink-3);}

.s-audit .audit-agm{margin-left:auto;font-family:var(--mono);font-size:8.5px;font-weight:500;color:var(--ink-3);}

.s-audit .audit-agd{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--ink-3);white-space:nowrap;}
.s-audit .audit-agc{font-family:var(--mono);font-size:9px;color:var(--ink-2);text-align:right;
  min-width:46px;white-space:nowrap;}

/* ---- floating spend card ---- */
.s-audit .audit-float{position:absolute;z-index:5;left:clamp(2px,1.6vw,24px);
  bottom:clamp(-44px,-2.6vw,-22px);display:flex;align-items:center;gap:15px;
  padding:14px 22px 14px 16px;border-radius:22px;background:var(--sheet);
  box-shadow:0 24px 56px rgba(25,25,27,.17),0 2px 6px rgba(25,25,27,.06);}
.s-audit .audit-ring{position:relative;width:72px;height:72px;flex:0 0 auto;}
.s-audit .audit-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.s-audit .audit-rt{fill:none;stroke:var(--blue-bg);stroke-width:7;}
.s-audit .audit-ra{fill:none;stroke:var(--blue-ink);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:213.63;stroke-dashoffset:79.04;animation:audit-sweep 1.5s cubic-bezier(.2,.8,.2,1) both;}
.s-audit .audit-rv{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink);}
.s-audit .audit-fk{font-size:10.5px;font-weight:600;color:var(--ink-2);}
.s-audit .audit-fv{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.035em;
  color:var(--ink);line-height:1.15;margin-top:2px;}
.s-audit .audit-fs{font-size:9.5px;color:var(--ink-3);margin-top:4px;}

/* ---- motion ---- */
@keyframes audit-rise{from{transform:scaleY(0);}}
@keyframes audit-wide{from{transform:scaleX(0);}}
@keyframes audit-sweep{from{stroke-dashoffset:213.63;}}

/* ---- responsive ---- */
@media(max-width:1180px){
  .s-audit .audit-head{grid-template-columns:minmax(0,1fr);align-items:start;}
  .s-audit .audit-screens{grid-template-columns:minmax(0,1fr);gap:22px;max-width:760px;margin-left:auto;margin-right:auto;}
  .s-audit .audit-colb{margin-left:0;margin-top:0;}
  .s-audit .audit-capb{margin-left:4px;}
  .s-audit .audit-cola .audit-body{padding-right:17px;}
  .s-audit .audit-float{position:static;margin-top:20px;}
}
@media(max-width:700px){
  .s-audit .audit-tiles{grid-template-columns:repeat(2,1fr);}
  .s-audit .audit-charts{grid-template-columns:1fr;}
  .s-audit .audit-body{padding:13px 12px 14px;}
  .s-audit .audit-cola .audit-body{padding-right:12px;}
}
@media(max-width:460px){
  .s-audit .audit-tiles{grid-template-columns:1fr;}
  .s-audit .audit-ovv{font-size:13px;}
  .s-audit .audit-ovs{white-space:normal;}
  .s-audit .audit-ovc{padding:10px 10px 11px;}
  .s-audit .audit-srow{grid-template-columns:64px minmax(0,1fr) 40px;gap:7px;}
  .s-audit .audit-float{flex-wrap:wrap;gap:12px;padding:14px 16px;}
  .s-audit .audit-agn{max-width:88px;}
}
</style>
