name: Feature request
description: Suggest something Worca could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Worca to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use now, or other ways to solve it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runs and pipeline
        - Chat
        - Terminal
        - MCP servers
        - Models and routing
        - Team and hosting
        - UI
        - CLI
        - Other
