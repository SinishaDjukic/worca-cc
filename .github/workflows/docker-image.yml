name: Container image

# Reusable: builds the Worca container images from a git ref and pushes them to GHCR with
# provenance, SBOM and a keyless cosign signature. Called by release-npm-app.yml on a release
# tag and by docker-rebuild.yml on the weekly refresh; a workflow_dispatch builds a subset by
# hand. See plans/container-isolation-design.md §10.3 and docs/workers.md.
#
# The matrix (the `plan` job writes it, `engines` narrows the worker rows):
#   controller            slim + full        ghcr.io/sinishadjukic/worca:<tag>[-full]
#   worker claude         slim + full        ghcr.io/sinishadjukic/worca-worker:<tag>-claude[-full]
#   worker all            slim + full        ...worca-worker:<tag>-all[-full]   (every engine)
#   worker <other engine> slim               ...worca-worker:<tag>-<engine>
# each for linux/amd64 and linux/arm64, joined into one manifest per (target, engine, variant).
# The goose and cursor rows are continue-on-error: their upstreams ship no release for every
# architecture every time, and a missing worker image must not hold the controller release.
#
# The tarball is produced by `npm pack` from the checked-out ref — the same
# source and the same pack step the npm publish runs on that tag — so the images
# hold exactly what npm ships for that version.
on:
  workflow_call:
    inputs:
      ref:
        description: git ref to build (a worca-app-v* tag)
        required: true
        type: string
      channel:
        description: latest | rc — which moving tags to update
        required: true
        type: string
      date_tag:
        description: also push a <version>-YYYYMMDD tag (weekly rebuilds)
        required: false
        type: boolean
        default: false
      engines:
        description: comma list of worker engines to build (claude,codex,copilot,cursor,gemini,qwen,goose,opencode,all); empty = every one
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to build (a worca-app-v* tag)
        required: true
        type: string
      channel:
        description: latest | rc — which moving tags to update
        required: true
        type: choice
        options: [rc, latest]
        default: rc
      date_tag:
        description: also push a <version>-YYYYMMDD tag
        required: false
        type: boolean
        default: false
      engines:
        description: comma list of worker engines to build (claude,codex,copilot,cursor,gemini,qwen,goose,opencode,all); empty = every one
        required: false
        type: string
        default: ""

env:
  # GHCR repository names must be lowercase; the owner login is not.
  IMAGE: ghcr.io/sinishadjukic/worca
  IMAGE_WORKER: ghcr.io/sinishadjukic/worca-worker

jobs:
  # The matrix as JSON: one row per (target, engine, variant, arch) for `build`, one per
  # (target, engine, variant) for `manifest`. A static `include` cannot be narrowed by an input.
  plan:
    name: plan the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - id: plan
        env:
          ENGINES: ${{ inputs.engines }}
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const all = ['claude', 'codex', 'copilot', 'cursor', 'gemini', 'qwen', 'goose', 'opencode', 'all'];
          const asked = (process.env.ENGINES || '').split(',').map((s) => s.trim()).filter(Boolean);
          for (const e of asked) if (!all.includes(e)) { console.error(`unknown engine ${e}`); process.exit(2); }
          const engines = asked.length ? asked : all;
          const fragile = new Set(['goose', 'cursor', 'all']);
          const rows = [{ target: 'controller', engine: 'none', variant: 'slim' }, { target: 'controller', engine: 'none', variant: 'full' }];
          for (const e of engines) {
            rows.push({ target: 'worker', engine: e, variant: 'slim' });
            if (e === 'claude' || e === 'all') rows.push({ target: 'worker', engine: e, variant: 'full' });
          }
          const manifest = rows.map((r) => ({ ...r, key: `${r.target}-${r.engine}-${r.variant}`, fragile: r.target === 'worker' && fragile.has(r.engine) }));
          const archs = [{ arch: 'amd64', runner: 'ubuntu-latest' }, { arch: 'arm64', runner: 'ubuntu-24.04-arm' }];
          const build = manifest.flatMap((r) => archs.map((a) => ({ ...r, ...a })));
          console.log(`build=${JSON.stringify({ include: build })}`);
          console.log(`manifest=${JSON.stringify({ include: manifest })}`);
          console.error(`${build.length} builds, ${manifest.length} manifests: ${manifest.map((r) => r.key).join(' ')}`);
          EOF

  build:
    name: build ${{ matrix.key }} ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # A goose or cursor worker that does not build (no upstream release for this arch yet) must
    # not hold the release of everything else.
    continue-on-error: ${{ matrix.fragile }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Pack @worca/app
        id: meta
        run: |
          npm ci
          mkdir -p docker/.pack
          npm pack --silent --pack-destination docker/.pack
          TGZ="$(ls docker/.pack/worca-app-*.tgz)"
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "claude_code=$(cat docker/CLAUDE_CODE_VERSION)" >> "$GITHUB_OUTPUT"
          # The other engines' pins (docker/engines.env), one build arg per line.
          {
            echo "pins<<PINS_EOF"
            grep -Ev '^\s*(#|$)' docker/engines.env
            echo "PINS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            WORCA_TARBALL=${{ steps.meta.outputs.tarball }}
            CLAUDE_CODE_VERSION=${{ steps.meta.outputs.claude_code }}
            VARIANT=${{ matrix.variant }}
            ENGINE=${{ matrix.engine == 'none' && 'claude' || matrix.engine }}
            ${{ steps.meta.outputs.pins }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ matrix.target == 'worker' && env.IMAGE_WORKER || env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.key }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.key }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "/tmp/digests/${{ matrix.key }}"
          touch "/tmp/digests/${{ matrix.key }}/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.key }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest + sign (${{ matrix.key }})
    needs: [plan, build]
    # Not skipped when one build row failed: each manifest row checks its own digests (below) and publishes or
    # refuses on its own, so a worker image that did not build never holds back the controller image.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.fragile }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.manifest) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.key }}-*
          merge-multiple: true
      # Every row's digests, to know whether the whole build succeeded: the build job's result says `success` when only
      # a fragile row (continue-on-error) failed, and a fragile row's absence must hold the moving tags as well — a
      # controller `latest` never gets ahead of a worker image's.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/all-digests
          pattern: digests-*
      - name: Did every build row deliver?
        id: whole
        env:
          ROWS: ${{ needs.plan.outputs.manifest }}
          ARCH_COUNT: 2
        run: |
          expected=$(( $(printf '%s' "$ROWS" | jq '.include | length') * ARCH_COUNT ))
          got=$(find /tmp/all-digests -type f | wc -l)
          echo "expected=$expected got=$got"
          if [ "$got" -ge "$expected" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags mirror the npm dist-tag logic (docs/RELEASING.md §5):
      #   stable 1.3.0 -> 1.3.0, 1.3, 1, latest        (+ "-full" twins)
      #   rc 1.3.0-rc.1 -> 1.3.0-rc.1, rc               (+ "-full" twins)
      #   date_tag     -> 1.3.0-20260919 in addition
      # A worker image's tags carry its engine: <tag>-<engine>[-full] in the worca-worker repo.
      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DATE_TAG: ${{ inputs.date_tag }}
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
          ENGINE: ${{ matrix.engine }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_COMPLETE: ${{ steps.whole.outputs.complete }}
        run: |
          suffix=""; [ "$TARGET" = "worker" ] && suffix="-$ENGINE"
          [ "$VARIANT" = "full" ] && suffix="$suffix-full"
          tags="$VERSION$suffix"
          # The moving tags (latest, rc, 1, 1.3) move together or not at all: with one build row failed (a fragile
          # row's failure does not fail the build job), this row still publishes its version tag, but a controller
          # `latest` must not get ahead of a worker image that did not build.
          if [ "$BUILD_RESULT" != "success" ] || [ "$BUILD_COMPLETE" != "true" ]; then
            echo "::error title=moving tags held::a build row did not deliver its digests: $VERSION$suffix is published, but latest/rc/$major/$minor stay where they were — fix the failed row and re-run to move them"
            echo "### Moving tags held for $VERSION$suffix" >> "$GITHUB_STEP_SUMMARY"; echo "A build row did not deliver its digests; only the version tag was published." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHANNEL" = "latest" ]; then
            major="${VERSION%%.*}"; minor="${VERSION%.*}"
            tags="$tags $minor$suffix $major$suffix latest$suffix"
          else
            tags="$tags rc$suffix"
          fi
          if [ "$DATE_TAG" = "true" ]; then tags="$tags $VERSION-$(date -u +%Y%m%d)$suffix"; fi
          repo="$IMAGE"; [ "$TARGET" = "worker" ] && repo="$IMAGE_WORKER"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "will tag $repo: $tags"

      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests/${{ matrix.key }}
        env:
          REPO: ${{ steps.tags.outputs.repo }}
          # linux/amd64 + linux/arm64: the `archs` list of the plan job. A row whose build may fail
          # (continue-on-error) can arrive here with one digest; a tag that exists for one
          # architecture only fails every pull on the other, so nothing is published then.
          ARCH_COUNT: 2
        run: |
          have=$(ls | wc -l)
          if [ "$have" -ne "$ARCH_COUNT" ]; then
            echo "::error::${{ matrix.key }}: $have of $ARCH_COUNT architectures built; not publishing a partial manifest"
            exit 1
          fi
          args=""
          for t in ${{ steps.tags.outputs.tags }}; do args="$args -t $REPO:$t"; done
          docker buildx imagetools create $args $(printf "$REPO@sha256:%s " *)
          first="$(echo ${{ steps.tags.outputs.tags }} | cut -d' ' -f1)"
          echo "digest=$(docker buildx imagetools inspect "$REPO:$first" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the manifest (keyless, OIDC)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          REPO: ${{ steps.tags.outputs.repo }}
        run: cosign sign --yes "$REPO@$DIGEST"

  smoke:
    name: smoke pushed images
    needs: [build, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mock-mode smoke against the pushed controller manifest
        run: node tools/docker-smoke.mjs --image "$IMAGE:${{ needs.build.outputs.version }}"
      - name: Worker contract + controller/worker end to end against the pushed manifests
        # Skipped when `engines` left claude out. With both images the smoke also runs a mock script
        # node on a worker container the controller starts (docs/workers.md).
        if: inputs.engines == '' || contains(format(',{0},', inputs.engines), ',claude,')
        run: node tools/docker-smoke.mjs --image "$IMAGE:${{ needs.build.outputs.version }}" --worker-image "$IMAGE_WORKER:${{ needs.build.outputs.version }}-claude"
