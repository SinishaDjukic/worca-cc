# Labels issues and pull requests by who opened them: from:team (write access or more),
# from:first-timer (first issue or PR here) or from:community. Bots get no label, and an
# item that already has a from:* label is left alone.
#
# Run it by hand ("Run workflow") to backfill existing open (or all) issues and PRs.
# Safe on pull_request_target: it checks out only this repository's base branch, for the
# labelling script, and never checks out or runs code from the pull request.
name: Label by author

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      state:
        description: Which issues and pull requests to backfill
        type: choice
        options: [open, all]
        default: open

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: label-by-author-${{ github.event.issue.number || github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/author-label.cjs`);
            await run({ github, context, core });
