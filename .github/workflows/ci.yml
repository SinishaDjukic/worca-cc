name: CI

# Until this file existed the repository had NO branch or pull-request CI at all:
# the only workflow (release-npm-app.yml) triggers on `push: tags` — so `npm test`
# gated a publish, never a merge. Tags are left to that workflow; this one gates
# every pull request and every push to dev.
#
# Pushes to other branches don't run: a branch with an open PR is covered by the
# pull_request run, and running both made the later cancel the earlier, which
# left the cancelled push run's checks red on the PR. A branch gets CI once it
# has a PR (a draft PR is enough).
#
# Docs-only changes skip CI, except the two docs paths a test reads:
# test/deck-kit-sync (docs/why-worca/) and test/ui-levels (docs/ui-levels.md).
# Later patterns win, so those are re-included after the docs exclusion.
# Safe while no status check is required on dev: a skipped workflow would
# otherwise leave a required check pending forever.
on:
  push:
    branches: [dev]
    paths:
      - "**"
      - "!docs/**"
      - "docs/why-worca/**"
      - "docs/ui-levels.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/why-worca/**"
      - "docs/ui-levels.md"

permissions:
  contents: read

# A new push to a PR (or to dev) cancels the run it supersedes. Group on the
# branch name — head_ref on pull_request, ref_name on push — plus the head repo,
# so a fork's same-named branch can't cancel ours.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # node --test --test-shard splits test/*.mjs deterministically by file;
    # each shard has its own runner, WORCA_HOME and real-claude guard log.
    name: npm test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # package.json engines: node >=22.13.0 — CI proves the floor.
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No build step: plain Node ESM plus a vanilla HTML/CSS/JS frontend.
      # The script points WORCA_HOME at ./.worca-cc-test and HOME/USERPROFILE at
      # a fresh temp dir (settings.json lives under HOME), so nothing touches a
      # real home directory, and no test may spawn a live `claude`.
      # No retry: the ENOTEMPTY teardown race this step used to re-run for was
      # a test waiting on a stale "newest row" and leaving its run alive
      # (test/api-run-auto, fixed), and every home/sandbox rm in the suite now
      # retries the rmdir itself (maxRetries, like test/helpers/temp-home.mjs).
      # A failure here is real on the first attempt.
      - name: Run tests
        env:
          WORCA_TEST_SHARD: ${{ matrix.shard }}/4
        run: npm test

  cdp:
    name: headless-Chrome UI proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Google Chrome preinstalled at /usr/bin/google-chrome,
      # which is on the scripts' own candidate list. Fail here with a legible
      # message rather than inside a CDP timeout if that ever stops being true.
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::no Google Chrome on the runner — set CHROME_BIN"
            exit 1
          fi
          echo "chrome: $CHROME ($("$CHROME" --version 2>/dev/null || echo 'version unavailable'))"

      # Each script mints its own WORCA_HOME, its own git project and its own
      # server on an ephemeral port, and runs the pipeline under WORCA_MOCK=1 —
      # nothing else has to be provisioned. --no-sandbox is required whenever
      # headless Chrome runs as root.
      - name: Headless-Chrome UI proofs
        env:
          CHROME_NO_SANDBOX: "1"
        run: npm run verify:composer && npm run verify:run-monitor && npm run verify:theme && npm run verify:memory && npm run verify:scripts && npm run verify:ask-forms && npm run verify:workspace-map && npm run verify:artifacts

  # The container image (docs/docker.md): build it from this checkout's
  # `npm pack` output — the same path the release takes — lint the Dockerfile,
  # run the offline mock smoke inside it (tools/docker-smoke.mjs), and scan
  # the OS layer. No real `claude`, no token, no spend. amd64 + slim only on
  # PRs; the -full variant and arm64 are exercised by the release workflow.
  # Runs alongside the tests rather than after them: it uses nothing they
  # produce, and gating it only added its ~1.5 min to every run's wall time.
  docker:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile

      - name: Pack @worca/app
        id: pack
        run: |
          mkdir -p docker/.pack
          npm pack --silent --pack-destination docker/.pack
          echo "tarball=$(ls docker/.pack/worca-app-*.tgz)" >> "$GITHUB_OUTPUT"
          echo "claude_code=$(cat docker/CLAUDE_CODE_VERSION)" >> "$GITHUB_OUTPUT"
          # UTC date: rebuilds the cached apt layer daily so new Debian security
          # fixes land (the layer text never changes, so the gha cache kept it forever).
          # Weekly was too slow: a fix published mid-week failed every PR's scan until Monday.
          echo "apt_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (slim, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ghcr.io/sinishadjukic/worca:ci
          build-args: |
            WORCA_TARBALL=${{ steps.pack.outputs.tarball }}
            CLAUDE_CODE_VERSION=${{ steps.pack.outputs.claude_code }}
            VARIANT=slim
            APT_REFRESH=${{ steps.pack.outputs.apt_refresh }}
          cache-from: type=gha,scope=ci-slim
          cache-to: type=gha,scope=ci-slim,mode=max

      - name: Mock-mode smoke inside the image
        run: npm run docker:smoke -- --image ghcr.io/sinishadjukic/worca:ci

      # Blocking: the Debian layer we ship. Node/npm library findings inside the
      # base image (e.g. node-tar under the bundled npm) are the node image's to
      # fix and arrive with the weekly rebuild's newer base, so they are reported
      # (next step) but do not fail the PR.
      - name: Scan OS layer
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sinishadjukic/worca:ci
          scan-type: image
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: docker/.trivyignore

      - name: Report library findings (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sinishadjukic/worca:ci
          scan-type: image
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
