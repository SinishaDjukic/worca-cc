name: CI

# Until this file existed the repository had NO branch or pull-request CI at all:
# the only workflow (release-npm-app.yml) triggers on `push: tags` — so `npm test`
# gated a publish, never a merge. Tags are left to that workflow; this one gates
# every pull request and every push to dev.
#
# Tests run in two tiers (test/tiers.json): fast on every run, slow on dev pushes
# and on PRs that touch what the slow tier exercises.
#
# Pushes to other branches don't run: a branch with an open PR is covered by the
# pull_request run, and running both made the later cancel the earlier, which
# left the cancelled push run's checks red on the PR. A branch gets CI once it
# has a PR (a draft PR is enough).
#
# Docs-only changes skip CI.
# Safe while no status check is required on dev: a skipped workflow would
# otherwise leave a required check pending forever.
on:
  push:
    branches: [dev]
    paths:
      - "**"
      - "!docs/**"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
  # On demand: the Kubernetes end-to-end job (k8s-smoke) runs only from here.
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to a PR (or to dev) cancels the run it supersedes. Group on the
# branch name — head_ref on pull_request, ref_name on push — plus the head repo,
# so a fork's same-named branch can't cancel ours.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Does a pull request touch what the slow tier (test/tiers.json "slow") exercises? A push
  # to dev always runs both tiers, so this job exists for pull requests only.
  # The slow-test entries below must equal test/tiers.json "slow", entry for entry; a test in
  # test/tools-test-runner.test.mjs fails when they drift.
  changes:
    name: changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The workflow-level `permissions: contents: read` drops every other scope; the filter
    # lists a pull request's files through the API and needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            helm:
              - 'deploy/helm/**'
              - 'test/helm-*'
              - 'test/fixtures/helm/**'
              - '.github/workflows/ci.yml'
            engine:
              - 'src/**'
              - 'ui/server.mjs'
              - 'ui/public/hljs-loader.mjs'
              - 'ui/public/diff-view.mjs'
              - 'agents/**'
              - 'skills/**'
              - 'scripts/**'
              - 'package.json'
              - 'npm-shrinkwrap.json'
              - 'test/helpers/**'
              - 'test/fixtures/**'
              - 'test/tiers.json'
              - 'tools/test*.mjs'
              - '.github/workflows/ci.yml'
              - 'test/orchestrator-*.test.mjs'
              - 'test/run-harness-*.test.mjs'
              - 'test/run-root-*.test.mjs'
              - 'test/stop-paused-harness.test.mjs'
              - 'test/folder-run.test.mjs'
              - 'test/folder-apply.test.mjs'
              - 'test/api-run-folder.test.mjs'
              - 'test/api-run-no-project.test.mjs'
              - 'test/seed-traces.test.mjs'
              - 'test/auto-recipes-offline.test.mjs'
              - 'test/presentation-golden-run.test.mjs'
              - 'test/graph-script-runner.test.mjs'
              - 'test/workspaces-api.test.mjs'
              - 'test/workspaces.test.mjs'
              - 'test/scan-api.test.mjs'
              - 'test/api-stop-paused.test.mjs'
              - 'test/api-schedules.test.mjs'
              - 'test/mcp-pipeline-run.test.mjs'
              - 'test/wsmap-order-overrides.test.mjs'
              - 'test/ask-workspace-card.test.mjs'
              - 'test/ask-worktrees.test.mjs'
              - 'test/workspace-map-api.test.mjs'
              - 'test/workspace-size.test.mjs'
              - 'test/workspace-scan-finalize-map.test.mjs'
              - 'test/git-sync.test.mjs'
              - 'test/metrics-sync.test.mjs'
              - 'test/memory-team-sync.test.mjs'
              - 'test/memory-team-lifecycle.test.mjs'
              - 'test/memory-team-seed.test.mjs'
              - 'test/metrics-prune.test.mjs'
              - 'test/policy-sync.test.mjs'
              - 'test/sync-api.test.mjs'
              - 'test/branches-api-fresh.test.mjs'
              - 'test/marketplace-publish-flow.test.mjs'
              - 'test/cli-interactive.test.mjs'
              - 'test/cli-schedule-wait.test.mjs'
              - 'test/cli-auto.test.mjs'
              - 'test/cli-resume.test.mjs'
              - 'test/wsmap-detectors-p3-registry.test.mjs'
              - 'test/wsmap-detectors-p4-registry.test.mjs'
              - 'test/wsmap-http-client-shapes-slow.test.mjs'
              - 'test/wsmap-graphql-client-copy-slow.test.mjs'
              - 'tools/parity/**'
              - 'test/parity-launch.test.mjs'
              - 'test/parity-routes.test.mjs'
              - 'test/split-by-feature.test.mjs'
              - 'tools/split-by-feature.mjs'
              - 'tools/split-by-feature/**'

  test-fast:
    # tools/test.mjs balances the shards by test/timings.json (longest first); each shard has
    # its own runner, WORCA_HOME and real-claude guard log. Every test file that
    # test/tiers.json does not list as slow.
    # The supported range, both ends and the middle: the exact floor (package.json engines and
    # MIN_NODE), .nvmrc's major (every other job, the release and the image run it) and the newest
    # LTS, so a difference between them (1.15.0-rc.1 failed on one) shows up on dev instead of on a
    # burned release tag. test/supply-chain.test.mjs keeps this list in step with both.
    name: fast tests (Node ${{ matrix.node }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', 24, 26]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No build step: plain Node ESM plus a vanilla HTML/CSS/JS frontend.
      # The script points WORCA_HOME at ./.worca-cc-test and HOME/USERPROFILE at
      # a fresh temp dir (settings.json lives under HOME), so nothing touches a
      # real home directory, and no test may spawn a live `claude`.
      # No retry: the ENOTEMPTY teardown race this step used to re-run for was
      # a test waiting on a stale "newest row" and leaving its run alive
      # (test/api-run-auto, fixed), and every home/sandbox rm in the suite now
      # retries the rmdir itself (maxRetries, like test/helpers/temp-home.mjs).
      # A failure here is real on the first attempt.
      - name: Run fast tests
        env:
          WORCA_TEST_SHARD: ${{ matrix.shard }}/4
        run: npm run test:fast -- --timings-out .test-timings/fast-${{ matrix.shard }}.json

      # This shard's per-file seconds, measured on the runner that ran it. test/timings.json is
      # refreshed from a green dev run's set (tools/test-timings-merge.mjs), so the shards are
      # balanced by what files cost here, not on a developer's machine. The .nvmrc version's set only:
      # one artifact per shard, and the versions' runners cost the same.
      - if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-fast-${{ matrix.shard }}
          path: .test-timings/
          include-hidden-files: true   # upload-artifact skips dot-paths by default and would upload nothing
          if-no-files-found: error
          retention-days: 14

  test-slow:
    # The engine-driving files in test/tiers.json "slow". Always on a push to dev; on a pull
    # request only when `changes` found a path they exercise.
    # `changes` is skipped outside pull requests, and a job whose `needs` was skipped is
    # skipped too unless its `if` calls a status function: hence !cancelled(), and `!= 'false'`
    # (not `== 'true'`) so a failed `changes` job runs the slow tier rather than skipping it.
    # The expression is wrapped in ${{ }} because a bare `if: !…` is a YAML tag, not a string.
    # Two shards, not three: the tier is ~3.5 min of tests in all (test/timings.json), so two
    # still finish well inside the fast tier's wall time, and a third runner only added its own
    # checkout + npm ci.
    name: slow tests (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.engine != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run slow tests
        env:
          WORCA_TEST_SHARD: ${{ matrix.shard }}/2
        run: npm run test:slow -- --timings-out .test-timings/slow-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-slow-${{ matrix.shard }}
          path: .test-timings/
          include-hidden-files: true   # upload-artifact skips dot-paths by default and would upload nothing
          if-no-files-found: error
          retention-days: 14

  cdp:
    # Two runners: the theme proof alone (~5.5 min, the long pole), and every other proof
    # together (~2.5 min in all on 2026-10-27). Three groups left two runners idle for most of
    # the theme proof's run. Each script mints its own WORCA_HOME, its own git project, an
    # ephemeral server port and its own CDP port (9333-9344 and 9351; chat-layout takes a free one),
    # distinct within each group. Across groups only theme and feature-page share one (9336), which
    # is safe while the groups run on separate runners (set CDP_PORT if they ever share a machine).
    name: headless-Chrome UI proofs (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: theme
            proofs: "verify:theme"
          - group: composer + run-monitor + the rest
            proofs: "verify:composer verify:run-monitor verify:feature-page verify:memory verify:scripts verify:ask-forms verify:workspace-map verify:flags verify:requirements verify:ticket-updates verify:chat-layout"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Google Chrome preinstalled at /usr/bin/google-chrome,
      # which is on the scripts' own candidate list. Fail here with a legible
      # message rather than inside a CDP timeout if that ever stops being true.
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::no Google Chrome on the runner — set CHROME_BIN"
            exit 1
          fi
          echo "chrome: $CHROME ($("$CHROME" --version 2>/dev/null || echo 'version unavailable'))"

      # Each script mints its own WORCA_HOME, its own git project and its own
      # server on an ephemeral port, and runs the pipeline under WORCA_MOCK=1 —
      # nothing else has to be provisioned. --no-sandbox is required whenever
      # headless Chrome runs as root. Every proof in the group runs even after one fails
      # (one group holds eleven), and the step fails at the end naming each failed proof.
      - name: Headless-Chrome UI proofs
        env:
          CHROME_NO_SANDBOX: "1"
          PROOFS: ${{ matrix.proofs }}
        run: |
          failed=
          for proof in $PROOFS; do
            echo "::group::npm run $proof"
            npm run "$proof" || failed="$failed $proof"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi

      # #919 parity harness (docs/parity-harness.md): routes, signed-out pass, flows and
      # visuals of this tree against itself. Timings are reported, not gated, on shared runners.
      - name: Parity (dev against itself)
        if: matrix.group != 'theme'
        env:
          CHROME_NO_SANDBOX: "1"
        run: npm run parity -- run --a tree:. --b tree:. --out "$RUNNER_TEMP/parity" --no-timing-gate

      - if: failure() && matrix.group != 'theme'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-cdp-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parity
          if-no-files-found: ignore

  # The browser extension (docs/browser-extension.md): build the three browser
  # targets and their store zips, lint the Firefox build and smoke it in Firefox.
  extension:
    name: Browser extension (build, zips, Firefox lint + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run ext:zip
      - run: npm run ext:lint:firefox
      - run: npm run e2e:firefox-smoke
        env: { CI: "true" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: worca-extension-zips, path: extension/dist/*.zip }

  # The Playwright E2E runs in the SAME image that renders the Linux baselines (e2e:extension:update-linux), so
  # fonts and fontconfig match and the 1% pixel tolerance holds (a bare ubuntu-latest runner with
  # `playwright install --with-deps` has a different font set — the fixture pages use UA default fonts). Firefox is
  # not in this image, which is why the Firefox steps stay in the job above.
  extension-e2e:
    name: Browser extension (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # == devDependencies["@playwright/test"], by tag and digest (pinned by a test; move both together on a bump).
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run e2e:extension
        env: { HOME: /root }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: extension-playwright-report, path: e2e/extension/playwright-report }

  # The container image (docs/docker.md): build it from this checkout's
  # `npm pack` output — the same path the release takes — lint the Dockerfile,
  # run the offline mock smoke inside it (tools/docker-smoke.mjs), and scan
  # the OS layer. No real `claude`, no token, no spend. amd64 + slim only on
  # PRs; the -full variant and arm64 are exercised by the release workflow.
  # Runs alongside the tests rather than after them: it uses nothing they
  # produce, and gating it only added its ~1.5 min to every run's wall time.
  docker:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile

      - name: Pack @worca/app
        id: pack
        run: |
          mkdir -p docker/.pack
          npm pack --silent --pack-destination docker/.pack
          echo "tarball=$(ls docker/.pack/worca-app-*.tgz)" >> "$GITHUB_OUTPUT"
          echo "claude_code=$(cat docker/CLAUDE_CODE_VERSION)" >> "$GITHUB_OUTPUT"
          # Debian's own publish stamps: rebuilds the cached apt layer exactly when
          # bookworm or bookworm-security changes, so new security fixes land (the
          # layer text never changes, so the gha cache kept it forever). A UTC-date
          # key was too coarse: a fix published at 17:39 UTC failed every PR's scan
          # until midnight because an earlier run had cached that day's layer.
          # Falls back to the UTC date when the mirrors are unreachable.
          apt_refresh=
          for d in debian-security/dists/bookworm-security debian/dists/bookworm; do
            rel=$(curl -fsSL --max-time 20 "https://deb.debian.org/$d/InRelease") \
              && stamp=$(grep -m1 '^Date:' <<<"$rel") \
              && apt_refresh+="$stamp;" \
              || { apt_refresh=$(date -u +%F); break; }
          done
          echo "apt_refresh=$apt_refresh" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (slim, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ghcr.io/sinishadjukic/worca:ci
          build-args: |
            WORCA_TARBALL=${{ steps.pack.outputs.tarball }}
            CLAUDE_CODE_VERSION=${{ steps.pack.outputs.claude_code }}
            VARIANT=slim
            APT_REFRESH=${{ steps.pack.outputs.apt_refresh }}
          cache-from: type=gha,scope=ci-slim
          cache-to: type=gha,scope=ci-slim,mode=max

      - name: Mock-mode smoke inside the image
        run: npm run docker:smoke -- --image ghcr.io/sinishadjukic/worca:ci

      # The worker image (docs/workers.md): the `worker` target with Claude Code only, slim,
      # amd64, loaded locally; then its contract (uid 1000, no sudo, exit 78 without an
      # assignment, `--check`, WORCA_NO_DB, SIGTERM). The other engines are built by the
      # release workflow.
      - name: Build worker image (claude, slim, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          load: true
          tags: ghcr.io/sinishadjukic/worca-worker:ci
          build-args: |
            WORCA_TARBALL=${{ steps.pack.outputs.tarball }}
            CLAUDE_CODE_VERSION=${{ steps.pack.outputs.claude_code }}
            VARIANT=slim
            ENGINE=claude
            APT_REFRESH=${{ steps.pack.outputs.apt_refresh }}
          cache-from: |
            type=gha,scope=ci-worker-claude
            type=gha,scope=ci-slim
          cache-to: type=gha,scope=ci-worker-claude,mode=max

      - name: Worker contract smoke + controller/worker end to end
        # Both images: the worker's contract, then the controller under WORCA_EXECUTOR=docker
        # running a mock script node on a worker container it starts and removes.
        run: node tools/docker-smoke.mjs --image ghcr.io/sinishadjukic/worca:ci --worker-image ghcr.io/sinishadjukic/worca-worker:ci

      # Blocking: the Debian layer we ship. Node/npm library findings inside the
      # base image (e.g. node-tar under the bundled npm) are the node image's to
      # fix and arrive with the weekly rebuild's newer base, so they are reported
      # (next step) but do not fail the PR.
      - name: Scan OS layer
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sinishadjukic/worca:ci
          scan-type: image
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: docker/.trivyignore

      - name: Report library findings (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/sinishadjukic/worca:ci
          scan-type: image
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

  # The Helm chart (deploy/helm/worca, docs/kubernetes.md): lint, render with the default and
  # the kind values, validate every rendered manifest against the Kubernetes schemas
  # (kubeconform, a pinned release checked by sha256), and the chart's own test
  # (test/helm-chart.test.mjs: contracts the executor backend relies on, golden files). Always
  # on a push to dev; on a pull request only when the chart, its test or its fixtures changed
  # (`changes` above). The same !cancelled() / != 'false' shape as the slow tier.
  # The controller/worker topology end to end on a kind cluster (tools/k8s-smoke.mjs): builds both
  # images, installs the chart with values-kind.yaml and runs a mock script node on a worker pod.
  # Ten-plus minutes, so on demand only (Actions -> CI -> Run workflow), not on every PR; the
  # chart itself is linted and rendered by the `helm` job on every change.
  k8s-smoke:
    name: Kubernetes end to end (kind)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: worca-smoke
      - run: npm ci --ignore-scripts
      - name: Build the images, install the chart, run a script node on a worker pod
        run: node tools/k8s-smoke.mjs --cluster worca-smoke

  helm:
    name: Helm chart
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.helm != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform kubeconform.tar.gz
          kubeconform -v

      - name: helm lint
        run: |
          helm lint deploy/helm/worca
          helm lint deploy/helm/worca -f deploy/helm/worca/values-kind.yaml

      - name: helm template + kubeconform
        run: |
          for values in "" deploy/helm/worca/values-kind.yaml test/fixtures/helm/values-full.yaml; do
            echo "::group::helm template ${values:-default}"
            helm template worca deploy/helm/worca --namespace worca ${values:+-f "$values"} \
              | kubeconform -strict -summary -ignore-missing-schemas -schema-location default
            echo "::endgroup::"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - run: npm ci

      - name: Chart test (contracts and golden files)
        run: node --test test/helm-chart.test.mjs
