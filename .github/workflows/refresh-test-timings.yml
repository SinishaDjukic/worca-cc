name: Refresh test timings

# Keeps test/timings.json (the weights tools/test.mjs balances the CI shards by) current with no manual step. Weekly,
# it takes the newest completed, green `dev` push run of ci.yml among the last 30 whose unexpired artifacts include every
# test-timings-* name ci.yml's test-fast and test-slow matrices upload (tools/timings-refresh.mjs pick), merges them with
# tools/test-timings-merge.mjs, and opens or updates the one "Refresh test timings" PR from the timings-refresh branch,
# rebuilt each run as dev HEAD plus one commit.
#
# The writes (push, PR create, edit and close) use a short-lived GitHub App token (docs/required-checks.md, "2. Set up
# the timings PR identity"): a PR opened or pushed with github.token starts no workflows, so its required checks would
# wait for a person. github.token only reads runs and artifacts here.
#
# No pull_request trigger: this workflow never gates a merge (test/ci-trigger-contract.test.mjs). When the merged
# timings equal dev's byte for byte, the run says so, closes an open refresh PR (its content is stale), pushes nothing
# and ends green.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-test-timings
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh test timings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the App secrets
        env:
          TIMINGS_APP_ID: ${{ secrets.TIMINGS_APP_ID }}
          TIMINGS_APP_PRIVATE_KEY: ${{ secrets.TIMINGS_APP_PRIVATE_KEY }}
        run: node tools/timings-refresh.mjs check-secrets

      - name: Pick the source run
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/timings-refresh.mjs pick --dir .test-timings/artifacts

      - name: Merge its timings
        run: |
          cp test/timings.json "$RUNNER_TEMP/before.json"
          node tools/test-timings-merge.mjs .test-timings/artifacts

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        # GitHub accepts the App ID as the token issuer in client-id, so the secret keeps holding the App ID.
        with:
          client-id: ${{ secrets.TIMINGS_APP_ID }}
          private-key: ${{ secrets.TIMINGS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Stop when the timings already match dev
        id: diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.pick.outputs.id }}
        # git diff --quiet exits 1 for a change and above 1 for a git error, which must fail the run, not read as a change.
        # The PR lookups keep same-repo PRs only: a fork can open a PR from a branch named timings-refresh too.
        run: |
          rc=0
          git diff --quiet -- test/timings.json || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::git diff failed with exit code $rc"; exit "$rc"; fi
          if [ "$rc" -eq 0 ]; then
            line="test/timings.json already matches ci.yml run $RUN_ID"
            echo "$line"
            pr="$(gh pr list --head timings-refresh --base dev --state open --json number,isCrossRepository -q '[.[] | select(.isCrossRepository | not)][0].number // empty')"
            if [ -n "$pr" ]; then gh pr close "$pr" --comment "$line"; fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the timings
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          RUN_ID: ${{ steps.pick.outputs.id }}
          RUN_URL: ${{ steps.pick.outputs.url }}
        run: |
          bot_id="$(gh api "users/$BOT" -q .id)"
          export GIT_AUTHOR_NAME="$BOT" GIT_COMMITTER_NAME="$BOT"
          export GIT_AUTHOR_EMAIL="$bot_id+$BOT@users.noreply.github.com" GIT_COMMITTER_EMAIL="$bot_id+$BOT@users.noreply.github.com"
          git add -- test/timings.json
          git commit -m "Refresh test timings from ci.yml run $RUN_ID" -m "$RUN_URL"

      - name: Push the timings-refresh branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          node tools/timings-refresh.mjs push

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node tools/timings-refresh.mjs body --source .test-timings/source-run.json --before "$RUNNER_TEMP/before.json" --after test/timings.json --out "$RUNNER_TEMP/pr-body.md"
          pr="$(gh pr list --head timings-refresh --base dev --state open --json number,isCrossRepository -q '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Refresh test timings" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base dev --head timings-refresh --title "Refresh test timings" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
