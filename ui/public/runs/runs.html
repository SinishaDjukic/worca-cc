e="Copy the visible log lines" aria-label="Copy the visible log lines"><span class="ic ico-copy" aria-hidden="true" style="width:14px;height:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg></span><span class="ic ico-check" aria-hidden="true" style="width:14px;height:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="ic ico-x" aria-hidden="true" style="width:14px;height:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"></path></svg></span></button></div><div class="switch-row"><div class="switch on autoscroll" role="switch" aria-checked="true" tabindex="0"></div><span class="txt">Auto-scroll</span></div></div>

                      <button type="button" role="menuitem" class="menu-item resume-on-saved"><b>Resume</b><small>Where it left off</small></button>
                      <button type="button" role="menuitem" class="menu-item resume-on-other" hidden><b>Resume on another engine</b><small></small></button>
                      <button type="button" role="menuitem" class="menu-item resume-with-model" hidden><b>Switch model…</b><small>Every remaining step runs on the model you pick</small></button>
                      <button type="button" role="menuitem" class="menu-item hd-resume-at-item"><b>Resume at…</b><small>Schedule the resume</small></button>
                    </div>
                  </div>
                  <!-- Pause and Stop act on the pipeline's live run, while this tab knows one (paintHdLive). -->
                  <button type="button" class="btn hd-pause" hidden>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg>
                    <span class="hd-btn-label">Pause</span>
                  </button>
                  <button type="button" class="btn btn-danger hd-stop" hidden>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                    <span class="hd-btn-label">Stop</span>
                  </button>
                  <!-- Opens the terminal pane in this page's folder (docs/terminal.md); app.js wires every .term-opener. -->
                  <button type="button" class="term-opener btn" aria-label="Open the terminal" aria-expanded="false" title="Terminal (Ctrl+`)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M7.5 9.5l3 2.5-3 2.5"></path><path d="M13 15h3.5"></path></svg>
                  </button>
                  <!-- Run 3 (D13), slice 2: the run page's one menu (openHistDetail binds it, runMoreItems lists it). -->
                  <button type="button" class="btn btn-quiet btn-icon hd-bar-more" aria-haspopup="menu" aria-expanded="false" title="More for this run" aria-label="More for this run">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
                  </button>
                  <!-- Slice 2: the ⋯'s run-scope actions. Never shown; runMoreItems lists the offered ones (their own `hidden` is the
                       offer) and clicks them, so every gate, the busy label and hdSetArchiveGate keep addressing these buttons. -->
                  <span class="run-menu-carriers" hidden>
                    <button type="button" class="btn hd-report" hidden><span class="hd-btn-label">Report this run</span></button>
                    <button type="button" class="btn hd-archive" hidden><span class="hd-btn-label">Archive</span></button>
                    <button type="button" class="btn hd-restore" hidden><span class="hd-btn-label">Restore</span></button>
                  </span>
                </span>

              <!-- The inline error sits under the shared bar so both modes show it (a load
                   failure, an archive failure); writers resolve it with screen.querySelector. -->
              <div class="hd-error" hidden></div>
              <section class="rd-glance hd-glance" aria-label="Run status">
                <div class="rd-now">
                  <header class="rd-page-head">
                    <div class="rd-title-row"><h1 class="rd-page-title" tabindex="-1"></h1></div>
                  </header>
                </div>
                <div class="rd-sheet">
                  <div class="rd-sheet-head">
                    <div class="rd-now-top run-status"></div>
                    <!-- Slice 3: the head buttons (run-head.mjs renderHeadButtons) around the PR control (paintPrCta keeps its one
                         node), at every level; the hidden feed is the PR status read (paintRdPrStatus) that repaints them. -->
                    <div class="rd-head-acts" hidden><div class="rd-pr-slot" data-needs-git hidden></div></div>
                    <span class="rd-pr-feed" hidden></span>
                  </div>
                  <!-- s2: where the work is (run-head.mjs renderRoute): the run's places in order, at every level. -->
                  <div class="rd-route" hidden></div>
                  <!-- Run 3 (D8): the facts block, one row per fact and one place to edit it. The Project row's value is the
                       old meta line (paintPageHead owns its first text node). -->
                  <dl class="rd-kv" aria-label="Run facts">
                    <div class="rd-kv-row" data-fact="project" hidden><dt class="rd-kv-k">Project</dt><dd class="rd-kv-v rd-page-meta"></dd></div>
                    <div class="rd-kv-row" data-fact="labels" hidden><dt class="rd-kv-k">Labels</dt><dd class="rd-kv-v"></dd></div>

                  <div class="hd-banners"></div>
                  <div class="rd-facts"></div>

                       check, and a jump to the first one to check (paintAwayAnswers). -->
                  <div class="rd-away-note" hidden><span class="rd-away-note-text"></span><button type="button" class="btn btn-sm rd-away-jump">See the answers</button></div>
                  <div class="rd-nowlist"></div>
                  <div class="rd-result hd-result"></div>

                <section class="rd-night-sec hd-night-sec" hidden><h3 class="rd-night-h">Answered for you<span class="rd-night-count"></span></h3><div class="rd-night-asks"></div></section>
              </section>
              <section class="rd-details hd-details" hidden aria-label="Run details">
              <header class="hd-header">
                <div class="hd-row1">
                  <h1 class="hd-title"></h1>
                  <span class="auto-badge" hidden></span>
                  <span class="hist-merge" hidden data-min-level="expert" data-needs-git></span>
                  <button type="button" class="btn btn-primary hd-pr" hidden data-min-level="advanced" data-needs-git>Create PR</button>
                  <!-- Publish branch (#618): push a finished run's branch without a PR. Painted by paintHdPublish. -->
                  <button type="button" class="hd-publish btn" hidden data-min-level="advanced" data-needs-git>Publish branch</button>
                  <span class="act-pill-slot"></span>
                  <a class="btn hd-pr-link" hidden data-min-level="advanced" data-needs-git target="_blank" rel="noopener"></a>
                  <button type="button" class="btn btn-primary hd-push" hidden data-min-level="advanced" data-needs-git></button>
                </div>
                <!-- "Published to <remote>/<branch>" (#618): its own line, so a long branch never squeezes the title. -->
                <p class="hd-published hint mono" hidden data-min-level="advanced" data-needs-git></p>
                <!-- Base conflicts (#620): the stored check of each branch against its base. Painted by paintHdBase. -->
                <div class="hd-base-check" data-needs-git hidden>
                  <ul class="hd-base-members"></ul>
                </div>
                <!-- Workspace runs: one line per member repo (View PR, open or merged / No changes).
                     Painted by paintHdPr; never shown for a single-project run. -->
                <ul class="hd-pr-repos" hidden data-min-level="advanced" data-needs-git aria-label="Pull requests per repository"></ul>
                <!-- Status pip leads the META line, not row 1: it reads as the icon

                <div class="hd-row2">

                    <svg class="sic sic-error" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6.5v7"></path><path d="M12 17.4h.01"></path></svg>
                  </span>
                  <div class="hd-meta"></div>
                </div>
                <div class="hd-row3">
                  <span class="hd-base mono" data-min-level="advanced" data-needs-git></span>
                  <button type="button" class="btn btn-sm btn-quiet mono copy-btn hd-branch-copy" hidden data-min-level="advanced" data-needs-git title="Copy branch name" aria-label="Copy branch name">

                  </button>
                  <span class="hd-spacer"></span>
                </div>
              </header>
              <div class="hd-body">
                <div class="hd-graph"><div class="run-flow-wrap"><div class="run-flow"></div></div></div>
                <div class="hd-tabs" role="tablist"></div>
                <div class="hd-sections"></div>
              </div>
              </section>
            </div>
          </template>
