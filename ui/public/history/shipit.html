    <!-- ===== "Create PR" confirm modal (History detail) ===== -->
    <!-- No z-index of its own: #confirm-modal.viewer-modal{z-index:60} (style.css:781)
         exists because #confirm-modal precedes #plugin-modal in the DOM, and this
         dialog never coexists with another overlay — the Escape guard and the
         double-open guard keep them mutually exclusive. -->
    <div id="shipit-modal" class="viewer-modal hidden" role="dialog" aria-modal="true" aria-label="Create PR">
      <div class="card shipit-card dlg">
        <div class="dlg-head">
          <h2 class="shipit-title">Create PR</h2>
        </div>
        <div class="dlg-body">
          <!-- Zone 2, Into: base remote and base branch on one row; with one remote only the branch (D5).
               `.shipit-remotes` is filled from GET /api/pr/remotes on open; hidden until the list arrives and stays
               hidden when it cannot be loaded (the server then applies its own defaults). The base-branch pick
               replaces the plain `.shipit-base` name once the choices are known; while it is hidden the POST omits
               baseBranch. -->
          <section class="shipit-zone shipit-into" aria-labelledby="shipit-into-label">
            <span class="shipit-zone-label" id="shipit-into-label">Into</span>
            <div class="shipit-into-row" data-cols="1">
              <div class="shipit-remotes" hidden>
                <div class="select-wrap shipit-base-remote-field" hidden>
                  <select id="shipit-base-remote" class="select shipit-base-remote" aria-label="Base repository"></select>
                </div>
                <div class="shipit-push-field" hidden>
                  <label for="shipit-push-remote">Push remote</label>
                  <div class="select-wrap">
                    <select id="shipit-push-remote" class="select shipit-push-remote" aria-label="Push remote"></select>
                  </div>
                </div>
              </div>
              <span class="shipit-base mono"></span>
              <span class="select-wrap shipit-base-wrap" hidden>
                <select id="shipit-base-branch" class="select shipit-base-branch" aria-label="Base branch"></select>
              </span>
            </div>
            <small class="shipit-remotes-hint hint"></small>
            <!-- Sync before run (#527): the base moved on the remote since this run started. -->
            <small class="hint warn" id="shipit-base-warn" hidden></small>
            <!-- Base conflicts (#620): the stored local check while no PR exists. Painted by paintShipItBaseCheck. -->
            <small class="hint shipit-basecheck" hidden></small>
          </section>
          <!-- One ship flow (slice 2): a feature's or a chain's PRs, One or N stacked, with the suggestion under it.
               Painted by ship-group-dialog.mjs; hidden for a single run and a workspace run. -->
          <section class="shipit-zone shipit-prs" aria-labelledby="shipit-prs-label" hidden>
            <span class="shipit-zone-label" id="shipit-prs-label">Pull requests</span>
            <div class="shipit-prs-opts" role="radiogroup" aria-labelledby="shipit-prs-label" aria-describedby="shipit-prs-hint">
              <label class="opt-row"><input type="radio" name="shipit-prs" value="one" aria-describedby="shipit-prs-one-why" /><span>One</span></label>
              <label class="opt-row"><input type="radio" name="shipit-prs" value="stacked" /><span class="shipit-prs-stacked-label">2 stacked</span></label>
            </div>
            <small class="hint shipit-prs-one-why" id="shipit-prs-one-why" hidden></small>
            <small class="hint shipit-prs-hint" id="shipit-prs-hint" hidden></small>
          </section>
          <!-- Workspace runs: one row per affected member repo (tick box, branch → base,
               push/base remotes, per-repo status). Built by openShipItWsModal. -->
          <div id="shipit-repos" class="shipit-repos" hidden></div>
          <!-- Zone 3, the PR itself: title, description (Write / Preview / Generate), Draft. The description is
               optional and reset to empty on every open; empty = the PR body is the title, as before. Its own error
               line keeps a failed draft off "Not shipped". Draft is opt-in per PR (off on every open); the
               "Will close" line names the run's GitHub issue source (GET /api/pr/remotes `issue`). -->
          <section class="shipit-zone shipit-desc" aria-labelledby="shipit-pr-label">
            <span class="shipit-zone-label" id="shipit-pr-label">Title and description</span>
            <input id="shipit-title-input" class="input shipit-title-input" type="text" maxlength="256" aria-label="PR title" />
            <div class="shipit-desc-head">
              <div class="md-tabs tabs" role="tablist" aria-label="Description editor">
                <button type="button" class="md-tab tab shipit-desc-tab" role="tab" data-mode="text" aria-selected="true">Write</button>
                <button type="button" class="md-tab tab shipit-desc-tab" role="tab" data-mode="preview" aria-selected="false">Preview</button>
              </div>
              <button type="button" class="shipit-generate-stop btn btn-sm" hidden>Stop</button>
              <button type="button" class="shipit-generate btn btn-sm btn-quiet">Generate</button>
            </div>
            <!-- The editor and its preview share one box so the Generate veil can lie over whichever is showing: a
                 shimmer sweep that also swallows clicks while the textarea is read-only. `.is-generating` +
                 aria-busy toggle it (setShipItGenerating); the veil itself is decoration. -->
            <div class="shipit-desc-field" aria-busy="false">
              <textarea id="shipit-desc-input" class="shipit-desc-input textarea" rows="5" aria-label="Description" placeholder="Describe this change, or use Generate"></textarea>
              <div class="shipit-desc-preview md-preview viewer" hidden></div>
              <div class="shipit-desc-busy" aria-hidden="true"><span class="shipit-desc-busy-label">Drafting with AI…</span></div>
            </div>
            <div class="shipit-desc-err hint err" hidden></div>
            <div class="shipit-draft">
              <label class="switch-row" for="shipit-draft-input"><input id="shipit-draft-input" class="sw-input shipit-draft-input" type="checkbox" role="switch" /><span class="switch" aria-hidden="true"></span><span class="switch-label">Draft</span></label>
              <small class="shipit-closes hint" hidden></small>
            </div>
          </section>
          <!-- The per-run note stands in for the hidden Title and description zone (ship-group-dialog.mjs). -->
          <p class="shipit-slice-note" hidden></p>
          <!-- Zone 4, After it opens: Watch PR (starts from the project's Watch new pull requests setting, s4), and
               the Shaper s4 release row (shape/release-row.mjs), collapsed on every open; the workspace dialog hides
               it. No data-min-level: the controls show wherever the modal does (docs/ui-levels.md, History). -->
          <section class="shipit-zone shipit-after" aria-labelledby="shipit-after-label">
            <span class="shipit-zone-label" id="shipit-after-label">After it opens</span>
            <label class="switch-row" for="shipit-watch-input"><input id="shipit-watch-input" class="sw-input shipit-watch-input" type="checkbox" role="switch" aria-describedby="shipit-watch-help" /><span class="switch" aria-hidden="true"></span><span class="switch-label">Watch PR</span></label>
            <small id="shipit-watch-help" class="hint shipit-watch-help">Follows checks and reviews</small>
            <div class="shipit-release" aria-label="Release"></div>
          </section>
          <div class="shipit-try" hidden data-min-level="advanced" aria-label="Try it first"></div>
        </div>
        <div class="dlg-foot">
          <div class="shipit-actions" data-card-actions>
            <button type="button" class="btn shipit-try-btn" hidden data-min-level="advanced">Try it first</button>
            <button type="button" class="shipit-cancel btn">Cancel</button>
            <button type="button" class="btn btn-primary shipit-ok">Create PR</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Publish branch modal (History detail, #618) ===== -->
    <!-- One row per repo whose branch is here (a workspace run: per member, each with a tick);
         the push remote is the Ship-it dialog's default (GET /api/pr/remotes). No PR opens. -->
    <div id="publish-modal" class="viewer-modal hidden" role="dialog" aria-modal="true" aria-label="Publish branch">
      <div class="card publish-card dlg">
        <div class="dlg-head">
          <h2>Publish branch</h2>
          <p class="publish-sub hint">Pushes the branch so it can be pulled and tested.<br>No PR is created.</p>
        </div>
        <div class="dlg-body">
          <div class="publish-repos"></div>
        </div>
        <div class="dlg-foot">
          <div class="publish-actions" data-card-actions>
            <button type="button" class="publish-cancel btn">Cancel</button>
            <button type="button" class="publish-ok btn btn-primary">Publish</button>
          </div>
        </div>
      </div>
    </div>
