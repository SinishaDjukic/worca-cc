    <!-- ===== Export workflow → Claude Code skill modal ===== -->
    <div id="export-modal" class="viewer-modal hidden" role="dialog" aria-modal="true" aria-labelledby="export-title">
      <div class="card dlg">
        <div class="dlg-head">
          <div class="card-head">
            <h2 id="export-title">Export pipeline</h2>
          </div>
          <p id="export-subtitle" class="confirm-message"></p>
        </div>
        <div class="dlg-body">
          <!-- The form; swapped for #export-done after a successful export. -->
          <div id="export-form">
          <!-- ONE Export… entry point per row; the dialog asks for the format first.
               json = the saved graph as a file another Worca user imports (#421);
               skill = a runnable Claude Code skill under .claude/ (#403);
               plugin = a Worca plugin folder bundling agents + skills (#421). -->
          <div class="export-field">
            <span class="export-label">Format</span>
            <div id="export-format" class="seg" role="group" aria-label="Export format">
              <button type="button" class="seg-btn on" data-format="json">JSON file</button>
              <button type="button" class="seg-btn" data-format="skill" data-min-level="expert">Claude Code skill</button>
              <button type="button" class="seg-btn" data-format="plugin" data-min-level="expert">Worca plugin</button>
            </div>
            <span id="export-format-hint" class="hint"></span>
          </div>
          <div id="export-dest-field" class="export-field hidden">
            <span class="export-label">Location</span>
            <div id="export-dest" class="seg" role="group" aria-label="Skill location">
              <button type="button" class="seg-btn on" data-dest="global">Global (~/.claude)</button>
              <button type="button" class="seg-btn" data-dest="project">Project folder</button>
            </div>
          </div>
          <!-- Worca plugin destination (#717): a local folder (as before) or a registered marketplace,
               which gets ONE pull request on worca/plugin/<name>; nothing is pushed to its own branch. -->
          <div id="export-plugin-dest-field" class="export-field hidden">
            <span class="export-label">Destination</span>
            <div id="export-plugin-dest" class="seg" role="group" aria-label="Plugin destination">
              <button type="button" class="seg-btn on" data-pdest="folder">Local folder</button>
              <button type="button" class="seg-btn" data-pdest="marketplace" data-needs-git>Marketplace</button>
            </div>
          </div>
          <div id="export-marketplace-field" class="export-field hidden" data-needs-git>
            <label class="export-label" for="export-marketplace">Marketplace</label>
            <span class="select-wrap"><select id="export-marketplace" class="select" aria-label="Marketplace"></select></span>
            <span class="hint">The pull request targets the branch the marketplace tracks, else its default branch. Without push access it comes from your fork.</span>
            <!-- Only when no marketplace can take a pull request: the registered ones that were left out, with why. -->
            <span id="export-marketplace-skipped" class="hint hidden"></span>
            <!-- Draft is opt-in per export (unchecked on every open), like Create PR (#597). -->
            <label class="switch-row" for="export-draft"><input id="export-draft" class="sw-input" type="checkbox" role="switch" /><span class="switch" aria-hidden="true"></span><span class="switch-label">Open as draft</span></label>
          </div>
          <div id="export-folder-field" class="export-field hidden">
            <span class="export-label" id="export-folder-label">Folder</span>
            <div class="export-folder-row">
              <input type="text" id="export-folder" class="input" placeholder="/path/to/repo" />
              <button type="button" id="export-browse" class="btn btn-sm">Browse…</button>
            </div>
          </div>
          <div id="export-plugin-field" class="export-field hidden">
            <span class="export-label">Plugin name</span>
            <input type="text" id="export-plugin-name" class="input" placeholder="(defaults to the folder name)" />
            <!-- Live: what the manifest will actually be called — kebab-case, derived
                 from the typed name or, when blank, from the folder's basename. -->
            <span id="export-plugin-name-preview" class="hint"></span>
            <!-- Re-export only: a changed export into an existing plugin folder bumps
                 the manifest's patch version (0.1.0 → 0.1.1) so the recipient's
                 `worca plugin update` sees it. A first export is always 0.1.0. -->
            <label class="switch-row" id="export-keep-version-row">
              <input type="checkbox" id="export-keep-version" class="sw-input" role="switch" />
              <span class="switch" aria-hidden="true"></span>
              <span class="switch-label">Don't bump the plugin version when updating an existing plugin folder<br><span class="hint">A changed re-export normally goes 0.1.0 → 0.1.1 so recipients see an update. A first export is always 0.1.0.</span></span>
            </label>
          </div>
          <div class="export-field" id="export-slug-field">
            <span class="export-label">Slug</span>
            <input type="text" id="export-slug" class="input" placeholder="(defaults to the workflow name)" />
            <span id="export-slug-preview" class="hint"></span>
          </div>
          <label class="switch-row" id="export-agents-field">
            <input type="checkbox" id="export-include-agents" class="sw-input" role="switch" checked />
            <span class="switch" aria-hidden="true"></span>
            <span class="switch-label">Include referenced agents (recommended)</span>
          </label>
          <div id="export-plan" class="export-plan hidden"></div>
          <p id="export-msg" class="confirm-message"></p>
          </div>
          <!-- Result view: what was written, where, and the next step for the format.
               Replaces the form (not a second dialog) once an export succeeded. -->
          <div id="export-done" class="export-done hidden" role="status" aria-live="polite">
            <div class="export-done-head">
              <span class="export-done-check" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
              <b id="export-done-title"></b>
            </div>
            <dl id="export-done-lines" class="export-done-lines"></dl>
            <p id="export-done-next" class="export-done-next"></p>
          </div>
        </div>
        <div class="dlg-foot">
          <div class="confirm-actions">
            <button type="button" id="export-cancel" class="btn">Cancel</button>
            <!-- Preview = dry run (optional). Export runs the dry run itself and writes
                 unless it hits a conflict, which it then shows for per-file resolution. -->
            <button type="button" id="export-plan-btn" class="btn">Preview</button>
            <button type="button" id="export-apply-btn" class="btn btn-primary">Export</button>
            <button type="button" id="export-done-close" class="btn btn-primary hidden">Done</button>
          </div>
        </div>
      </div>
    </div>
