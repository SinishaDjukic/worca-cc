        <!-- ===== VIEW: STATISTICS ===== -->
        <section class="view hidden" data-view="schedules">
          <div class="topbar">
            <div>
              <div class="sub" id="schedules-sub">Runs that start later, once or on a repeat</div>
            </div>
            <a class="btn btn-primary" href="#new/schedule" id="schedules-new" style="text-decoration:none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>

          </div>
