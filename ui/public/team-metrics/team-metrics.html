        <!-- ===== VIEW: TEAM METRICS ===== -->
        <section class="view hidden" data-view="team-metrics">
          <div class="topbar">
            <div>
              <div class="sub">Shared across the team from the <code>worca-metrics</code> branch · costs are Claude Code estimates, not billing</div>
            </div>
            <div class="sync-chip" id="tm-sync" hidden></div>
          </div>
          <div class="tm-filter">
            <div class="select-wrap tm-scope-wrap"><select id="tm-scope" class="select" aria-label="Scope"></select></div>
            <div class="tabs tm-tabs" id="tm-tabs" role="tablist" aria-label="Team metrics view">
              <button type="button" class="tab on" role="tab" data-tm-tab="overview" aria-selected="true">Overview</button>
              <button type="button" class="tab" role="tab" data-tm-tab="timeline" aria-selected="false">Timeline</button>

              <button type="button" data-range="quarter">Quarter</button>
              <button type="button" data-range="year">Year</button>
              <button type="button" data-range="all">All time</button>

          <div class="tm-active-filters" id="tm-filters" hidden></div>
          <div id="tm-body"><small class="hint">Loading…</small></div>

        </section>
