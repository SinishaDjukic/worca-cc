        <!-- ===== VIEW: WORKSPACES ===== -->
        <section class="view hidden" data-view="workspaces">
          <!-- Two-screen slide track, twin of the Projects #proj-shell: the list and the workspace
               page (#workspaces/<id>[/team]) are sibling screens; .detail-open slides. -->
          <div class="ws-shell" id="ws-shell">
            <div class="ws-screen ws-screen-list">
              <div class="topbar">
                <div>
                  <div class="sub">Named sets of 2+ projects with an AI-generated interconnection description. Open one for its projects, description and team setup.</div>
                </div>
                <div class="ws-top-actions">
                  <button type="button" id="ws-howto-btn" class="btn btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"></path><path d="M12 17.2h.01"></path></svg>
                    How workspaces work
                  </button>
                  <button type="button" id="ws-create-btn" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                    Create workspace
                  </button>
                </div>
              </div>
              <p id="ws-msg" class="form-msg" aria-live="polite"></p>
              <div class="run-list" id="ws-list"></div>
            </div>
            <div class="ws-screen ws-screen-detail" id="ws-detail" aria-hidden="true"></div>
          </div>

          <!-- clone target for the workspace page (#workspaces/<id>). A SCREEN inside this
               section, never a routed view of its own: the page's view count is pinned. It rides
               the project page's pd- classes so the two pages are laid out the same way. -->
          <template id="ws-detail-tpl">
            <div class="pd wd">
              <header class="pd-header">
                <div class="pd-row1">
                  <button type="button" class="pd-back btn" aria-label="Back to workspaces">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    Back
                  </button>
                  <h1 class="pd-title ws-name"></h1>
                  <span class="ws-stale badge red" hidden>missing projects</span>
                </div>
                <!-- One row under the title: the summary on the left, the actions on the right. This
                     page configures and tracks a workspace; runs start from New run. -->
                <div class="wd-row2">
                <div class="pd-meta"><small class="ws-projects"></small></div>
                <div class="pd-actions">
                  <button type="button" class="ws-rescan btn" title="Re-scan the project set and regenerate the description">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>
                    Re-scan
                  </button>
                  <button type="button" class="ws-scan-model btn" title="View or change the model this workspace re-scans with (also opened when a re-scan needs a model)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
                    <span class="ws-scan-model-label"></span>
                  </button>
                  <span class="pd-spacer"></span>
                  <button type="button" class="btn btn-danger pd-remove ws-delete">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6"></path></svg>
                    <span class="pd-btn-label">Delete</span>
                  </button>
                </div>
                </div>
                <!-- On the HEADER (like .pd-error): a delete failure must not sit below a long tab. -->
                <div class="pd-error" hidden></div>
              </header>
              <div class="pd-body">
                <div class="pd-tabs" role="tablist"></div>
                <div class="pd-sections"></div>
              </div>
            </div>
          </template>
        </section>
        <!-- /view workspaces -->
