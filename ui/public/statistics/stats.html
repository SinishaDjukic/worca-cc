        <section class="view hidden" data-view="stats">
          <div class="topbar">
            <div>
              <div class="sub">Spend, time worked, and outcomes across all pipelines · costs are Claude Code estimates, not billing</div>
            </div>
          </div>
          <div class="stats-filter">
            <div class="seg" id="stats-range" role="group" aria-label="Time range">
              <button type="button" data-range="today">Today</button>
              <button type="button" data-range="week">This week</button>
              <button type="button" data-range="month">This month</button>
              <button type="button" data-range="lastMonth">Last month</button>
              <button type="button" data-range="all">All time</button>
              <button type="button" data-range="custom">Custom</button>
            </div>
            <span class="stats-custom" id="stats-custom" hidden>
              <input type="date" class="input" id="stats-from" aria-label="From">
              <span aria-hidden="true">–</span>
              <input type="date" class="input" id="stats-to" aria-label="To">
              <small class="hint err" id="stats-custom-err" hidden>The end date is before the start date.</small>
            </span>
          </div>
          <div class="stats-filter stats-scope">
            <span class="stats-tags" id="stats-tags"></span>
            <div class="select-wrap"><select id="stats-person" class="select" aria-label="Filter by person"><option value="">Everyone</option></select></div>
            <div class="seg seg-sm" id="stats-view" role="group" aria-label="View">
              <button type="button" data-stats-view="overview" class="on" aria-pressed="true">Overview</button>
              <button type="button" data-stats-view="person" aria-pressed="false">By person</button>
              <button type="button" data-stats-view="cost" aria-pressed="false">Cost</button>
            </div>
            <small class="hint" id="stats-filter-note" hidden>Filtered: Chat spend is not included.</small>
          </div>
          <div id="stats-body"><small class="hint">Loading…</small></div>
          <div id="stats-tip" class="chart-tip" hidden></div>
          <a class="hint tm-stats-hint" id="stats-tm-hint" href="#team-metrics" data-min-level="expert" hidden>Team-wide view →</a>
        </section>
