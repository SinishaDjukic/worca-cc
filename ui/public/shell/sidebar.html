<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Worca</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- Feature flags (docs/feature-flags.md): the server fills this with one rule per flag that is off. -->
    <style id="flag-gates"></style>
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/assets/worca-favicon.png" />
  </head>
  <body>
    <div class="app">
      <div class="nav-scrim" id="nav-scrim" hidden></div>
      <!-- ===================== Sidebar ===================== -->
      <aside class="sidebar" id="side-rail">
        <div class="brand">
          <!-- The wordmark (and the rail's mark) go to Chat's home — a new chat (worca Chat U5); app.js swaps
               #chat/new for #chat. -->
          <a class="logo" href="#chat/new" aria-label="worca: Chat" title="Chat"></a>
          <a class="logo-mark" href="#chat/new" aria-label="worca: Chat" title="Chat"></a>
          <!-- The server's mock mode (WS hello serverMock, app.js#applyServerMock): every run is a mock. -->
          <span class="badge amber side-mock-pill" id="side-mock-pill" title="Server started with WORCA_MOCK=1, so all runs are mock." hidden>MOCK</span>
          <button type="button" class="btn btn-quiet btn-icon side-close" id="side-close" aria-label="Close menu" title="Close menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>

        <!-- The one scrolling band: the logo row above and .side-foot below stay put. -->
        <div class="side-scroll" id="side-scroll">
          <nav class="nav" aria-label="Primary">
            <!-- Chat (worca Chat): the app's home, Ask Worca as a page. The dot (a .nav-count, so the rail parks it in
                 the square's corner): a reply in the chat you left finished while you were on another page
                 (app.js#paintChatUnread). -->
            <button type="button" data-nav="chat" data-min-level="simple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5H4.5A2.5 2.5 0 0 0 2 7.5v8A2.5 2.5 0 0 0 4.5 18H6v2.2c0 .9 1.1 1.3 1.7.6L10.5 18h6A2.5 2.5 0 0 0 19 15.5v-3"></path><path d="M18 2.2Q18.8 5.2 21.8 6Q18.8 6.8 18 9.8Q17.2 6.8 14.2 6Q17.2 5.2 18 2.2z"></path></svg>
              <span>Chat</span>
              <span class="nav-count nav-dot" id="nav-chat-unread" aria-hidden="true" hidden></span>
            </button>
            <button type="button" data-nav="runs" data-min-level="simple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path><path d="M12 8v4l3 2"></path></svg>
              <span>Runs</span>
              <!-- One badge (D11): the amber Needs-you pill while anything needs you, else the live
                   count as a plain grey number. A zero is hidden (app.js#updateNavCounts). -->
              <span class="nav-count n-amber" id="nav-needs-count" hidden>0</span>
              <span class="nav-count n-grey" id="nav-running-count" hidden>0</span>
            </button>
            <button type="button" data-nav="schedules" data-min-level="advanced">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><path d="M12 13.2v2.6l1.8 1.1"></path></svg>
              <span>Schedules</span>
              <!-- Waiting runs + active repeating schedules (a grey number: waiting is the resting
                   state); the amber pill counts UNREAD PROBLEMS in the activity feed. A zero is hidden. -->
              <span class="nav-count n-grey" id="nav-schedules-count" hidden>0</span>
              <span class="nav-count n-amber" id="nav-schedules-unread" hidden title="Scheduled runs that need a look">0</span>
            </button>
            <button type="button" data-nav="stats" data-min-level="advanced">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20v-7M12 20V4M19 20v-11"></path></svg>
              <span>Statistics</span>
            </button>
            <button type="button" data-nav="team-metrics" data-min-level="expert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"></path><path d="M6 15l4-5 4 3 4-6"></path><circle cx="6" cy="15" r="1.2"></circle><circle cx="10" cy="10" r="1.2"></circle><circle cx="14" cy="13" r="1.2"></circle><circle cx="18" cy="7" r="1.2"></circle></svg>
              <span>Team metrics</span>
            </button>

            <div class="nav-sect" data-min-level="simple">Build</div>
            <button type="button" data-nav="workflows" data-min-level="simple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="6" height="6" rx="1.6"></rect><rect x="15" y="4" width="6" height="5.5" rx="1.6"></rect><rect x="15" y="14.5" width="6" height="5.5" rx="1.6"></rect><path d="M9 12h2.5M11.5 12V6.8H15M11.5 12v5.3H15"></path></svg>
              <span>Workflows</span>
            </button>
            <button type="button" data-nav="requirements" data-min-level="simple" data-flag="requirements" data-flag-chip>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l3 3v13H5V4h3"></path><path d="M9 11h6M9 15h4"></path><path d="M9 4v2h6V4"></path></svg>
              <span>Requirements</span>
            </button>

            <!-- Add-ons: four Settings tabs that became pages of their own (Plugins → Marketplace,
                 Sets → Connectors, Models, Providers). Old #settings/<tab> addresses land here
                 (app.js MOVED_ROUTES). -->
            <div class="nav-sect" data-min-level="advanced">Add-ons</div>
            <button type="button" data-nav="marketplace" data-min-level="advanced">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2L5 8z"></path><path d="M9 10V6.5a3 3 0 0 1 6 0V10"></path></svg>
              <span>Marketplace</span>
            </button>
            <button type="button" data-nav="connectors" data-min-level="advanced">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5"></path><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"></path><path d="M12 17v4"></path></svg>
              <span>Connectors</span>
            </button>
            <button type="button" data-nav="models" data-min-level="expert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path><path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path></svg>
              <span>Models</span>
            </button>
            <button type="button" data-nav="providers" data-min-level="expert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6.5" rx="2"></rect><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"></rect><path d="M7.5 7.25h.01M7.5 16.75h.01"></path></svg>
              <span>Providers</span>
            </button>

            <div class="nav-sect">Manage</div>
            <button type="button" data-nav="projects" data-min-level="simple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2H19.5A1.5 1.5 0 0 1 21 9.7v8.3A1.5 1.5 0 0 1 19.5 19.5h-15A1.5 1.5 0 0 1 3 18z"></path></svg>
              <span>Projects</span>
            </button>
            <button type="button" data-nav="workspaces" data-min-level="advanced">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><path d="M14 17.5h7M17.5 14v7"></path></svg>
              <span>Workspaces</span>
            </button>
            <button type="button" data-nav="team-policy" data-min-level="expert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 7.6-8 9-4.6-1.4-8-4.5-8-9V6l8-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
              <span>Team policy</span>
            </button>
          </nav>
        </div>

        <div class="side-foot" id="side-foot">
          <!-- Running actions (issue #529): its own mount, just above the account corner.
               Not level-gated: it shows only while a service runs, and it must stay stoppable. The column
               shows the rows (app.js#paintRunningActions); the rail shows one tile (a green dot and the
               count) that opens the same rows, Stop included, in a side flyout. -->
          <div id="side-actions" class="side-actions" role="group" hidden aria-label="Running actions">
            <div class="side-actions-rows" id="side-actions-rows"></div>
            <button type="button" class="act-tile" id="side-actions-tile" aria-haspopup="menu" aria-expanded="false" aria-controls="side-actions-fly"><span class="pdot" aria-hidden="true"></span><span class="act-tile-n">0</span></button>
            <div class="menu nav-fly act-fly" id="side-actions-fly" role="menu" aria-label="Running actions" hidden>
              <div class="nav-fly-k" aria-hidden="true">Running actions</div>
              <div class="act-fly-rows" id="side-actions-fly-rows"></div>
            </div>
          </div>
          <!-- Update available (issue #841): shown only while GET /api/app/version says outdated.
               Opens Settings › General › About; no toast, no modal. Updating is a click on that card, never from here. -->
          <a class="side-update" id="side-update" href="#settings" hidden
             aria-label="Update available" title="Update available"><span class="side-update-dot" aria-hidden="true"></span><span class="side-update-label">Update available</span></a>
          <!-- The account corner (account-menu.mjs): who is looking (GET /api/whoami), the spend ring
               (paintBudget) and the away dot. It opens #acct-menu: spend, interface mode, Settings,
               the Away and Keep awake switches and appearance. -->
          <button type="button" class="acct" id="side-acct" data-min-level="simple" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-menu"
                  aria-label="Profile: spend, away mode, interface mode and settings" title="Profile: spend, away mode, interface mode and settings">
            <span class="acct-ring-wrap">
              <svg class="acct-ring" viewBox="0 0 38 38" aria-hidden="true"><circle class="trk" cx="19" cy="19" r="17.5"></circle><circle class="arc" cx="19" cy="19" r="17.5" stroke-dasharray="0.00 109.96"></circle></svg>
              <span class="acct-ava" aria-hidden="true">P</span>
              <i class="acct-dot" aria-hidden="true"></i>
            </span>
            <span class="acct-name">Profile</span>
            <svg class="acct-updown" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9.5l4-4 4 4M8 14.5l4 4 4-4"></path></svg>
          </button>
        </div>
        <!-- The account menu (opens upward from the corner) and its Interface mode side menu:
             position:fixed popups that side-flyout.mjs places and closes. The spend card and the
             identity card are painted by app.js; the side menu by ui-level.mjs. -->
        <div class="menu nav-fly acct-menu" id="acct-menu" role="menu" aria-label="Account" data-min-level="simple" hidden>
          <div class="acct-spend" id="acct-spend" hidden></div>
          <div class="mcard id-card" id="acct-id" role="group" aria-labelledby="acct-id-k" hidden>
            <span class="mc-k" id="acct-id-k">Signed in as</span>
            <b class="id-name"></b>
            <small class="id-via"></small>
          </div>
          <div class="msect" role="group">
            <button type="button" class="mi menu-item" id="acct-team-setup" role="menuitem" data-min-level="simple" hidden>
              <span class="mi-ic" aria-hidden="true">●</span><span class="mi-lbl">Your team updated the recommended setup</span><span class="mi-val">Review</span>
            </button>
            <button type="button" class="mi menu-item" id="acct-lvl" role="menuitem" data-min-level="simple" aria-haspopup="menu" aria-expanded="false" aria-controls="lvl-menu">
              <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9"></path><circle cx="15" cy="7.5" r="2"></circle><circle cx="9" cy="16.5" r="2"></circle></svg>
              <span class="mi-lbl">Interface mode</span><span class="mi-val">Expert</span>
              <svg class="mi-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <button type="button" class="mi menu-item" id="acct-settings" role="menuitem" data-nav="settings" data-min-level="simple">
              <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.06 3.93L10.39 1.22A10.9 10.9 0 0 1 13.61 1.22L13.94 3.93A8.3 8.3 0 0 1 16.34 4.92L18.48 3.24A10.9 10.9 0 0 1 20.76 5.52L19.08 7.66A8.3 8.3 0 0 1 20.07 10.06L22.78 10.39A10.9 10.9 0 0 1 22.78 13.61L20.07 13.94A8.3 8.3 0 0 1 19.08 16.34L20.76 18.48A10.9 10.9 0 0 1 18.48 20.76L16.34 19.08A8.3 8.3 0 0 1 13.94 20.07L13.61 22.78A10.9 10.9 0 0 1 10.39 22.78L10.06 20.07A8.3 8.3 0 0 1 7.66 19.08L5.52 20.76A10.9 10.9 0 0 1 3.24 18.48L4.92 16.34A8.3 8.3 0 0 1 3.93 13.94L1.22 13.61A10.9 10.9 0 0 1 1.22 10.39L3.93 10.06A8.3 8.3 0 0 1 4.92 7.66L3.24 5.52A10.9 10.9 0 0 1 5.52 3.24L7.66 4.92A8.3 8.3 0 0 1 10.06 3.93z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span class="mi-lbl">Settings</span>
            </button>
          </div>
          <!-- The switches (Away, Keep awake): each whole row is the control, a menuitemcheckbox whose
               aria-checked says on or off; the .switch at its right edge only shows it (aria-hidden).
               Away: app.js#paintAwayMenuRow (on = away). Keep awake: the keepAwake setting, app.js#paintKeepAwakeRow.
               A toggle leaves the menu open. -->
          <div class="msect sw-sect" role="group" aria-label="Switches">
            <button type="button" class="mi menu-item away-item sw-item" id="acct-away" role="menuitemcheckbox" aria-checked="false" data-state="here" data-min-level="simple"
                    title="worca answers waiting run questions for you while you're away." aria-description="worca answers waiting run questions for you while you're away.">
              <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <span class="mi-lbl">Away</span>
              <span class="mi-hint"></span>
              <span class="switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="mi menu-item sw-item on" id="acct-keepawake" role="menuitemcheckbox" aria-checked="true" data-min-level="simple"
                    title="Keeps the computer awake while runs are working. The display may still turn off." aria-description="Keeps the computer awake while runs are working. The display may still turn off.">
              <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"></path><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M9 3.5v2.5M12.5 3.5v2.5"></path></svg>
              <span class="mi-lbl">Keep awake</span>
              <span class="switch" aria-hidden="true"></span>
            </button>
          </div>
          <!-- Appearance, one row: its visible label (it names the group) and three icon segments, the
               same three modes as Settings › General (app.js#paintTheme paints both). Each segment
               is named only by its aria-label. A pick applies and saves; the menu stays open. -->
          <div class="msect theme-sect" role="group" aria-labelledby="acct-theme-k">
            <span class="theme-k" id="acct-theme-k">Appearance</span>
            <div class="theme-seg" id="acct-theme">
              <button type="button" class="theme-ic on" role="menuitemradio" aria-checked="true" data-theme-mode="system" data-min-level="simple" aria-label="System" title="System">
                <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"></path><path d="M8.5 19.5h7M12 15.5v4"></path></svg>
              </button>
              <button type="button" class="theme-ic" role="menuitemradio" aria-checked="false" data-theme-mode="light" data-min-level="simple" aria-label="Light" title="Light">
                <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
              </button>
              <button type="button" class="theme-ic" role="menuitemradio" aria-checked="false" data-theme-mode="dark" data-min-level="simple" aria-label="Dark" title="Dark">
                <svg class="mi-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="menu nav-fly lvl-menu" id="lvl-menu" role="menu" aria-label="Interface mode" data-min-level="simple" hidden></div>
      </aside>
