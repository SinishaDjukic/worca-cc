    <h1>Rate limits</h1>
    <p id="para">The ACME API uses a token bucket per API key. Each bucket refills at 10 tokens per second and holds at most 100 tokens.</p>
    <p>When a bucket is empty, requests fail with HTTP 429 until it refills.</p>
  </main>
